openapi: 3.1.0
info:
  title: bookq API
  version: "1.0.0"
  description: |
    bookq サーバ/クライアント間の単一の正 (single source of truth)。

    この spec は手入れする正本であり、FastAPI 実装からの自動生成物ではない。
    FastAPI (`app/`) と Rust (`rust/viewer-rs`) の両実装はこの spec に対して
    Schemathesis 契約テストで検証される。Web クライアントの型
    (`web/static/api/api-types.d.ts`) と JSON バンドル (`api/dist/*.json`)
    は `scripts/api/codegen.sh` でこの spec から生成し、iOS クライアントは
    適合テスト (`ios/BookqTests/SpecConformanceTests.swift`) で契約遵守を
    検証する。

    ## 認証

    全 `/api/**`・`/image/**`・`/thumb/**`・`/view/**`・`/ws/**` は認証必須。

    - `cookieAuth`: Google OAuth → 署名 session cookie（ブラウザ向け、現行）
    - `bearerAuth`: `POST /api/v1/auth/token` で発行する Bearer token
      （ネイティブ向け、RFC 8252 PKCE フロー）

    ## 共通セマンティクス

    ### パス文字列
    `folder` / `{path}` 系パラメータはすべてダウンロードルート相対の
    POSIX パス。先頭・末尾 `/` 不可、`..` 不可。URL 埋め込み時は
    **セグメント単位で percent-encode** する（`/` → `%2F` にしない。
    全体 encode は別 URL になりキャッシュ不一致を起こす）。

    ### 書庫の仮想フォルダ
    `.zip .cbz .rar .cbr .epub` は `type: "folder", archive: true` の
    ノードとして現れる。書庫内部のパスは longest-prefix 解決:
    `<…>/work.cbz/vol01/page.png` は書庫 `work.cbz` のエントリ
    `vol01/page.png` を指す。`.pdf` は `archive: true, pdf: true`。

    ### ツリーの flatten
    「画像を持たず子フォルダが1つだけ」のフォルダは親に潰し込まれ、
    子ノードの `name` が `"parent/child"` になる。`name` が `/` を
    含むのはこの規約による正常形であり、クライアントはそのまま
    パス連結に使ってよい。

    ### サムネイル解決
    ノードの `thumb` / `thumbs[]` は**フォルダ相対のファイル名**。
    クライアントは `/image/<fullPath>/<thumb>` に解決する
    （`fullPath` = 親パス + `name` の連結）。

    ### インデックス構築中
    メタデータインデックス構築中は `202 + Retry-After` を返す。
    クライアントは Retry-After 後に同一リクエストを再送する。

    ### 排他・鮮度
    `generation` はライブラリ世代番号。`since=<generation>` で
    既知世代と一致する場合 304 を返す。メディア endpoint は
    `ETag` / `If-None-Match` と `Range: bytes=` をサポートする。

    ### 隠しルート（セキュリティ契約）
    hidden roots は**ライブラリ全体で共有**（全認証ユーザーに同一の
    セットが効く）。hidden roots 配下のコンテンツは
    **サーバ側で除外**する。クライアント側フィルタはレスポンス本体に
    該当データを含めてしまうため認めない。`include_hidden=true` は
    この共有 hidden セットの除外をスキップする（閲覧者個人の
    全表示モード用。一時的・非永続）。

    ## v0 退役方針（#212 / #407）

    `deprecated: true` の v0 互換面（`/api/folders` 等 10 path）は
    viewer (Python) 停止と同時に廃止する（#410 の Python 撤去で
    自然に消える）。viewer-rs は v0 を native 実装しない
    （upstream proxy のまま → v0 停止時に upstream は不要）。
    PWA / iOS / Android と `scripts/prod_monitor.py` は v1 移行済み。

    `Deprecation` / `Sunset` 応答ヘッダは送らない。
    Python バックエンドは凍結中（`app/` untouched）のため二重実装の
    コストに見合わず、具体的な退役日の確定は #212 に委ねる。
    それまでは本 spec の `deprecated: true` + 各 v0 operation の
    Sunset 記載を正とする。

    ## 振る舞いの正本

    wire shape に表れない意味論（ETag 世代・positions LWW・
    visibility owner HMAC・PKCE ライフサイクル・gzip 対象）は
    **`api/v1-semantics.md`** が正本。spec と併せて読むこと。

  contact:
    name: bookq

servers:
  - url: /
    description: Same origin (production behind tailscale serve)

tags:
  - name: meta
  - name: tree
  - name: search
  - name: media
  - name: state
  - name: auth
  - name: library

paths:
  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: 死活監視
      security: []  # 監視用に認証不要とする（要決定: 認証必須にするなら外す）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
              examples:
                default:
                  summary: 正常系
                  value: {status: ok}

  /api/v1/version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: サーババージョン
      description: |
        認証必須 (#359)。未認証は 401。sha/build_date の公開面漏洩を防ぐため
        health と異なり `security: []` を付けない (全体既定の認証を継承)。
      responses:
        "200":
          description: "バージョン情報。`Cache-Control: no-store`"
          content:
            application/json:
              schema:
                type: object
                required: [version, sha, build_date]
                properties:
                  version: {type: string}
                  sha: {type: string}
                  build_date: {type: string}
              examples:
                default:
                  summary: 正常系
                  value:
                    version: "1.0.0"
                    sha: "abc1234"
                    build_date: "2026-05-01T00:00:00Z"
        "401": {description: 未認証}

  /api/v1/tree:
    get:
      tags: [tree]
      operationId: getTree
      summary: フォルダツリー取得（全木または浅い一覧）
      description: |
        `depth` 省略で全木を返す。`depth>=1` で `path` 直下の
        folder 型子ノードのみを浅く返す（`children: []`、`metadata`/
        `subtree_facets` キーなし）。

        `since` に既知の `generation` を渡すと、一致時 304、
        不一致時は全木を返す（`since` 指定時は常に全木モード）。
      parameters:
        - name: path
          in: query
          schema: {type: string, default: ""}
          description: サブツリーパス（空 = ルート）
        - name: depth
          in: query
          schema: {type: integer, minimum: 1}
          description: 省略 = 全木
        - name: since
          in: query
          schema: {type: integer}
          description: 既知 generation。一致 = 304
      responses:
        "200":
          description: "ツリー。`ETag` + `Cache-Control: private, max-age=60`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TreeResponse"}
              examples:
                default:
                  summary: 全木（flatten・サムネ解決込み）
                  value:
                    kind: tree
                    generation: 7
                    nodes:
                      - name: "Series"
                        type: folder
                        children:
                          - name: "vol1"
                            type: folder
                            thumb: "p00.jpg"
                            children:
                              - name: "p00.jpg"
                                type: image
                              - name: "p01.jpg"
                                type: image
                      - name: "work.cbz"
                        type: folder
                        archive: true
                        thumb: "cover.jpg"
                        children: []
                children:
                  summary: depth=1 の浅い一覧
                  value:
                    kind: children
                    generation: 7
                    nodes:
                      - name: "Series"
                        type: folder
                        children: []
                      - name: "work.cbz"
                        type: folder
                        archive: true
                        children: []
        "202": {$ref: "#/components/responses/IndexBuilding"}
        "304": {description: since が generation に一致（本体なし）}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/images:
    get:
      tags: [tree]
      operationId: listImages
      summary: フォルダ / 書庫 / 書庫内プレフィックスの画像一覧
      description: |
        `folder` が通常ディレクトリなら直下の画像名、書庫ファイルなら
        書庫内エントリ名、書庫内プレフィックスならその配下の相対名を返す。
        再帰しない（直下のみ）。順序は natural sort（漢数字正規化含む）。
      parameters:
        - name: folder
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 画像名リスト
          content:
            application/json:
              schema:
                type: object
                required: [folder, images]
                properties:
                  folder: {type: string}
                  images:
                    type: array
                    items: {type: string}
              examples:
                default:
                  summary: 正常系（natural sort 済み）
                  value:
                    folder: "Series/vol1"
                    images: ["p00.jpg", "p01.jpg", "p02.jpg"]
                empty:
                  summary: 画像なしフォルダ
                  value:
                    folder: "Series/empty"
                    images: []
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "501":
          description: 書庫形式は解釈可能だが展開ツールが無い（RAR compressed entry 等）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/search:
    get:
      tags: [search]
      operationId: search
      summary: 作品検索
      parameters:
        - name: q
          in: query
          schema: {type: string, default: ""}
        - name: artist
          in: query
          schema: {type: string, default: ""}
        - name: tag
          in: query
          schema: {type: string, default: ""}
          description: カンマ区切り
        - name: sort
          in: query
          schema: {type: string, default: relevance, enum: [relevance]}
        - name: include_hidden
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: 検索結果（relevance 降順）
          content:
            application/json:
              schema:
                type: object
                required: [query, total, results]
                properties:
                  query: {type: string}
                  total: {type: integer}
                  results:
                    type: array
                    items: {$ref: "#/components/schemas/ComicMetadata"}
              examples:
                default:
                  summary: 正常系（1件ヒット）
                  value:
                    query: "vol1"
                    total: 1
                    results:
                      - folder_path: "Series/vol1"
                        folder_name: "vol1"
                        title_jp: "サンプル作品"
                        title_en: "Sample Work"
                        artist: ["sample-artist"]
                        tags: ["tag1", "tag2"]
                        source: "test"
                        has_metadata: true
                        total_pages: 3
                empty:
                  summary: ヒットなし
                  value:
                    query: "no-such-work"
                    total: 0
                    results: []
        "202": {$ref: "#/components/responses/IndexBuilding"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/facets:
    get:
      tags: [search]
      operationId: getFacets
      summary: フィルタ用ファセット一覧
      parameters:
        - name: path
          in: query
          schema: {type: string, default: ""}
          description: スコープするサブツリーパス（空 = 全体）
        - name: include_hidden
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: 利用可能なファセット値
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Facets"}
              examples:
                default:
                  summary: 正常系
                  value:
                    artists: ["sample-artist"]
                    tags: ["tag1", "tag2"]
        "202": {$ref: "#/components/responses/IndexBuilding"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/index/refresh:
    post:
      tags: [meta]
      operationId: refreshIndex
      summary: メタデータインデックス同期再構築
      description: 完了後にレスポンスを返す。次の /api/v1/tree 読み取りは新内容を見る。
      responses:
        "200":
          description: 再構築完了
          content:
            application/json:
              schema:
                type: object
                required: [status, folders]
                properties:
                  status: {type: string, enum: [ok]}
                  folders: {type: integer, description: インデックスされた作品数}
              examples:
                default:
                  summary: 正常系
                  value: {status: ok, folders: 3}

  /api/v1/thumb-sprite:
    get:
      tags: [media]
      operationId: getThumbSprite
      summary: コンタクトシート（multi-thumb グリッド用合成画像）
      parameters:
        - name: folder
          in: query
          required: true
          schema: {type: string, minLength: 1}
          description: 書庫ファイルまたはディレクトリ
          example: "Series/vol1"
        - name: names
          in: query
          required: true
          schema: {type: string, minLength: 1}
          description: カンマ区切りエントリ名（folder 相対。上限あり、超過分は無視）
          example: "p00.jpg,p01.jpg,p02.jpg"
        - name: w
          in: query
          schema: {type: string, default: "400"}
          description: 200/400/800 のいずれか。それ以外（非数値含む）は 400 に正規化
        - name: rows
          in: query
          schema: {type: string}
          description: 例 `3,3,3` — 2D グリッド構成。省略・不正値は横ストリップへフォールバック
      responses:
        "200":
          description: 合成 JPEG
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /image/{path}:
    get:
      tags: [media]
      operationId: getImage
      summary: 画像本体（Range / ETag 対応）
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: セグメント単位 percent-encode 済みパス
          example: "Series/vol1/p00.jpg"
        - name: Range
          in: header
          schema: {type: string, pattern: '^bytes='}
          description: 単一 Range のみ (`bytes=start-end` / `bytes=start-` / `bytes=-N`)。複数 Range (`bytes=0-99,200-299`) は契約外で 200 フルとして応答する (#403)。
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        "200":
          description: 画像バイナリ (複数 Range 指定時も 200 フル — multipart/byteranges は返さない #403)
          content:
            image/*:
              schema: {type: string, format: binary}
            application/*:
              schema: {type: string, format: binary}
            text/*:
              schema: {type: string}
        "206":
          description: 単一 Range レスポンス
          content:
            image/*:
              schema: {type: string, format: binary}
            application/*:
              schema: {type: string, format: binary}
            text/*:
              schema: {type: string}
        "304": {description: ETag 一致}
        "400":
          description: |
            不正な Range ヘッダ等。viewer-rs の Range 検証は
            `text/plain` ボディを返す（`{"detail": …}` JSON とは別形式）。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
            text/plain:
              schema: {type: string}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "416":
          description: |
            Range がファイル長を超過（`bytes=N-` や `bytes=a-b` で
            a ≥ size、`bytes=-0` 等の unsatisfiable 指定）
          content:
            text/plain:
              schema: {type: string}
        "501":
          description: |
            抽出/描画不能 — 圧縮 multipart RAR のエントリ、または libpdfium
            無し環境での PDF ページ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /thumb/{path}:
    get:
      tags: [media]
      operationId: getThumb
      summary: リサイズ JPEG サムネイル
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          example: "Series/vol1/p00.jpg"
        - name: w
          in: query
          schema: {type: string, default: "400"}
          description: 200/400/800 のいずれか。それ以外（非数値含む）は 400 に正規化
      responses:
        "200":
          description: サムネ JPEG
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501":
          description: 非画像などネイティブでサムネ生成不能なソース
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /view/{path}:
    get:
      tags: [media]
      operationId: getView
      summary: リーダー用正規化ページ
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          example: "Series/vol1/p00.jpg"
      responses:
        "200":
          description: 正規化画像
          content:
            image/*:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "501":
          description: 非画像などネイティブで正規化不能なソース
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/reading-positions:
    get:
      tags: [state]
      operationId: listReadingPositions
      summary: 呼び出しユーザーの読書位置一覧（per-folder LWW）
      parameters:
        - name: folder
          in: query
          schema: {type: string}
          description: 指定時はその作品の位置のみ
      responses:
        "200":
          description: 位置レコード群
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items: {$ref: "#/components/schemas/ReadingPosition"}
              examples:
                default:
                  summary: 正常系（2件）
                  value:
                    positions:
                      - folder: "Series/vol1"
                        page: 2
                        total: 10
                        ts: 1716000000000
                      - folder: "work.cbz"
                        page: 0
                        total: 5
                        ts: 1715900000000
                single:
                  summary: folder 絞り込み（1件）
                  value:
                    positions:
                      - folder: "Series/vol1"
                        page: 2
                        total: 10
                        ts: 1716000000000
                empty:
                  summary: 記録なし
                  value: {positions: []}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    put:
      tags: [state]
      operationId: putReadingPosition
      summary: 読書位置の記録（newest ts wins）
      parameters:
        - name: folder
          in: query
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page, total, ts]
              properties:
                page: {type: integer, minimum: 0}
                total: {type: integer, minimum: 1}
                ts:
                  type: integer
                  minimum: 0
                  description: クライアント ms epoch。未来側は ±5min クランプ
            examples:
              default:
                summary: 正常系リクエスト
                value: {page: 2, total: 10, ts: 1716000000000}
      responses:
        "200":
          description: |
            `{"status":"ok"}` 受理、`{"status":"stale"}` 既知より古い ts で棄却
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok, stale]}
              examples:
                default:
                  summary: 正常系（受理）
                  value: {status: ok}
                ok:
                  summary: 受理
                  value: {status: ok}
                stale:
                  summary: 古い ts で棄却（newest-wins）
                  value: {status: stale}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    delete:
      tags: [state]
      operationId: deleteReadingPosition
      summary: 読書位置の消去
      parameters:
        - name: folder
          in: query
          schema: {type: string, minLength: 1}
          description: 省略時は全件消去（既存「全消去」ハーネス相当）
      responses:
        "200":
          description: 消去完了
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
              examples:
                default:
                  summary: 正常系
                  value: {status: ok}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /api/v1/folder-visibility:
    get:
      tags: [state]
      operationId: getFolderVisibility
      summary: ライブラリ共有の隠しルート一覧（全ユーザー共通）
      responses:
        "200":
          description: "可視性スナップショット。`Cache-Control: private, no-store`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FolderVisibility"}
              examples:
                default:
                  summary: 正常系（1件 hidden）
                  value:
                    owner: "owner-abc123"
                    revision: 4
                    hiddenRoots: ["Secret"]
                empty:
                  summary: hidden なし
                  value:
                    owner: "owner-abc123"
                    revision: 4
                    hiddenRoots: []
        "503":
          description: ストア読み取り失敗（fail-closed：フィルタなし一覧は返さない）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      tags: [state]
      operationId: putFolderVisibility
      summary: 隠しルートの単項目トグル（v0 と同一契約）
      parameters:
        - name: x-bookq-visibility-owner
          in: header
          required: true
          schema: {type: string}
          description: GET が返した `owner` トークンをエコーバック
      requestBody:
        required: true
        description: "body は `{root, hidden}` の2キーのみ（追加キーは 400）"
        content:
          application/json:
            schema:
              type: object
              required: [root, hidden]
              additionalProperties: false
              properties:
                root: {type: string, description: 先頭パスセグメント（書庫名も可）}
                hidden: {type: boolean}
            examples:
              hide:
                summary: 隠す
                value: {root: "Secret", hidden: true}
              unhide:
                summary: 戻す
                value: {root: "Secret", hidden: false}
      responses:
        "200":
          description: 更新後スナップショット
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FolderVisibility"}
              examples:
                default:
                  summary: 更新後
                  value:
                    owner: "owner-def456"
                    revision: 5
                    hiddenRoots: ["Secret"]
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/auth/token:
    post:
      tags: [auth]
      operationId: exchangeToken
      summary: 認可コード / リフレッシュトークンを Bearer token に交換
      description: |
        ネイティブクライアント向け（RFC 8252）。`/auth/login?client=native`
        が custom scheme (`bookq://auth?code=…`) にリダイレクトし、
        その `code` + PKCE `code_verifier` をここで交換する。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [grant_type, code, code_verifier]
                  properties:
                    grant_type: {type: string, const: authorization_code}
                    code: {type: string, minLength: 1}
                    code_verifier: {type: string, minLength: 1}
                - type: object
                  required: [grant_type, refresh_token]
                  properties:
                    grant_type: {type: string, const: refresh_token}
                    refresh_token: {type: string, minLength: 1}
            examples:
              authorization_code:
                summary: 認可コード交換
                value:
                  grant_type: authorization_code
                  code: "authcode-123"
                  code_verifier: "dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"
              refresh_token:
                summary: リフレッシュ
                value:
                  grant_type: refresh_token
                  refresh_token: "refresh-abc"
      responses:
        "200":
          description: トークン発行
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, const: Bearer}
                  expires_in: {type: integer, description: 秒}
                  refresh_token: {type: string}
              examples:
                default:
                  summary: 正常系
                  value:
                    access_token: "eyJhbGciOiJIUzI1NiJ9.spec-example"
                    token_type: Bearer
                    expires_in: 3600
                    refresh_token: "refresh-abc123"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {description: コード / verifier / refresh token 不正}

  # ── library edit ────────────────────────────────────────────────────
  # ライブラリへの書き込み面。対応形式は .zip .cbz .rar .cbr .epub .pdf
  # (serve.rs::ARCHIVE_EXTENSIONS + PDF_EXTENSIONS)。衝突は `name (1).ext`
  # 形式の自動リネーム、書き込みは tmp + atomic rename。意味論の正本は
  # `v1-semantics.md` §8。
  /api/v1/library/files:
    post:
      tags: [library]
      operationId: uploadLibraryFiles
      summary: 作品ファイルのアップロード（multipart・1〜複数ファイル）
      description: |
        `dir`（ルート相対。省略・空 = ライブラリルート）直下に multipart の
        `file` フィールドを保存する。`dir` は実在ディレクトリ必須
        （書庫ファイルや `.bookq-uploads` 配下は 400、不存在は 404）。
        同名が既にある場合は `name (n).ext` で自動リネームし、採用名を
        `files[].name` で返す。

        リクエスト単位の失敗（dir 不正・file フィールドなし等）は 4xx。
        ファイル単位の失敗は 200 の `errors[]` に `{name, code}` で列挙する
        （`invalid_name` / `unsupported_type` / `too_large` / `io_error` /
        `conflict` (dedupe 名が尽きた) / `malformed` (multipart が途中で
        切れた)）。非UTF-8 で復号不能な filename は `name:"?"`、
        `malformed` は `name:"*"` の sentinel を使う。
        大容量や途中再開が要る場合は `POST /api/v1/library/uploads` の
        分割アップロードを使うこと。
      parameters:
        - name: dir
          in: query
          schema: {type: string, default: ""}
          description: 保存先フォルダ（ルート相対、空 = ルート）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  items: {type: string, format: binary}
                  minItems: 1
      responses:
        "200":
          description: 受理結果（errors が空なら全件成功）
          content:
            application/json:
              schema:
                type: object
                required: [files, errors]
                properties:
                  files:
                    type: array
                    items: {$ref: "#/components/schemas/LibraryFileEntry"}
                  errors:
                    type: array
                    items: {$ref: "#/components/schemas/LibraryFileError"}
              examples:
                default:
                  summary: 全件成功
                  value:
                    files:
                      - {name: "work.rar", path: "Series/work.rar", size: 12345678}
                    errors: []
                renamed:
                  summary: 衝突で自動リネーム
                  value:
                    files:
                      - {name: "work (1).rar", path: "Series/work (1).rar", size: 12345678}
                    errors: []
                partial:
                  summary: 一部失敗
                  value:
                    files:
                      - {name: "a.cbz", path: "Series/a.cbz", size: 1000}
                    errors:
                      - {name: "b.txt", code: "unsupported_type"}
        "400":
          description: |
            パラメータ不正。multipart 自体が不正（boundary 欠損等）な場合は
            extractor がハンドラ到達前に `text/plain` を返す（/image の 400
            と同じ二形式）。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
            text/plain:
              schema: {type: string}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503":
          description: uploads が無効（library 書き込み不可のデプロイ）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      tags: [library]
      operationId: deleteLibraryFile
      summary: 作品ファイル / フォルダの削除
      description: |
        `path`（ルート相対、必須）を削除する。ファイルは単体削除、
        ディレクトリは配下ごと再帰削除。ルート（空パス）・
        `.bookq-uploads` 配下・存在しないパスはそれぞれ 400/400/404。
        読書位置やクライアント側オフラインキャッシュは消えない
        （孤立するが無害 — v1-semantics.md §8）。
      parameters:
        - name: path
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: 削除完了
          content:
            application/json:
              schema:
                type: object
                required: [deleted, kind]
                properties:
                  deleted: {type: string, description: 削除したルート相対パス}
                  kind: {type: string, enum: [file, dir]}
              examples:
                file:
                  summary: ファイル削除
                  value: {deleted: "Series/work.rar", kind: file}
                dir:
                  summary: フォルダ削除（再帰）
                  value: {deleted: "Series/vol1", kind: dir}
        "400":
          description: パラメータ不正（空・ルート・`.bookq-uploads` 配下）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "503":
          description: uploads が無効（library 書き込み不可のデプロイ）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/library/uploads:
    post:
      tags: [library]
      operationId: createLibraryUpload
      summary: 分割アップロードセッション開始
      description: |
        再開可能な分割アップロード。init（本 op）→
        `PUT /api/v1/library/uploads/{id}` で `Upload-Offset` 順に chunk を
        append → `POST .../finalize` でライブラリへ確定。セッションは
        `<library>/.bookq-uploads/<id>/` に保持され再起動をまたぐ。
        `name`/`dir` の検証は `/files` と同一、`size` は確定後の総バイト数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              additionalProperties: false
              properties:
                dir: {type: string, default: ""}
                name: {type: string, minLength: 1}
                size: {type: integer, minimum: 1}
            examples:
              default:
                summary: セッション開始
                value: {dir: "Series", name: "work.rar", size: 500000000}
      responses:
        "201":
          description: セッション作成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryUploadInit"}
              examples:
                default:
                  summary: 正常系
                  value: {upload_id: "3f2c9a1b7d4e4f0a9c8b7a6d5e4f3c2b", offset: 0}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413":
          description: "`size` が `BOOKQ_UPLOAD_MAX_BYTES` 超過"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415":
          description: 対応外の拡張子
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "503":
          description: uploads が無効（library 書き込み不可のデプロイ）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/library/uploads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: createLibraryUpload が発行した upload_id
    get:
      tags: [library]
      operationId: getLibraryUpload
      summary: セッション状態（再開位置の確認）
      responses:
        "200":
          description: セッション状態
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryUploadState"}
              examples:
                default:
                  summary: 途中状態
                  value:
                    upload_id: "3f2c9a1b7d4e4f0a9c8b7a6d5e4f3c2b"
                    dir: "Series"
                    name: "work.rar"
                    size: 500000000
                    offset: 134217728
        "404": {$ref: "#/components/responses/NotFound"}
        "503":
          description: uploads が無効
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      tags: [library]
      operationId: appendLibraryUpload
      summary: チャンクの追記（offset 順）
      description: |
        ボディ（raw octet-stream）を `Upload-Offset` が示す位置から追記する。
        `Upload-Offset` はサーバの現在 `offset` と一致必須 — 不一致は
        **409 + `{offset: <現在値>}`** を返し、クライアントは返された
        offset から送り直す。`offset + len(body) > size` は 400。
        順序外・重複チャンクは offset 不一致で 409 になるため安全に再送できる。
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema: {type: integer, minimum: 0}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: 追記完了
          content:
            application/json:
              schema:
                type: object
                required: [offset]
                properties:
                  offset: {type: integer, minimum: 0}
              examples:
                default:
                  summary: 正常系
                  value: {offset: 167772160}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: offset 不一致（body の `offset` が現在の受領位置）
          content:
            application/json:
              schema:
                type: object
                required: [detail, code, offset]
                properties:
                  detail: {type: string}
                  code: {type: string, enum: [offset_mismatch]}
                  offset: {type: integer, minimum: 0}
              examples:
                default:
                  summary: offset 不一致
                  value: {detail: "offset mismatch", code: "offset_mismatch", offset: 33554432}
        "413":
          description: "`BOOKQ_UPLOAD_MAX_BYTES` 超過"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: uploads が無効
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      tags: [library]
      operationId: cancelLibraryUpload
      summary: セッション破棄
      responses:
        "204": {description: 破棄完了（本体なし）}
        "404": {$ref: "#/components/responses/NotFound"}
        "503":
          description: uploads が無効
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/library/uploads/{id}/finalize:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [library]
      operationId: finalizeLibraryUpload
      summary: セッション確定（ライブラリへ配置）
      description: |
        `offset == size` の時のみ受理。blob を fsync してから
        `dir` 内で自動リネームして atomic rename、セッションを掃除し、
        採用名を返す。未完は **409 + `{offset: <現在値>}`**。
      responses:
        "200":
          description: 確定完了
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryFileEntry"}
              examples:
                default:
                  summary: 正常系（リネームなし）
                  value: {name: "work.rar", path: "Series/work.rar", size: 500000000}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: |
            未完（`code:incomplete`、`offset` が現在の受領位置）または
            dedupe の空き名枯渇（`conflict`、detail のみ）
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: {type: string}
                  code: {type: string, enum: [incomplete, conflict]}
                  offset: {type: integer, minimum: 0}
              examples:
                incomplete:
                  summary: 未完
                  value: {detail: "upload incomplete", code: "incomplete", offset: 33554432}
                conflict:
                  summary: dedupe 枯渇
                  value: {detail: "no free filename slot"}
        "503":
          description: uploads が無効
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  # ── v0 互換 (deprecated: v1 へ移行後に削除) ────────────────────────
  # 退役方針 (#212/#407): 全 3 client は v1 移行済み。v0 応答には
  # `Deprecation: true` ヘッダを付与する。`Sunset` ヘッダは送出しない —
  # shutdown は viewer 停止時 (#410, 日付未定) のため暦日 Sunset は書けない。
  # 各 v0 operation の description に同旨を記載する。
  /api/folders:
    get:
      tags: [tree]
      deprecated: true
      operationId: legacyGetFolders
      summary: "[v0] GET /api/v1/tree を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。応答に Deprecation: true を付与（Sunset ヘッダは日付未定のため送出しない #212）。方針は info.description「v0 退役方針」。"
      parameters:
        - name: path
          in: query
          schema: {type: string, default: ""}
