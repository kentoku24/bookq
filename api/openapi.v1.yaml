    delete:
      tags: [state]
      deprecated: true
      operationId: legacyDeleteReadingPosition
      summary: "[v0] 最新レコードの消去"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。方針は info.description「v0 退役方針」。"
      parameters:
        - name: folder
          in: query
          schema: {type: string}
      responses:
        "200":
          description: 消去完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
