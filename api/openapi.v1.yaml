                  version: {type: string}
                  sha: {type: string}
                  build_date: {type: string}

  /api/thumb-sprite:
    get:
      tags: [media]
      deprecated: true
      operationId: legacyThumbSprite
      summary: "[v0] GET /api/v1/thumb-sprite を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。応答に Deprecation: true を付与（Sunset ヘッダは日付未定のため送出しない #212）。方針は info.description「v0 退役方針」。"
      parameters:
        - name: folder
          in: query
          required: true
          schema: {type: string, minLength: 1}
          example: "Series/vol1"
        - name: names
          in: query
          required: true
          schema: {type: string, minLength: 1}
          example: "p00.jpg,p01.jpg,p02.jpg"
        - name: w
          in: query
          schema: {type: string, default: "400"}
          description: 200/400/800 のいずれか。それ以外（非数値含む）は 400 に正規化
        - name: rows
          in: query
          schema: {type: string}
      responses:
        "200":
          description: 合成 JPEG
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/reading-position:
    get:
      tags: [state]
      deprecated: true
      operationId: legacyGetReadingPosition
      summary: "[v0] ユーザー最新1件のみ。/api/v1/reading-positions を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。応答に Deprecation: true を付与（Sunset ヘッダは日付未定のため送出しない #212）。方針は info.description「v0 退役方針」。"
      responses:
        "200":
          description: "`{position: レコードまたは null}` — 常にオブジェクト envelope"
          content:
            application/json:
              schema:
                type: object
                required: [position]
                properties:
                  position:
                    oneOf:
                      - $ref: "#/components/schemas/ReadingPosition"
                      - type: "null"
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    put:
      tags: [state]
      deprecated: true
      operationId: legacyPutReadingPosition
      summary: "[v0] newest-ts-wins 単一レコード"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。応答に Deprecation: true を付与（Sunset ヘッダは日付未定のため送出しない #212）。方針は info.description「v0 退役方針」。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, page, total]
              properties:
                folder: {type: string, minLength: 1}
                page: {type: integer, minimum: 0}
                total: {type: integer, minimum: 1}
                ts:
                  type: [integer, "null"]
                  minimum: 0
                  description: クライアント ms epoch。省略/null = サーバ受信時刻
      responses:
        "200":
          description: 適用結果（ok = 採用、stale = 古い ts で棄却）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok, stale]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    delete:
      tags: [state]
      deprecated: true
      operationId: legacyDeleteReadingPosition
      summary: "[v0] 最新レコードの消去"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。応答に Deprecation: true を付与（Sunset ヘッダは日付未定のため送出しない #212）。方針は info.description「v0 退役方針」。"
      parameters:
        - name: folder
          in: query
          schema: {type: string}
      responses:
        "200":
          description: 消去完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /api/folder-visibility:
    get:
      tags: [state]
      deprecated: true
      operationId: legacyGetFolderVisibility
      summary: "[v0] GET /api/v1/folder-visibility を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。応答に Deprecation: true を付与（Sunset ヘッダは日付未定のため送出しない #212）。方針は info.description「v0 退役方針」。"
      responses:
        "200":
          description: "可視性スナップショット。`Cache-Control: private, no-store`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FolderVisibility"}
    put:
      tags: [state]
      deprecated: true
      operationId: legacyPutFolderVisibility
      summary: "[v0] PUT /api/v1/folder-visibility を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。応答に Deprecation: true を付与（Sunset ヘッダは日付未定のため送出しない #212）。方針は info.description「v0 退役方針」。"
      parameters:
        - name: x-bookq-visibility-owner
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, hidden]
              additionalProperties: false
              properties:
                root: {type: string}
                hidden: {type: boolean}
      responses:
        "200":
          description: 更新後の可視性スナップショット
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FolderVisibility"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Google OAuth 後の署名 session cookie（ブラウザ向け）
    bearerAuth:
      type: http
      scheme: bearer
      description: /api/v1/auth/token 発行の Bearer token（ネイティブ向け）

  responses:
    IndexBuilding:
      description: |
        メタデータインデックス構築中。`Retry-After` 秒後に再送。
        `Cache-Control: no-store`（SW/プライベートキャッシュ不可）。
      headers:
        Retry-After:
          schema: {type: integer, default: 2}
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail: {type: string, example: "metadata index building"}
          examples:
            index_building:
              summary: 構築中（Retry-After で再送）
              value: {detail: "metadata index building"}
    BadRequest:
      description: パラメータ不正
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            default:
              summary: パラメータ不正
              value: {detail: "invalid folder parameter"}
    Forbidden:
      description: パスがダウンロードルート外 / 権限なし
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            default:
              summary: 経路外アクセス
              value: {detail: "path escapes library root"}
            hidden:
              summary: hidden 配下（サーバ側除外）
              value: {detail: "path is hidden"}
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            default:
              summary: 対象なし
              value: {detail: "not found: Series/vol1"}
    Conflict:
      description: 競合（visibility owner mismatch 等の同時更新衝突）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            owner_mismatch:
              summary: visibility owner 不一致（stale タブ）
              value: {detail: "visibility owner mismatch", code: "owner_mismatch"}
    ValidationError:
      description: 入力バリデーション失敗（FastAPI 自動バリデーション。`detail` は issue 配列）
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items: {type: object}
          examples:
            default:
              summary: バリデーション失敗
              value:
                detail:
                  - {loc: ["query", "folder"], msg: "field required", type: "missing"}
    ServiceUnavailable:
      description: user-state ストアの読み書き失敗（fail-closed。ディスク/DB 障害時）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            default:
              summary: ストア障害（fail-closed）
              value: {detail: "user-state store unavailable"}

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
        code:
          type: string
          description: 機械可読コード（新規 endpoint で任意付与。v0 互換では省略可）

    TreeNode:
      type: object
      required: [name, type]
      description: |
        `name` は flatten 規約により `/` を含み得る（"parent/child"）。
        `thumb`/`thumbs` はフォルダ相対名で `/image/<fullPath>/<name>`
        に解決する。`metadata`/`subtree_facets` は値がある時のみ存在。
      properties:
        name: {type: string}
        type: {type: string, enum: [folder, image]}
        children:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/TreeNode"}
        thumb:
          type: [string, "null"]
          description: "サブツリー DFS 最初の画像のフォルダ相対名"
        thumbs:
          type: array
          items: {type: string}
          maxItems: 9
          description: 直下の 2+ サブフォルダが thumb を持つ時のみ存在
        archive: {type: boolean, description: 書庫仮想フォルダ}
        pdf: {type: boolean, description: 書庫かつ PDF}
        has_metadata: {type: boolean}
        metadata: {$ref: "#/components/schemas/ComicMetadata"}
        subtree_facets: {$ref: "#/components/schemas/Facets"}

    TreeResponse:
      type: object
      required: [kind, nodes, generation]
      properties:
        kind:
          type: string
          enum: [tree, children]
          description: tree=全木 / children=depth 指定の浅い一覧
        nodes:
          type: array
          items: {$ref: "#/components/schemas/TreeNode"}
        generation: {type: integer}

    ComicMetadata:
      type: object
      required: [folder_path, folder_name, artist, tags, source, has_metadata, total_pages]
      properties:
        folder_path: {type: string}
        folder_name: {type: string}
        title_jp: {type: string}
        title_en: {type: string}
        artist:
          type: array
          items: {type: string}
        tags:
          type: array
          items: {type: string}
        source: {type: string}
        has_metadata: {type: boolean}
        total_pages: {type: integer}

    Facets:
      type: object
      required: [artists, tags]
      description: "`{artists, tags}` のみ（parodies キーは返さない）"
      properties:
        artists:
          type: array
          items: {type: string}
        tags:
          type: array
          items: {type: string}

    ReadingPosition:
      type: object
      required: [folder, page, total, ts]
      properties:
        folder: {type: string, description: 不透明文字列。サーバは FS 解決しない}
        page: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        ts: {type: integer, description: ms epoch、newest-wins}

    FolderVisibility:
      type: object
      required: [owner, revision, hiddenRoots]
      properties:
        owner: {type: string, description: PUT 時に x-bookq-visibility-owner でエコーバック}
        revision: {type: integer}
        hiddenRoots:
          type: array
          items: {type: string}
          description: 先頭パスセグメント（書庫も対象）

    LibraryFileEntry:
      type: object
      required: [name, path, size]
      properties:
        name:
          type: string
          description: 採用されたファイル名（衝突時は `name (n).ext` に自動リネーム）
        path: {type: string, description: ルート相対パス}
        size: {type: integer, minimum: 0}

    LibraryFileError:
      type: object
      required: [name, code]
      properties:
        name: {type: string}
        code:
          type: string
          description: |
            `invalid_name` / `unsupported_type` / `too_large` / `io_error` /
            `conflict` (dedupe で空き名なし) / `malformed` (multipart が
            途中で切れた — `name` は `"*"` の sentinel)

    LibraryUploadInit:
      type: object
      required: [upload_id, offset]
      properties:
        upload_id: {type: string}
        offset: {type: integer, minimum: 0}

    LibraryUploadState:
      type: object
      required: [upload_id, dir, name, size, offset]
      properties:
        upload_id: {type: string}
        dir: {type: string, description: 保存先（ルート相対、空 = ルート）}
        name: {type: string}
        size: {type: integer, minimum: 0}
        offset: {type: integer, minimum: 0, description: 受領済みバイト数（次の追記開始位置）}

security:
  - cookieAuth: []
  - bearerAuth: []
