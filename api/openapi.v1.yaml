    put:
      tags: [state]
      deprecated: true
      operationId: legacyPutFolderVisibility
      summary: "[v0] PUT /api/v1/folder-visibility を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。方針は info.description「v0 退役方針」。"
      parameters:
        - name: x-bookq-visibility-owner
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, hidden]
              additionalProperties: false
              properties:
                root: {type: string}
                hidden: {type: boolean}
      responses:
        "200":
          description: 更新後の可視性スナップショット
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FolderVisibility"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Google OAuth 後の署名 session cookie（ブラウザ向け）
    bearerAuth:
      type: http
      scheme: bearer
      description: /api/v1/auth/token 発行の Bearer token（ネイティブ向け）

  responses:
    IndexBuilding:
      description: |
        メタデータインデックス構築中。`Retry-After` 秒後に再送。
        `Cache-Control: no-store`（SW/プライベートキャッシュ不可）。
      headers:
        Retry-After:
          schema: {type: integer, default: 2}
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail: {type: string, example: "metadata index building"}
    BadRequest:
      description: パラメータ不正
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: パスがダウンロードルート外 / 権限なし
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: 競合（visibility owner mismatch 等の同時更新衝突）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ValidationError:
      description: 入力バリデーション失敗（FastAPI 自動バリデーション。`detail` は issue 配列）
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items: {type: object}
    ServiceUnavailable:
      description: user-state ストアの読み書き失敗（fail-closed。ディスク/DB 障害時）
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
        code:
          type: string
          description: 機械可読コード（新規 endpoint で任意付与。v0 互換では省略可）

    TreeNode:
      type: object
      required: [name, type]
      description: |
        `name` は flatten 規約により `/` を含み得る（"parent/child"）。
        `thumb`/`thumbs` はフォルダ相対名で `/image/<fullPath>/<name>`
        に解決する。`metadata`/`subtree_facets` は値がある時のみ存在。
      properties:
        name: {type: string}
        type: {type: string, enum: [folder, image]}
        children:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/TreeNode"}
        thumb:
          type: [string, "null"]
          description: "サブツリー DFS 最初の画像のフォルダ相対名"
        thumbs:
          type: array
          items: {type: string}
          maxItems: 9
          description: 直下の 2+ サブフォルダが thumb を持つ時のみ存在
        archive: {type: boolean, description: 書庫仮想フォルダ}
        pdf: {type: boolean, description: 書庫かつ PDF}
        has_metadata: {type: boolean}
        metadata: {$ref: "#/components/schemas/ComicMetadata"}
        subtree_facets: {$ref: "#/components/schemas/Facets"}

    TreeResponse:
      type: object
      required: [kind, nodes, generation]
      properties:
        kind:
          type: string
          enum: [tree, children]
          description: tree=全木 / children=depth 指定の浅い一覧
        nodes:
          type: array
          items: {$ref: "#/components/schemas/TreeNode"}
        generation: {type: integer}

    ComicMetadata:
      type: object
      required: [folder_path, folder_name, artist, tags, source, has_metadata, total_pages]
      properties:
        folder_path: {type: string}
        folder_name: {type: string}
        title_jp: {type: string}
        title_en: {type: string}
        artist:
          type: array
          items: {type: string}
        tags:
          type: array
          items: {type: string}
        source: {type: string}
        has_metadata: {type: boolean}
        total_pages: {type: integer}

    Facets:
      type: object
      required: [artists, tags]
      description: "`{artists, tags}` のみ（parodies キーは返さない）"
      properties:
        artists:
          type: array
          items: {type: string}
        tags:
          type: array
          items: {type: string}

    ReadingPosition:
      type: object
      required: [folder, page, total, ts]
      properties:
        folder: {type: string, description: 不透明文字列。サーバは FS 解決しない}
        page: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        ts: {type: integer, description: ms epoch、newest-wins}

    FolderVisibility:
      type: object
      required: [owner, revision, hiddenRoots]
      properties:
        owner: {type: string, description: PUT 時に x-bookq-visibility-owner でエコーバック}
        revision: {type: integer}
        hiddenRoots:
          type: array
          items: {type: string}
          description: 先頭パスセグメント（書庫も対象）

security:
  - cookieAuth: []
  - bearerAuth: []
