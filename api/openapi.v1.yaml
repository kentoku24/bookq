openapi: 3.1.0
info:
  title: bookq API
  version: "1.0.0"
  description: |
    bookq サーバ/クライアント間の単一の正 (single source of truth)。

    この spec は手入れする正本であり、FastAPI 実装からの自動生成物ではない。
    FastAPI (`app/`) と Rust (`rust/viewer-rs`) の両実装はこの spec に対して
    Schemathesis 契約テストで検証される。Web クライアントの型
    (`app/static/api/api-types.d.ts`) と JSON バンドル (`api/dist/*.json`)
    は `scripts/api/codegen.sh` でこの spec から生成し、iOS クライアントは
    適合テスト (`ios/BookqTests/SpecConformanceTests.swift`) で契約遵守を
    検証する。

    ## 認証

    全 `/api/**`・`/image/**`・`/thumb/**`・`/view/**`・`/ws/**` は認証必須。

    - `cookieAuth`: Google OAuth → 署名 session cookie（ブラウザ向け、現行）
    - `bearerAuth`: `POST /api/v1/auth/token` で発行する Bearer token
      （ネイティブ向け、RFC 8252 PKCE フロー）

    ## 共通セマンティクス

    ### パス文字列
    `folder` / `{path}` 系パラメータはすべてダウンロードルート相対の
    POSIX パス。先頭・末尾 `/` 不可、`..` 不可。URL 埋め込み時は
    **セグメント単位で percent-encode** する（`/` → `%2F` にしない。
    全体 encode は別 URL になりキャッシュ不一致を起こす）。

    ### 書庫の仮想フォルダ
    `.zip .cbz .rar .cbr .epub` は `type: "folder", archive: true` の
    ノードとして現れる。書庫内部のパスは longest-prefix 解決:
    `<…>/work.cbz/vol01/page.png` は書庫 `work.cbz` のエントリ
    `vol01/page.png` を指す。`.pdf` は `archive: true, pdf: true`。

    ### ツリーの flatten
    「画像を持たず子フォルダが1つだけ」のフォルダは親に潰し込まれ、
    子ノードの `name` が `"parent/child"` になる。`name` が `/` を
    含むのはこの規約による正常形であり、クライアントはそのまま
    パス連結に使ってよい。

    ### サムネイル解決
    ノードの `thumb` / `thumbs[]` は**フォルダ相対のファイル名**。
    クライアントは `/image/<fullPath>/<thumb>` に解決する
    （`fullPath` = 親パス + `name` の連結）。

    ### インデックス構築中
    メタデータインデックス構築中は `202 + Retry-After` を返す。
    クライアントは Retry-After 後に同一リクエストを再送する。

    ### 排他・鮮度
    `generation` はライブラリ世代番号。`since=<generation>` で
    既知世代と一致する場合 304 を返す。メディア endpoint は
    `ETag` / `If-None-Match` と `Range: bytes=` をサポートする。

    ### 隠しルート（セキュリティ契約）
    hidden roots は**ライブラリ全体で共有**（全認証ユーザーに同一の
    セットが効く）。hidden roots 配下のコンテンツは
    **サーバ側で除外**する。クライアント側フィルタはレスポンス本体に
    該当データを含めてしまうため認めない。`include_hidden=true` は
    この共有 hidden セットの除外をスキップする（閲覧者個人の
    全表示モード用。一時的・非永続）。

    ## v0 退役方針（#212 / #407）

    `deprecated: true` の v0 互換面（`/api/folders` 等 10 path）は
    viewer (Python) 停止と同時に廃止する（#410 の Python 撤去で
    自然に消える）。viewer-rs は v0 を native 実装しない
    （upstream proxy のまま → v0 停止時に upstream は不要）。
    PWA / iOS / Android と `scripts/prod_monitor.py` は v1 移行済み。

    `Deprecation` / `Sunset` 応答ヘッダは送らない。
    Python バックエンドは凍結中（`app/` untouched）のため二重実装の
    コストに見合わず、具体的な退役日の確定は #212 に委ねる。
    それまでは本 spec の `deprecated: true` + 各 v0 operation の
    Sunset 記載を正とする。

    ## 振る舞いの正本

    wire shape に表れない意味論（ETag 世代・positions LWW・
    visibility owner HMAC・PKCE ライフサイクル・gzip 対象）は
    **`api/v1-semantics.md`** が正本。spec と併せて読むこと。

  contact:
    name: bookq

servers:
  - url: /
    description: Same origin (production behind tailscale serve)

tags:
  - name: meta
  - name: tree
  - name: search
  - name: media
  - name: state
  - name: auth

paths:
  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: 死活監視
      security: []  # 監視用に認証不要とする（要決定: 認証必須にするなら外す）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}

  /api/v1/version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: サーババージョン
      responses:
        "200":
          description: "バージョン情報。`Cache-Control: no-store`"
          content:
            application/json:
              schema:
                type: object
                required: [version, sha, build_date]
                properties:
                  version: {type: string}
                  sha: {type: string}
                  build_date: {type: string}

  /api/v1/tree:
    get:
      tags: [tree]
      operationId: getTree
      summary: フォルダツリー取得（全木または浅い一覧）
      description: |
        `depth` 省略で全木を返す。`depth>=1` で `path` 直下の
        folder 型子ノードのみを浅く返す（`children: []`、`metadata`/
        `subtree_facets` キーなし）。

        `since` に既知の `generation` を渡すと、一致時 304、
        不一致時は全木を返す（`since` 指定時は常に全木モード）。
      parameters:
        - name: path
          in: query
          schema: {type: string, default: ""}
          description: サブツリーパス（空 = ルート）
        - name: depth
          in: query
          schema: {type: integer, minimum: 1}
          description: 省略 = 全木
        - name: since
          in: query
          schema: {type: integer}
          description: 既知 generation。一致 = 304
      responses:
        "200":
          description: "ツリー。`ETag` + `Cache-Control: private, max-age=60`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TreeResponse"}
        "202": {$ref: "#/components/responses/IndexBuilding"}
        "304": {description: since が generation に一致（本体なし）}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/images:
    get:
      tags: [tree]
      operationId: listImages
      summary: フォルダ / 書庫 / 書庫内プレフィックスの画像一覧
      description: |
        `folder` が通常ディレクトリなら直下の画像名、書庫ファイルなら
        書庫内エントリ名、書庫内プレフィックスならその配下の相対名を返す。
        再帰しない（直下のみ）。順序は natural sort（漢数字正規化含む）。
      parameters:
        - name: folder
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 画像名リスト
          content:
            application/json:
              schema:
                type: object
                required: [folder, images]
                properties:
                  folder: {type: string}
                  images:
                    type: array
                    items: {type: string}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "501":
          description: 書庫形式は解釈可能だが展開ツールが無い（RAR compressed entry 等）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/search:
    get:
      tags: [search]
      operationId: search
      summary: 作品検索
      parameters:
        - name: q
          in: query
          schema: {type: string, default: ""}
        - name: artist
          in: query
          schema: {type: string, default: ""}
        - name: tag
          in: query
          schema: {type: string, default: ""}
          description: カンマ区切り
        - name: sort
          in: query
          schema: {type: string, default: relevance, enum: [relevance]}
        - name: include_hidden
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: 検索結果（relevance 降順）
          content:
            application/json:
              schema:
                type: object
                required: [query, total, results]
                properties:
                  query: {type: string}
                  total: {type: integer}
                  results:
                    type: array
                    items: {$ref: "#/components/schemas/ComicMetadata"}
        "202": {$ref: "#/components/responses/IndexBuilding"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/facets:
    get:
      tags: [search]
      operationId: getFacets
      summary: フィルタ用ファセット一覧
      parameters:
        - name: path
          in: query
          schema: {type: string, default: ""}
          description: スコープするサブツリーパス（空 = 全体）
        - name: include_hidden
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: 利用可能なファセット値
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Facets"}
        "202": {$ref: "#/components/responses/IndexBuilding"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/index/refresh:
    post:
      tags: [meta]
      operationId: refreshIndex
      summary: メタデータインデックス同期再構築
      description: 完了後にレスポンスを返す。次の /api/v1/tree 読み取りは新内容を見る。
      responses:
        "200":
          description: 再構築完了
          content:
            application/json:
              schema:
                type: object
                required: [status, folders]
                properties:
                  status: {type: string, enum: [ok]}
                  folders: {type: integer, description: インデックスされた作品数}

  /api/v1/thumb-sprite:
    get:
      tags: [media]
      operationId: getThumbSprite
      summary: コンタクトシート（multi-thumb グリッド用合成画像）
      parameters:
        - name: folder
          in: query
          required: true
          schema: {type: string, minLength: 1}
          description: 書庫ファイルまたはディレクトリ
          example: "Series/vol1"
        - name: names
          in: query
          required: true
          schema: {type: string, minLength: 1}
          description: カンマ区切りエントリ名（folder 相対。上限あり、超過分は無視）
          example: "p00.jpg,p01.jpg,p02.jpg"
        - name: w
          in: query
          schema: {type: string, default: "400"}
          description: 200/400/800 のいずれか。それ以外（非数値含む）は 400 に正規化
        - name: rows
          in: query
          schema: {type: string}
          description: 例 `3,3,3` — 2D グリッド構成。省略・不正値は横ストリップへフォールバック
      responses:
        "200":
          description: 合成 JPEG
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /image/{path}:
    get:
      tags: [media]
      operationId: getImage
      summary: 画像本体（Range / ETag 対応）
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          description: セグメント単位 percent-encode 済みパス
          example: "Series/vol1/p00.jpg"
        - name: Range
          in: header
          schema: {type: string, pattern: '^bytes='}
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        "200":
          description: 画像バイナリ
          content:
            image/*:
              schema: {type: string, format: binary}
        "206": {description: Range レスポンス}
        "304": {description: ETag 一致}
        "400":
          description: |
            不正な Range ヘッダ等。Starlette の FileResponse Range 処理は
            `text/plain` ボディを返す（`{"detail": …}` JSON とは別形式）。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
            text/plain:
              schema: {type: string}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /thumb/{path}:
    get:
      tags: [media]
      operationId: getThumb
      summary: リサイズ JPEG サムネイル
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          example: "Series/vol1/p00.jpg"
        - name: w
          in: query
          schema: {type: string, default: "400"}
          description: 200/400/800 のいずれか。それ以外（非数値含む）は 400 に正規化
      responses:
        "200":
          description: サムネ JPEG
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /view/{path}:
    get:
      tags: [media]
      operationId: getView
      summary: リーダー用正規化ページ
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          example: "Series/vol1/p00.jpg"
      responses:
        "200":
          description: 正規化画像
          content:
            image/*:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/reading-positions:
    get:
      tags: [state]
      operationId: listReadingPositions
      summary: 呼び出しユーザーの読書位置一覧（per-folder LWW）
      parameters:
        - name: folder
          in: query
          schema: {type: string}
          description: 指定時はその作品の位置のみ
      responses:
        "200":
          description: 位置レコード群
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items: {$ref: "#/components/schemas/ReadingPosition"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    put:
      tags: [state]
      operationId: putReadingPosition
      summary: 読書位置の記録（newest ts wins）
      parameters:
        - name: folder
          in: query
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page, total, ts]
              properties:
                page: {type: integer, minimum: 0}
                total: {type: integer, minimum: 1}
                ts:
                  type: integer
                  minimum: 0
                  description: クライアント ms epoch。未来側は ±5min クランプ
      responses:
        "200":
          description: |
            `{"status":"ok"}` 受理、`{"status":"stale"}` 既知より古い ts で棄却
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok, stale]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    delete:
      tags: [state]
      operationId: deleteReadingPosition
      summary: 読書位置の消去
      parameters:
        - name: folder
          in: query
          schema: {type: string, minLength: 1}
          description: 省略時は全件消去（既存「全消去」ハーネス相当）
      responses:
        "200":
          description: 消去完了
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /api/v1/folder-visibility:
    get:
      tags: [state]
      operationId: getFolderVisibility
      summary: ライブラリ共有の隠しルート一覧（全ユーザー共通）
      responses:
        "200":
          description: "可視性スナップショット。`Cache-Control: private, no-store`"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FolderVisibility"}
        "503":
          description: ストア読み取り失敗（fail-closed：フィルタなし一覧は返さない）
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      tags: [state]
      operationId: putFolderVisibility
      summary: 隠しルートの単項目トグル（v0 と同一契約）
      parameters:
        - name: x-bookq-visibility-owner
          in: header
          required: true
          schema: {type: string}
          description: GET が返した `owner` トークンをエコーバック
      requestBody:
        required: true
        description: "body は `{root, hidden}` の2キーのみ（追加キーは 400）"
        content:
          application/json:
            schema:
              type: object
              required: [root, hidden]
              additionalProperties: false
              properties:
                root: {type: string, description: 先頭パスセグメント（書庫名も可）}
                hidden: {type: boolean}
      responses:
        "200":
          description: 更新後スナップショット
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FolderVisibility"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/v1/auth/token:
    post:
      tags: [auth]
      operationId: exchangeToken
      summary: 認可コード / リフレッシュトークンを Bearer token に交換
      description: |
        ネイティブクライアント向け（RFC 8252）。`/auth/login?client=native`
        が custom scheme (`bookq://auth?code=…`) にリダイレクトし、
        その `code` + PKCE `code_verifier` をここで交換する。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [grant_type, code, code_verifier]
                  properties:
                    grant_type: {type: string, const: authorization_code}
                    code: {type: string, minLength: 1}
                    code_verifier: {type: string, minLength: 1}
                - type: object
                  required: [grant_type, refresh_token]
                  properties:
                    grant_type: {type: string, const: refresh_token}
                    refresh_token: {type: string, minLength: 1}
      responses:
        "200":
          description: トークン発行
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, const: Bearer}
                  expires_in: {type: integer, description: 秒}
                  refresh_token: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {description: コード / verifier / refresh token 不正}

  # ── v0 互換 (deprecated: v1 へ移行後に削除) ────────────────────────
  /api/folders:
    get:
      tags: [tree]
      deprecated: true
      operationId: legacyGetFolders
      summary: "[v0] GET /api/v1/tree を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。方針は info.description「v0 退役方針」。"
      parameters:
        - name: path
          in: query
          schema: {type: string, default: ""}
        - name: depth
          in: query
          schema: {type: integer, minimum: 1}
        - name: since
          in: query
          schema: {type: integer}
      responses:
        "200":
          description: |
            v0 は 3 shape を返す: `since` 指定時 `{tree, generation}`、
            それ以外はノード配列（素配列）。
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/TreeNode"}
                  - type: object
                    required: [tree, generation]
                    properties:
                      tree:
                        type: array
                        items: {$ref: "#/components/schemas/TreeNode"}
                      generation: {type: integer}
        "304": {description: since 一致}
        "202": {$ref: "#/components/responses/IndexBuilding"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/images:
    get:
      tags: [tree]
      deprecated: true
      operationId: legacyListImages
      summary: "[v0] 素配列を返す旧版。GET /api/v1/images を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。方針は info.description「v0 退役方針」。"
      parameters:
        - name: folder
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 画像名の素配列
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /api/search:
    get:
      tags: [search]
      deprecated: true
      operationId: legacySearch
      summary: "[v0] GET /api/v1/search を使う"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。方針は info.description「v0 退役方針」。"
      parameters:
