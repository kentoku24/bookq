      operationId: legacyPutReadingPosition
      summary: "[v0] newest-ts-wins 単一レコード"
      description: "v0 互換面。Sunset = viewer (Python) 停止と同時 (#407)。方針は info.description「v0 退役方針」。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, page, total]
              properties:
                folder: {type: string, minLength: 1}
                page: {type: integer, minimum: 0}
                total: {type: integer, minimum: 1}
                ts:
                  type: [integer, "null"]
                  minimum: 0
                  description: クライアント ms epoch。省略/null = サーバ受信時刻
      responses:
        "200":
