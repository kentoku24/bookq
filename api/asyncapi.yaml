asyncapi: "3.0.0"
info:
  title: bookq Reader Sync Protocol
  version: "1.0.0"
  description: |
    `/ws/reader-sync` の dual-reader 同期プロトコル。

    全フレームは JSON。`v` = プロトコルバージョン（現行 1）。
    1 フレーム最大 64KiB（MANIFEST チャンク合計 32MiB まで）。
    画像/バイナリはデータプレーンを通らない（必ず `/image/*` HTTP 経由）。

    ## 意味論

    - クライアント→サーバは「リクエストフレーム」:
      `{v, requestId, sessionId, workEpoch, baseRevision, type, payload}`
      サーバが受信順に逐次化（sequenced）して適用し、
      ACK/REJECT/APPLIED で応答する。
    - STATE フレームは `revision` 単調増加の完全スナップショット。
    - PING/PONG は keepalive（シーケンス対象外）。
    - SIGNAL / UI_SYNC は peer-to-peer 中継でシーケンスされない
      （UI_SYNC は ephemeral のみ、reader state を含んではならない）。
    - エラー応答の `code` は `ERR_VERSION | ERR_MALFORMED | ERR_TYPE |
      ERR_RANGE | ERR_SIZE`。

servers:
  bookq:
    host: "bookq.{tailnet}.ts.net:443"
    protocol: wss
    description: tailscale serve 経由（認証は cookieAuth or Bearer）

channels:
  readerSync:
    address: /ws/reader-sync
    title: Dual-reader sync
    messages:
      request: {$ref: "#/components/messages/Request"}
      hello: {$ref: "#/components/messages/Hello"}
      ack: {$ref: "#/components/messages/Ack"}
      reject: {$ref: "#/components/messages/Reject"}
      applied: {$ref: "#/components/messages/Applied"}
      state: {$ref: "#/components/messages/State"}
      manifest: {$ref: "#/components/messages/Manifest"}
      end: {$ref: "#/components/messages/End"}
      ping: {$ref: "#/components/messages/Ping"}
      pong: {$ref: "#/components/messages/Pong"}
      signal: {$ref: "#/components/messages/Signal"}
      uiSync: {$ref: "#/components/messages/UiSync"}
      transportState: {$ref: "#/components/messages/TransportState"}
      joinRequest: {$ref: "#/components/messages/JoinRequest"}
      joinCancel: {$ref: "#/components/messages/JoinCancel"}
      error: {$ref: "#/components/messages/Error"}

operations:
  sendRequest:
    action: send
    channel: {$ref: "#/channels/readerSync"}
    messages: [{$ref: "#/channels/readerSync/messages/request"}]
  receive:
    action: receive
    channel: {$ref: "#/channels/readerSync"}
    messages:
      - {$ref: "#/channels/readerSync/messages/hello"}
      - {$ref: "#/channels/readerSync/messages/ack"}
      - {$ref: "#/channels/readerSync/messages/reject"}
      - {$ref: "#/channels/readerSync/messages/applied"}
      - {$ref: "#/channels/readerSync/messages/state"}
      - {$ref: "#/channels/readerSync/messages/manifest"}
      - {$ref: "#/channels/readerSync/messages/end"}
      - {$ref: "#/channels/readerSync/messages/ping"}
      - {$ref: "#/channels/readerSync/messages/pong"}
      - {$ref: "#/channels/readerSync/messages/signal"}
      - {$ref: "#/channels/readerSync/messages/uiSync"}
      - {$ref: "#/channels/readerSync/messages/transportState"}
      - {$ref: "#/channels/readerSync/messages/joinRequest"}
      - {$ref: "#/channels/readerSync/messages/joinCancel"}
      - {$ref: "#/channels/readerSync/messages/error"}

components:
  messages:
    Request:
      title: クライアントリクエストフレーム
      payload: {$ref: "#/components/schemas/RequestFrame"}
    Hello:
      title: 接続直後の greeting
      payload:
        type: object
        required: [v, type, link]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: HELLO}
          link: {type: string, description: link id}
          features:
            type: array
            items: {type: string}
            description: server-supported feature tokens（現行 member-drive-v1）
    Ack:
      payload:
        type: object
        required: [v, type]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: ACK}
          requestId: {type: string}
          request: {type: string, description: 応答したリクエスト type}
          sessionId: {type: [string, "null"]}
          data:
            type: object
            description: |
              リクエスト種別ごとの結果。CREATE は
              `{sessionId, code, memberId, role, trust, resumeToken,
              expiresInSec, features, guestToken?}` — `trust` は admission
              時に固定される member|guest、`features` は server-supported
              feature tokens。`guestToken` は owner email が解決できる
              ときのみ発行されるゲストアクセストークン
              （QR の `/#/join/<code>?gt=<token>` リンク /
              `JOIN{guestToken}` / `bookq_guest` cookie の bearer。
              read-only・セッション連動失効）。
    Reject:
      payload:
        type: object
        required: [v, type, reason]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: REJECT}
          requestId: {type: string}
          reason: {type: string}
          sessionId: {type: [string, "null"]}
          snapshot:
            type: object
            description: |
              sequenced op の rejection に付く最新 committed snapshot（optional）。
              STATE から `v`/`type` を除いた complete な観測状態で、
              `presence`（role/status/trust/features/name/ready）と server `features`、
              現行 encoding の browse additive metadata を含む。member-drive 対応
              client は presence/features の欠けた snapshot を前回 STATE と合成せず
              fail-closed に capability intersection を落とす。lifecycle/control
              rejection では省略され得る。
    Applied:
      title: リクエストが逐次適用された通知
      payload:
        type: object
        required: [v, type, sessionId, requestId, revision, by]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: APPLIED}
          sessionId: {type: string}
          requestId: {type: string}
          revision: {type: integer, description: 適用後の STATE リビジョン}
          by: {type: string, enum: [leader, follower], description: 適用要求者のロール}
    State:
      title: 完全状態スナップショット
      payload: {$ref: "#/components/schemas/StateFrame"}
    Manifest:
      title: セッションマニフェスト（chunked 転送可）
      description: |
        1 manifest = 1+ chunk フレーム。`kind:manifest-chunk` の
        `{digest,index,count,data}` を index 順に連結すると canonical JSON が
        復元され、`digest` (sha256) と照合できる。送信後に STATE フレームが
        続く（コミット通知は STATE が担い、MANIFEST_COMMIT という wire メッセージは存在しない）。
      payload:
        type: object
        required: [v, type, sessionId, workEpoch, manifestVersion, kind, digest, index, count, data]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: MANIFEST}
          sessionId: {type: string}
          workEpoch: {type: integer}
          manifestVersion: {type: integer}
          kind: {type: string, const: manifest-chunk}
          digest: {type: string, description: "sha256:<hex> 全チャンク共通"}
          index: {type: integer, minimum: 0}
          count: {type: integer, minimum: 1}
          data: {type: string, description: chunk 分割された canonical JSON 片}
    End:
      payload:
        type: object
        required: [v, type]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: END}
          reason: {type: string}
    Ping:
      payload:
        type: object
        required: [v, type]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: PING}
    Pong:
      payload:
        type: object
        required: [v, type]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: PONG}
    Signal:
      title: WebRTC signaling 中継（非シーケンス）
      payload:
        type: object
        required: [v, type, kind]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: SIGNAL}
          kind: {type: string, enum: [offer, answer, ice]}
          data: {}
    UiSync:
      title: ephemeral UI ミラー（非シーケンス・reader state 混入禁止）
      payload:
        type: object
        required: [v, type, sessionId, from, payload]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: UI_SYNC}
          sessionId: {type: string}
          from: {type: string, enum: [leader, follower], description: 送信元ロール}
          payload: {$ref: "#/components/schemas/UiSyncPayload"}
    TransportState:
      payload:
        type: object
        required: [v, type]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: TRANSPORT_STATE}
          sessionId: {type: string}
          dataPlane: {type: string, enum: [server-ws, webrtc-dc]}
          revision: {type: integer, description: 切替が確定した STATE リビジョン}
    JoinRequest:
      title: ピアからの join 要求通知
      payload:
        type: object
        required: [v, type]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: JOIN_REQUEST}
          link: {type: string}
    JoinCancel:
      payload:
        type: object
        required: [v, type]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: JOIN_CANCEL}
    Error:
      payload:
        type: object
        required: [v, type, code]
        properties:
          v: {type: integer, const: 1}
          type: {type: string, const: ERROR}
          code:
            type: string
            enum: [ERR_VERSION, ERR_MALFORMED, ERR_TYPE, ERR_RANGE, ERR_SIZE]
          message: {type: string}

  schemas:
    FeatureList:
      type: [array, "null"]
      maxItems: 32
      items: {type: string, minLength: 1, maxLength: 64}
      description: client/server capability feature tokens。未知 token は無視してよい。null は未広告（空配列と同じ）として扱う

    RequestFrame:
      type: object
      required: [v, requestId, sessionId, workEpoch, baseRevision, type, payload]
      properties:
        v: {type: integer, const: 1}
        requestId: {type: string, minLength: 1}
        sessionId: {type: [string, "null"]}
        workEpoch: {type: integer, minimum: 0}
        baseRevision: {type: integer, minimum: 0}
        type:
          type: string
          enum:
            - CREATE        # セッション作成
            - JOIN          # payload.code = 6桁数字
            - APPROVE       # join 承認
            - REJECT        # join 拒否
            - RESUME
            - LEAVE
            - MATCH         # payload.pick = 1..64 文字のトークン
            - TURN          # payload.delta = ±1, crossChapter: bool
            - GOTO          # payload.page = PageRef
            - SET_OFFSET    # payload.offset = 0|1
            - SWAP_SIDES    # payload.leaderSide = right|left
            - OPEN_WORK     # payload.folder: str, page?: PageRef
            - SET_ACTIVITY
            - READY
            - PING
            - APPLIED       # payload.requestId: str
            - SIGNAL
            - TRANSPORT_STATE
            - UI_SYNC
        payload:
          type: object
          description: type ごとのペイロード（下記 oneOf 参照）
      discriminator: type
      oneOf:
        - type: object
          properties:
            type: {const: CREATE}
            payload:
              type: object
              properties:
                features: {$ref: "#/components/schemas/FeatureList"}
        - type: object
          properties:
            type: {const: JOIN}
            payload:
              type: object
              description: |
                `code`（6桁数字・member ペアリング）または
                `guestToken`（ゲストアクセス — CREATE ACK の
                `data.guestToken`。未ログイン端末が QR の
                `/#/join/<code>?gt=<token>` リンク経由で解決する
                bearer で、grant はペアセッション終了または発行から
                8 時間で失効）のどちらか一方を必須とする
                （キー存在の XOR — 両方あり・両方なしは malformed）。
              properties:
                code: {type: string, pattern: '^\d{6}$'}
                guestToken: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
                features: {$ref: "#/components/schemas/FeatureList"}
              oneOf:
                - required: [code]
                - required: [guestToken]
        - type: object
          properties:
            type: {const: MATCH}
            payload:
              type: object
              properties:
                pick: {type: string, minLength: 1, maxLength: 64}
                features: {$ref: "#/components/schemas/FeatureList"}
        - type: object
          properties:
            type: {const: TURN}
            payload:
              type: object
              required: [delta, crossChapter]
              properties:
                delta: {type: integer, enum: [1, -1]}
                crossChapter: {type: boolean}
                fromChapter: {type: [string, "null"]}
        - type: object
          properties:
            type: {const: GOTO}
            payload:
              type: object
              required: [page]
              properties:
                page: {$ref: "#/components/schemas/PageRef"}
        - type: object
          properties:
            type: {const: SET_OFFSET}
            payload:
              type: object
              required: [offset]
              properties:
                offset: {type: integer, enum: [0, 1]}
        - type: object
          properties:
            type: {const: SWAP_SIDES}
            payload:
              type: object
              required: [leaderSide]
              properties:
                leaderSide: {type: string, enum: [right, left]}
        - type: object
          properties:
            type: {const: OPEN_WORK}
            payload:
              type: object
              required: [folder]
              properties:
                folder: {type: string}
                page: {$ref: "#/components/schemas/PageRef"}
                auto:
                  type: boolean
                  description: pairing bootstrap の自動 load。committed/in-flight の非 auto load を上書きしない
        - type: object
          properties:
            type: {const: SIGNAL}
            payload:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [offer, answer, ice]}
        - type: object
          properties:
            type: {const: APPLIED}
            payload:
              type: object
              required: [requestId]
              properties:
                requestId: {type: string}
        - type: object
          properties:
            type: {const: UI_SYNC}
            payload: {$ref: "#/components/schemas/UiSyncPayload"}
        - type: object
          properties:
            type: {const: RESUME}
            payload:
              type: object
              required: [memberId, resumeToken]
              properties:
                memberId: {type: string}
                resumeToken: {type: string}
                features: {$ref: "#/components/schemas/FeatureList"}
        - type: object
          properties:
            type: {const: SET_ACTIVITY}
            payload:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [active, suspended, selecting]}
                endBrowse:
                  type: boolean
                  description: 明示 close gesture のみ true。member-drive capability intersection 下で shared browse を閉じる
        - type: object
          # RESUME/SET_ACTIVITY keep their historical enum entries here for
          # wire-compatibility diffing, but the `not` below makes this
          # fallback disjoint from their precise payload variants so the
          # outer oneOf still means exactly-one.
          not:
            properties:
              type:
                enum: [RESUME, SET_ACTIVITY]
          properties:
            type:
              enum:
                - APPROVE
                - REJECT
                - RESUME
                - LEAVE
                - SET_ACTIVITY
                - READY
                - PING
                - TRANSPORT_STATE
            payload: {type: object}

    PageRef:
      type: object
      required: [folder, name]
      properties:
        folder: {type: string}
        name: {type: string}

    UiSyncPayload:
      type: object
      required: [view, top, viewH]
      properties:
        view: {type: string, enum: [browse]}
        path: {type: [string, "null"], maxLength: 4096}
        top: {type: number, minimum: 0, description: sender scroller の px}
        viewH: {type: number, exclusiveMinimum: 0, maximum: 100000}
        scrollH: {type: number, exclusiveMinimum: 0, maximum: 100000000}
        pred: {type: number, minimum: 0, maximum: 100000000, description: sender の fling 終端予測 px（optional — 未送信なら受信側は実測追従）}
        mode: {type: string, enum: [tile, list, card]}

    StateFrame:
      type: object
      required: [v, type, sessionId, revision, workEpoch, manifestVersion, phase, spreadId, offset, leaderSide, presence]
      properties:
        v: {type: integer, const: 1}
        type: {type: string, const: STATE}
        sessionId: {type: string}
        revision: {type: integer, minimum: 0}
        workEpoch: {type: integer, minimum: 0}
        manifestVersion: {type: integer, minimum: 0}
        phase:
          type: string
          enum: [waiting, loading, reading, selecting, paused, ended]
        spreadId: {type: [string, "null"]}
        offset: {type: integer, enum: [0, 1]}
        leaderSide: {type: string, enum: [right, left]}
        browse:
          type: boolean
          description: |
            shared browse の session スコープ状態。member-drive intersection 成立中の
            open では true を送る。一度 generation が存在した後の closed state では
            intersection の有無に関係なく additive な false を送り、offline 中に起きた
            close や capability downgrade close を resume 後も観測できるようにする。
            初回 open 前は省略する。paused が selecting を mask するため phase だけでは判別できない。
        browseOpener:
          type: string
          description: "shared browse open 時のみ付く additive metadata: server serialization で最初に open を受理した member id"
        browseOpenerRole:
          type: string
          enum: [leader, follower]
          description: "browseOpener の現在 role。同時 open の deterministic tie-break 用 additive metadata"
        browseGeneration:
          type: integer
          minimum: 0
          description: "session-scoped な additive generation。closed→open 毎に increment し、open では browse:true と共に、generation 成立後の closed では browse:false と共に送る。close/work commit/downgrade では reset せず、RESUME/reconnect を跨いでも session 終了まで保持する"
        presence:
          type: object
          description: "member id → {role, status, trust: member|guest, features: string[], name, ready}"
        features:
          $ref: "#/components/schemas/FeatureList"
