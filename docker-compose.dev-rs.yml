# bookq — 開発環境 overlay: viewer-rs（Rust バックエンド）を足す追加 -f のみ。
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev-rs.yml ...
#
# `./dev.sh up <name> --rs` で使う。構成は viewer（フォールスルー先として必須）
# + viewer-rs + tailscale で、tailscale serve が viewer-rs を指すよう
# TS_SERVE_TARGET を上書きする — dev-XX.<tailnet>.ts.net に来るリクエストは
# 全て viewer-rs が受け、未実装パスは viewer:8080 に中継される。
#
# viewer-rs は host/network の認証を通さず viewer に中継するだけなので、
# セッション Cookie・OAuth も含め全パスが透過的に動く。
#
# 直接 docker compose を叩かないこと。必須変数 (:?) が未設定だと失敗する。

services:
  viewer:
    environment:

  viewer-rs:
    image: "${DEV_RS_IMAGE:?DEV_RS_IMAGE is required — use ./dev.sh up --rs}"
    container_name: "bookq-dev-viewer-rs-dev-${DEV_POOL_SLOT:?DEV_POOL_SLOT is required — use ./dev.sh up}"

    volumes:
      # R1 以降で scan_fs/meta_walk が参照する実データ（viewer と同じ ro マウント）。
      - "${DOWNLOADS_HOST_DIR:-./downloads}:/app/downloads:ro"
      # M4: folder-visibility SQLite — viewer と同じ user-state volume を
      # 共有し、両バックエンドが同じ hidden_roots を読み書きする。
      - user-state:/var/lib/bookq
      # M7: thumb/view/sprite ディスクキャッシュ — viewer と同じ
      # thumb-cache volume を共有。viewer-rs は cache hit のみ native
      # serve し、miss は upstream (Pillow) が同じ cache に生成する。
      - thumb-cache:/var/cache/bookq-thumbs

    environment:
      - BOOKQ_UPSTREAM=http://viewer:8080
      - DOWNLOADS_DIR=/app/downloads
      - BOOKQ_STATE_DIR=/var/lib/bookq
      # viewer と同じ値（docker-compose.dev.yml と対）。cache key/ファイル名は
      # sha1(key) で backend 非依存 — どちらが書いたエントリも両側が読める。
      - BOOKQ_THUMB_CACHE_DIR=/var/cache/bookq-thumbs
      # Same value as the viewer's env: native endpoints activate under the
      # mock user. To exercise the Bearer path instead, drop TEST_MODE and
      # set BOOKQ_RS_NATIVE + ALLOWED_EMAILS (Bearer JWT with SECRET_KEY).
      - BOOKQ_TEST_MODE=${DEV_RS_TEST_MODE:-true}
      - BOOKQ_RS_NATIVE=${DEV_RS_NATIVE:-all}
      - ALLOWED_EMAILS=${DEV_RS_ALLOWED_EMAILS:-test@example.com}
      # visibility owner HMAC + Bearer JWT key — dev compose 側と同じ値。
      - SECRET_KEY=dev-not-a-secret

    # dev.sh のプール管理は role=dev (viewer) のみを見る — このサービスは
    # dev-rs として識別し、slot/名前ラベルは gc の参照判定用に共有する。
    labels:
      com.bookq.role: dev-rs
      com.bookq.name: "${DEV_ENV_NAME:-${DEV_NAME}}"
      com.bookq.pool_slot: "${DEV_POOL_SLOT}"
      com.bookq.hostname: "${DEV_HOSTNAME:-dev-${DEV_POOL_SLOT}}"
      com.bookq.ref: "${DEV_REF:-worktree}"
      com.bookq.commit: "${DEV_COMMIT:-unknown}"
      com.bookq.branch: "${DEV_BRANCH:-unknown}"
      com.bookq.worktree: "${DEV_WORKTREE:-unknown}"
      com.bookq.dev-image-tag: "${DEV_RS_IMAGE}"
      com.bookq.backend: rs

    restart: unless-stopped

    depends_on:
      viewer:
        condition: service_healthy

  tailscale:
    environment:
      - TS_SERVE_TARGET=http://viewer-rs:8080
    depends_on:
      - viewer
      - viewer-rs
