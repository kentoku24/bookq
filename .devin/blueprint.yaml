# bookq Devin environment blueprint.
# テストスイート (uvicorn fixture + Playwright) が即座に動くよう
# uv・uv 管理の Python 3.12・Chromium を snapshot に焼き込む。
# 背景: app/metadata/models.py が tomllib を import → Python >=3.11 必須
# (既定の system python3 は 3.10 で "server exited early" になる)。
initialize: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  echo "PATH=$HOME/.local/bin:$PATH" >> $ENVRC
  $HOME/.local/bin/uv python install 3.12
  $HOME/.local/bin/uv run --python 3.12 --with playwright playwright install chromium
knowledge:
  - name: test
    contents: |
      # BOOKQ_TEST_MODE / DOWNLOADS_DIR は tests/conftest.py の fixture が設定
      uv run --python 3.12 --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q
  - name: run
    contents: |
      BOOKQ_TEST_MODE=true DOWNLOADS_DIR=/path/to/images uv run --python 3.12 --with-requirements requirements-dev.txt uvicorn app.main:app --port 8080
  - name: notes
    contents: |
      --python 3.12 は必須 (system python3.10 に tomllib が無い)。--with-requirements requirements-dev.txt も必須 (uvicorn[standard] は dev のみ)。dev 環境は ./dev.sh up <name>。
---
# macOS block — iOS Simulator 検証用 (xcrun simctl は Xcode 付属で導入済み前提)。
# idb: タップ/スワイプ駆動 (references/tap-driving.md)。sevenzip: rarfile の
# 圧縮エントリ展開に必要 (CLAUDE.md)。Simulator への確認経路は
# ./scripts/open-simulator.sh <url>。Docker が無い環境では dev.sh --local
# の代わりに BOOKQ_TEST_MODE の uvicorn 直起動で http://127.0.0.1:8080 を開く。
runs-on: macos
initialize: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  echo "PATH=$HOME/.local/bin:$PATH" >> $ENVRC
  $HOME/.local/bin/uv python install 3.12
  $HOME/.local/bin/uv run --python 3.12 --with playwright playwright install chromium
  brew install pipx sevenzip
  brew tap facebook/fb && brew install idb-companion
  $HOME/.local/bin/pipx install fb-idb || pipx install fb-idb
knowledge:
  - name: test
    contents: |
      uv run --python 3.12 --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q
  - name: ios-simulator
    contents: |
      BOOKQ_TEST_MODE=true DOWNLOADS_DIR=/path/to/images uv run --python 3.12 --with-requirements requirements-dev.txt uvicorn app.main:app --port 8080 &
      ./scripts/open-simulator.sh check && ./scripts/open-simulator.sh http://127.0.0.1:8080
      # タップ駆動: idb ui tap x y --udid <udid> / ./scripts/sim-gesture-battery.sh <url>
  - name: notes
    contents: |
      Skill: .claude/skills/ios-simulator/SKILL.md。PWA なので simctl install は不要、Safari に URL を開くだけ。loopback http は Secure Context として許容。
