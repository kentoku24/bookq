<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A54BA"/>
      <stop offset="0.45" stop-color="#04307F"/>
      <stop offset="1" stop-color="#011D5F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.42">
      <stop offset="0" stop-color="#1373E6" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#1373E6" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#1373E6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1373E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inkB" gradientUnits="userSpaceOnUse" x1="6.4" y1="8" x2="12" y2="26.5">
      <stop offset="0" stop-color="#FEFEF7"/>
      <stop offset="1" stop-color="#FBF6EA"/>
    </linearGradient>
    <linearGradient id="inkQ" gradientUnits="userSpaceOnUse" x1="20" y1="5" x2="25" y2="25">
      <stop offset="0" stop-color="#FFEECB"/>
      <stop offset="0.55" stop-color="#FED398"/>
      <stop offset="1" stop-color="#FE9962"/>
    </linearGradient>
    <linearGradient id="weaveFade" gradientUnits="userSpaceOnUse" x1="15.25" y1="15.25" x2="16.75" y2="16.75">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="weaveMask" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="0" y="0" width="32" height="32" fill="url(#weaveFade)"/>
    </mask>
    <!-- soft drop shadow under the letterforms — the raised-paper look
         of the original bq-icon.png master -->
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.25" dy="0.4" stdDeviation="0.55"
                    flood-color="#02113A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="60" width="120" height="120" rx="29" fill="url(#bg)"/>
  <rect x="60" width="120" height="120" rx="29" fill="url(#glow)"/>
  <g transform="translate(60,0) scale(3.75)" fill="none" stroke-linecap="round" filter="url(#inkShadow)">
    <circle id="q-ring" cx="19.8" cy="12.2" r="5.6" stroke="url(#inkQ)" stroke-width="2.68"/>
    <line id="q-stem" x1="25.4" y1="12.2" x2="25.4" y2="24" stroke="url(#inkQ)" stroke-width="2.9"/>
    <circle id="b-ring" cx="12.2" cy="19.8" r="5.6" stroke="url(#inkB)" stroke-width="2.68"/>
    <line id="b-stem" x1="6.6" y1="8" x2="6.6" y2="19.8" stroke="url(#inkB)" stroke-width="2.9"/>
    <g mask="url(#weaveMask)">
      <circle cx="19.8" cy="12.2" r="5.6" stroke="url(#inkQ)" stroke-width="2.68"/>
    </g>
  </g>
  <text x="120" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="200" fill="#e0e0e0" text-anchor="middle" letter-spacing="-0.03em">bookq</text>
  <text x="120" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#888" text-anchor="middle" letter-spacing="0.15em">SECURE COMIC VIEWER</text>
</svg>