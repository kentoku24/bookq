<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A54BA"/>
      <stop offset="0.45" stop-color="#04307F"/>
      <stop offset="1" stop-color="#011D5F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.42">
      <stop offset="0" stop-color="#1373E6" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#1373E6" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#1373E6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1373E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inkB" gradientUnits="userSpaceOnUse" x1="20.2" y1="8" x2="23.7" y2="15.5">
      <stop offset="0" stop-color="#FEFEF7"/>
      <stop offset="1" stop-color="#FBF6EA"/>
    </linearGradient>
    <linearGradient id="inkQ" gradientUnits="userSpaceOnUse" x1="8" y1="17" x2="11.6" y2="26">
      <stop offset="0" stop-color="#FFEECB"/>
      <stop offset="0.55" stop-color="#FED398"/>
      <stop offset="1" stop-color="#FE9962"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.8" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7.8" fill="url(#glow)"/>
  <!-- Interlocked diagonal bq monogram: q upper-right, b lower-left; bowls overlap centrally. -->
  <g fill="none" stroke-linecap="round">
    <circle cx="18.2" cy="13.8" r="4.05" stroke="url(#inkQ)" stroke-width="2.65"/>
    <line x1="21.9" y1="6.3" x2="21.9" y2="13.8" stroke="url(#inkQ)" stroke-width="3.0"/>
    <circle cx="13.8" cy="18.2" r="4.05" stroke="url(#inkB)" stroke-width="2.65"/>
    <line x1="9.85" y1="18.2" x2="9.85" y2="25.1" stroke="url(#inkB)" stroke-width="2.9"/>
  </g>
</svg>
