<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A54BA"/>
      <stop offset="0.45" stop-color="#04307F"/>
      <stop offset="1" stop-color="#011D5F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.42">
      <stop offset="0" stop-color="#1373E6" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#1373E6" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#1373E6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1373E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inkB" gradientUnits="userSpaceOnUse" x1="7" y1="15" x2="16" y2="26">
      <stop offset="0" stop-color="#FEFEF7"/>
      <stop offset="1" stop-color="#FBF6EA"/>
    </linearGradient>
    <linearGradient id="inkQ" gradientUnits="userSpaceOnUse" x1="16" y1="6" x2="27" y2="19">
      <stop offset="0" stop-color="#FFEECB"/>
      <stop offset="0.55" stop-color="#FED398"/>
      <stop offset="1" stop-color="#FE9962"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.8" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7.8" fill="url(#glow)"/>
  <!-- b lower-left and q upper-right; bowls meet tangentially at the center, with no crossing. -->
  <g fill="none" stroke-linecap="round" stroke-width="2.5">
    <circle cx="11.5" cy="20.5" r="6.364" stroke="url(#inkB)"/>
    <line x1="5.2" y1="14.2" x2="5.2" y2="20.5" stroke="url(#inkB)"/>
    <circle cx="20.5" cy="11.5" r="6.364" stroke="url(#inkQ)"/>
    <line x1="26.8" y1="11.5" x2="26.8" y2="18.0" stroke="url(#inkQ)"/>
  </g>
</svg>