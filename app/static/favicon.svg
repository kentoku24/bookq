<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A54BA"/>
      <stop offset="0.45" stop-color="#04307F"/>
      <stop offset="1" stop-color="#011D5F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.42">
      <stop offset="0" stop-color="#1373E6" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#1373E6" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#1373E6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1373E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inkB" gradientUnits="userSpaceOnUse" x1="6.4" y1="8" x2="12" y2="26.5">
      <stop offset="0" stop-color="#FEFEF7"/>
      <stop offset="1" stop-color="#FBF6EA"/>
    </linearGradient>
    <linearGradient id="inkQ" gradientUnits="userSpaceOnUse" x1="20" y1="5" x2="25" y2="25">
      <stop offset="0" stop-color="#FFEECB"/>
      <stop offset="0.55" stop-color="#FED398"/>
      <stop offset="1" stop-color="#FE9962"/>
    </linearGradient>
    <!-- soft drop shadow under the letterforms — the raised-paper look
         of the original bq-icon.png master -->
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.6" dy="1.1" stdDeviation="1.0"
                    flood-color="#02113A" flood-opacity="0.5"/>
    </filter>
    <!-- blur for the local contact shadows (stroke junctions + X cross) -->
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7.8" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7.8" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round" stroke-width="2.9" filter="url(#inkShadow)">
    <line x1="6.4" y1="8" x2="6.4" y2="20" stroke="url(#inkB)"/>
    <line x1="25.6" y1="12" x2="25.6" y2="24" stroke="url(#inkQ)"/>
    <circle cx="12" cy="20" r="5.6" stroke="url(#inkB)"/>
    <circle cx="20" cy="12" r="5.6" stroke="url(#inkQ)"/>
  </g>
  <!-- contact shading of the original master: X crossing where the q ring
       passes over the b ring, plus the crevices where each stem joins
       its bowl -->
  <g fill="#02113A" filter="url(#soft)">
    <ellipse cx="15.7" cy="16.4" rx="2.6" ry="1.0" opacity="0.4"
             transform="rotate(-45 15.7 16.4)"/>
    <ellipse cx="8.3" cy="16.9" rx="1.5" ry="0.6" opacity="0.3"
             transform="rotate(-45 8.3 16.9)"/>
    <ellipse cx="23.7" cy="15.1" rx="1.5" ry="0.6" opacity="0.3"
             transform="rotate(-45 23.7 15.1)"/>
  </g>
</svg>