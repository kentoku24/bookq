# Smoke mirror of opencode-auto.yml's verification tail (checkout / uv / Playwright /
# iOS gate / full suite). Keep these steps in the same shape as opencode-auto.yml --
# if they diverge, the green relied on here is not the green the bot produces.
#
# The pytest suite is sharded 4-way (uv-gate-shard matrix) because the private-repo
# runner is 2 vCPU and a single full-suite job takes ~11 min. Each shard mirrors
# opencode-auto.yml's verification commands with BOOKQ_TEST_SHARD=k/4; the union
# of the 4 shards is exactly the full suite. `uv-gate` aggregates the shards so
# the check name stays stable.
#
# Manual dispatch, plus any PR that can change a pytest outcome. Deploy-script-only
# PRs (dev.sh, rebuild.sh, tailscale/) intentionally do not gate.
#
# Runs once per PR, not on every push: when a non-draft PR is opened/reopened, or
# when a draft is marked Ready for review. Draft PRs and pushes to an open PR
# (synchronize) are skipped -- except dependabot PRs, whose auto-merge waits on
# this green. To re-run after more pushes: convert to draft and back to ready, or
# `gh workflow run workflow-smoke.yml --ref <branch>`.
# The job-level `if` is repeated on every job; the concurrency group gives skipped
# runs their own group so a skipped push cannot cancel the in-flight gate.
name: workflow-smoke
run-name: "oc-smoke #${{ github.event.pull_request.number || github.run_id }}"

on:
  workflow_dispatch:
  # app/tests PRs are gated here (#230). A cheaper browser-free lane is not possible;
  # read #230 before trying one again.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/*.yml"
      - ".github/scripts/*.sh"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "Dockerfile"
      - "docker-compose*.yml"
      # pytest golden-frame harness input (#210) — a case-file-only edit must
      # still run tests/test_reader_sync_golden.py.
      - "api/reader-sync-cases.json"

permissions:
  contents: read

concurrency:
  group: oc-smoke-${{ github.event.pull_request.number || github.run_id }}${{ github.event_name == 'pull_request' && (github.event.pull_request.draft || (github.event.action == 'synchronize' && github.event.pull_request.user.login != 'dependabot[bot]')) && format('-skip-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'synchronize' || github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate workflow YAML
        run: python3 -c "import glob,yaml; fs=sorted(glob.glob('.github/workflows/*.yml')); [yaml.safe_load(open(f)) for f in fs]; print('YAML OK', len(fs))"

      - name: gate.sh regression tests
        run: bash .github/scripts/test_gate.sh

      - name: pool slot regression tests
        run: bash .github/scripts/test_pool_slot.sh

  # Mirrors the verification tail of opencode-auto.yml
  # (implement / research / implement-direct / research-direct).
  uv-gate-shard:
    name: uv-gate (${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'synchronize' || github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # chromium-only gate (mirrors opencode-auto.yml)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Playwright version
        id: pw
        run: echo "v=$(uv run --with playwright python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers (chromium)
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run bookq test gate (shard ${{ matrix.shard }}/4)
        run: BROWSER=chromium BOOKQ_TEST_MODE=true BOOKQ_TEST_SHARD=${{ matrix.shard }}/4 uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto

  # Single stable check name aggregating the shard matrix.
  uv-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: uv-gate-shard
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'synchronize' || github.event.pull_request.user.login == 'dependabot[bot]')))
    steps:
      - name: Require all shards green
        run: |
          echo "uv-gate-shard result: ${{ needs.uv-gate-shard.result }}"
          test "${{ needs.uv-gate-shard.result }}" = "success"
