# Smoke mirror of opencode-auto.yml's verification tail (checkout / uv / Playwright /
# iOS gate / full suite). Keep these steps in the same shape as opencode-auto.yml --
# if they diverge, the green relied on here is not the green the bot produces.
#
# Manual dispatch, plus any PR that can change a pytest outcome. Deploy-script-only
# PRs (dev.sh, rebuild.sh, tailscale/) intentionally do not gate.
name: workflow-smoke
run-name: "oc-smoke #${{ github.event.pull_request.number || github.run_id }}"

on:
  workflow_dispatch:
  # app/tests PRs are gated here (#230). A cheaper browser-free lane is not possible;
  # read #230 before trying one again.
  pull_request:

permissions:
  contents: read
  # paths-filter lists the PR's changed files via the API.
  pull-requests: read

concurrency:
  group: oc-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job-level path gating so every PR reports these check names — see
  # android.yml changes-android for why workflow-level paths: would
  # deadlock required status checks (#382).
  changes-workflow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
      run-rs: ${{ steps.filter.outputs.run-rs }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        # pytest golden-frame harness input (#210) — a case-file-only
        # edit must still run tests/test_reader_sync_golden.py, hence
        # api/reader-sync-cases.json below.
        with:
          filters: |
            run:
              - ".github/workflows/*.yml"
              - ".github/scripts/*.sh"
              - "app/**"
              - "tests/**"
              - "requirements.txt"
              - "requirements-dev.txt"
              - "Dockerfile"
              - "docker-compose*.yml"
              - "api/reader-sync-cases.json"
            # #469: the retargeted suite oracles viewer-rs — Rust source,
            # the spec/vectors it is checked against, the shell assets it
            # serves, and the harness itself all matter.
            run-rs:
              - ".github/workflows/*.yml"
              - "rust/**"
              - "tests/**"
              - "app/static/**"
              - "app/templates/**"
              - "api/openapi.v1.yaml"
              - "api/vectors/**"

  validate:
    needs: changes-workflow-smoke
    if: github.event_name == 'workflow_dispatch' || needs.changes-workflow-smoke.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate workflow YAML
        run: python3 -c "import glob,yaml; fs=sorted(glob.glob('.github/workflows/*.yml')); [yaml.safe_load(open(f)) for f in fs]; print('YAML OK', len(fs))"

      - name: gate.sh regression tests
        run: bash .github/scripts/test_gate.sh

      - name: pool slot regression tests
        run: bash .github/scripts/test_pool_slot.sh

  # Mirrors the verification tail of opencode-auto.yml
  # (implement / research / implement-direct / research-direct).
  # The suite is split on the auto-applied `browser` marker (conftest.py
  # marks every test that touches a browser fixture — the same selection
  # safari-gate already trusts) so the Playwright-free lane skips the
  # ~30s browser install and both lanes run in parallel. `-m "not browser"`
  # + `-m browser` still cover every collected test — #230's "no cheaper
  # lane" constraint is about skipping coverage, which this does not do.
  # `uv-gate` below aggregates the lanes under the required check name.
  uv-gate-unit:
    needs: changes-workflow-smoke
    if: github.event_name == 'workflow_dispatch' || needs.changes-workflow-smoke.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # No `playwright install`: non-browser tests never launch a browser.
      # The playwright *package* is still required — conftest.py imports
      # playwright.sync_api at module top, so it stays in `uv run --with`.
      - name: Run non-browser test gate
        run: BROWSER=chromium BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto -m "not browser" --reruns 1 --reruns-delay 2

  # chromium-only gate (mirrors opencode-auto.yml)
  uv-gate-browser:
    needs: changes-workflow-smoke
    if: github.event_name == 'workflow_dispatch' || needs.changes-workflow-smoke.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Playwright version
        id: pw
        run: echo "v=$(uv run --with playwright python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers (chromium)
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run browser test gate (chromium)
        run: BROWSER=chromium BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto -m browser --reruns 1 --reruns-delay 2

  # Required-check anchor: branch protection names `uv-gate`, so the
  # aggregate keeps reporting that context — pass only when both lanes
  # succeeded. Skipped when the path filter says the suite need not run,
  # matching the old job's skipped semantics.
  uv-gate:
    needs: [changes-workflow-smoke, uv-gate-unit, uv-gate-browser]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes-workflow-smoke.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify lanes
        env:
          UNIT: ${{ needs.uv-gate-unit.result }}
          BROWSER: ${{ needs.uv-gate-browser.result }}
        run: |
          echo "uv-gate-unit: $UNIT"
          echo "uv-gate-browser: $BROWSER"
          [ "$UNIT" = "success" ] && [ "$BROWSER" = "success" ]

  # #469: the same suite oracles viewer-rs — `BOOKQ_TEST_SERVER=rs` swaps
  # the conftest server fixture's spawn to the Rust binary (no-upstream,
  # BOOKQ_RS_NATIVE=all + STRICT), quarantining files that import `app.*`
  # or hardcode the v0 compat surface. Split on the `browser` marker like
  # uv-gate; rust-cache keeps the per-lane cargo build warm (each lane
  # spawns its own fixture binary).
  pytest-rs-unit:
    needs: changes-workflow-smoke
    if: github.event_name == 'workflow_dispatch' || needs.changes-workflow-smoke.outputs.run-rs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo build (test fixture binary)
        run: cargo build -p viewer-rs --manifest-path rust/Cargo.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run non-browser test suite against viewer-rs
        run: BOOKQ_TEST_SERVER=rs BROWSER=chromium BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto -m "not browser" --reruns 1 --reruns-delay 2

  pytest-rs-browser:
    needs: changes-workflow-smoke
    if: github.event_name == 'workflow_dispatch' || needs.changes-workflow-smoke.outputs.run-rs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo build (test fixture binary)
        run: cargo build -p viewer-rs --manifest-path rust/Cargo.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Playwright version
        id: pw
        run: echo "v=$(uv run --with playwright python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers (chromium)
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run browser test suite against viewer-rs
        run: BOOKQ_TEST_SERVER=rs BROWSER=chromium BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto -m browser --reruns 1 --reruns-delay 2

  # Keeps the `pytest-rs` check name stable for PRs — not a required
  # check, but the aggregate preserves the single pass/fail signal.
  pytest-rs:
    needs: [changes-workflow-smoke, pytest-rs-unit, pytest-rs-browser]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes-workflow-smoke.outputs.run-rs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify lanes
        env:
          UNIT: ${{ needs.pytest-rs-unit.result }}
          BROWSER: ${{ needs.pytest-rs-browser.result }}
        run: |
          echo "pytest-rs-unit: $UNIT"
          echo "pytest-rs-browser: $BROWSER"
          [ "$UNIT" = "success" ] && [ "$BROWSER" = "success" ]

  # Real-Safari lane: runs every browser-marked test under safaridriver on an
  # Apple-Silicon macOS runner. Safari.app accepts exactly ONE WebDriver
  # session globally, so a shard can never parallelize — the suite is split
  # across runners with --num-shards/--shard-id instead of pytest -n.
  safari-gate:
    needs: changes-workflow-smoke
    if: github.event_name == 'workflow_dispatch' || needs.changes-workflow-smoke.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Run browser tests on real Safari (shard ${{ matrix.shard }}/8)
        run: BROWSER=safari BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -m browser --num-shards 8 --shard-id ${{ matrix.shard }} --reruns 1 --reruns-delay 2
