# Android native client — JVM unit tests + lint + debug APK, and an
# emulator UI smoke test against a TEST_MODE server (api-contract.yml
# builds the same synthetic tree).
name: android

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter lists the PR's changed files via the API.
  pull-requests: read

jobs:
  # Path gating lives at job level, not on.pull_request.paths: required
  # status checks need every check name reported on every PR, and a
  # workflow-level filter leaves the check pending forever on
  # non-matching PRs (#382). Non-matching jobs end `skipped`, which
  # satisfies a required check.
  changes-android:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        # workflow_dispatch keeps running everything, as before.
        if: github.event_name == 'pull_request'
        # The ui job boots the repo's FastAPI server and asserts on
        # /api/v1/* — server or dependency changes can break the client,
        # hence app/** and requirements*.txt below.
        with:
          filters: |
            run:
              - "android/**"
              - "api/**"
              - ".github/workflows/android.yml"
              - "app/**"
              - "requirements*.txt"
              - "rust/viewer-rs/**"

  unit:
    needs: changes-android
    if: github.event_name == 'workflow_dispatch' || needs.changes-android.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Installed platform on this repo is android-37.2 (minor release);
      # compileSdk { release(37) { minorApiLevel = 2 } } resolves it.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"

      - name: Unit tests, lint, assemble
        run: >-
          ./gradlew :core:test :data:testDebugUnitTest
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bookq-debug-apk
          path: android/app/build/outputs/apk/debug/app-*-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests/
            android/data/build/reports/tests/
            android/app/build/reports/tests/
          if-no-files-found: ignore

  ui:
    needs: changes-android
    if: github.event_name == 'workflow_dispatch' || needs.changes-android.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      # Synthetic tree — Series/vol1 flattens to one "Series/vol1" node;
      # Other/ has direct images so its top-level name stays "Other".
      - name: Build synthetic downloads tree
        run: |
          mkdir -p /tmp/dl/Series/vol1 /tmp/dl/Other /tmp/bookq-state
          uv run --with pillow python - <<'PYEOF'
          from PIL import Image
          for i in range(3):
              Image.new("RGB", (80, 120), (i * 60, 0, 0)).save(f"/tmp/dl/Series/vol1/p{i:02d}.jpg")
          Image.new("RGB", (80, 120), (0, 120, 0)).save("/tmp/dl/Other/p00.jpg")
          PYEOF

      - name: Start bookq (test mode)
        run: |
          BOOKQ_TEST_MODE=true BOOKQ_STATE_DIR=/tmp/bookq-state DOWNLOADS_DIR=/tmp/dl \
            uv run --with-requirements requirements-dev.txt \
            uvicorn app.main:app --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/v1/health && exit 0 || sleep 1
          done
          echo "server did not become healthy" && exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Emulator reaches the host uvicorn via 10.0.2.2 (cleartext allowed
      # for that host in the debug network security config). The script
      # gates on emulator->server reachability first and retries once in the
      # same booted session — the whole class used to fail when the NAT
      # bridge or adb was wedged (#326).
      - name: Emulator UI test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-ui-test.sh"

      - name: Upload connected test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-connected-test-report
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
