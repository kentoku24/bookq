name: opencode-auto
run-name: "oc-auto #${{ github.event.issue.number || github.event.client_payload.issue_number || github.event.client_payload.issue_number }}"

on:
  issues:
    types: [opened, labeled]
  repository_dispatch:
    types: [openresearch-issue]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  # oc-fail-classify.sh reads failed-step logs via `gh run view` (#635).
  actions: read

concurrency:
  group: oc-auto-${{ github.event.issue.number || github.event.client_payload.issue_number }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # gate — evaluate event, acquire the 🤖 processing lock BEFORE any
  # cancellable region. 失効ロック (stale lock): if the sentinel label is
  # already present it belongs to a cancelled/timed-out previous run —
  # delete it and PROCEED normally (recovery is visible, never a silent exit).
  # ------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      route: ${{ steps.eval.outputs.route }}
      allow: ${{ steps.eval.outputs.allow }}
      mention: ${{ steps.eval.outputs.mention }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Evaluate event gate
        id: eval
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          out=$(printf '%s' "$EVENT_JSON" | bash .github/scripts/gate.sh)
          printf '%s\n' "$out"
          route=$(printf '%s\n' "$out" | sed -n 's/^route=//p')
          allow=$(printf '%s\n' "$out" | sed -n 's/^allow=//p')
          mention=$(printf '%s\n' "$out" | sed -n 's/^mention=//p')
          {
            echo "route=$route"
            echo "allow=$allow"
            echo "mention=$mention"
          } >> "$GITHUB_OUTPUT"

      - name: Verify openresearch dispatch marker
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail
          body=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json body --jq '.body')
          if ! printf '%s' "$body" | grep -qF 'Related: kentoku24/openresearch#'; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
              --body "⚠️ Unauthorized repository_dispatch (no openresearch Related marker) — ignoring."
            echo "::error::dispatch issue #$ISSUE_NUMBER missing Related marker"
            exit 1
          fi

      # Lock-acquisition point (BEFORE cancellable region). GITHUB_TOKEN only
      # — App tokens are FORBIDDEN for label ops because they refire workflows.
      - name: Acquire lock (add 🤖 processing)
        if: steps.eval.outputs.allow == 'yes' && steps.eval.outputs.route != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join("\n")')
          if printf '%s\n' "$labels" | grep -qxF '🤖 processing'; then
            echo "::notice::sentinel already present — treating as 失効ロック (stale lock); deleting and proceeding normally"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing"
          fi
          # Clear the previous run's outcome so this run's result is the only one shown.
          for l in "✅ done" "❌ failed"; do
            if printf '%s\n' "$labels" | grep -qxF "$l"; then
              gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "$l"
            fi
          done
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "🤖 processing"

      - name: Guidance comment (no route label)
        if: steps.eval.outputs.allow == 'yes' && steps.eval.outputs.route == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "この issue には AI ルートラベルがありません。 \`ai/implement\` または \`ai/research\` を付与すると自動実行されます（LLM 呼び出しは行っていません）。"

      - name: Report gate error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "gate error — AI 実行に進みませんでした(run: ${RUN_URL})"

  # ------------------------------------------------------------------
  # implement — official anomalyco/opencode action path.
  # ------------------------------------------------------------------
  implement:
    needs: gate
    if: vars.USE_DIRECT_RUN != 'true' && needs.gate.outputs.allow == 'yes' && needs.gate.outputs.route == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # chromium-only gate (webkit has pre-existing storage-API env failures; Safari parity is Tier2 manual QA)
    # No job-level concurrency: the workflow-level group already serializes per
    # issue, and a job group equal to it deadlocks (job fails with 0 steps).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # OPENCODE_ZEN_API_KEY (static secret) expired — exchange the job's OIDC
      # token for a 1h OpenCode API key instead (client_id is a public cred id).
      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_0ae3b774-477c-413f-9c37-0afec7f727ba \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      # uv must exist BEFORE the agent runs: codegen.sh and the documented
      # pytest command both go through `uv run` (#636).
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run opencode (official action)
        id: agent
        uses: anomalyco/opencode/github@c0ad18b402eb2827fc1ee71c171b1177b3fc02d1
        env:
          OPENCODE_API_KEY: ${{ env.OPENCODE_API_KEY }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          prompt: |
            Implement the request described in issue #${{ github.event.issue.number || github.event.client_payload.issue_number }} of this repository.
            Follow AGENTS.md strictly:
            - Work on branch ai/<issue番号>-<slug> (slug: lowercase, spaces->hyphens, alnum only, <=50 chars).
            - Small incremental commits with conventional-commit messages.
            - Open a PR titled "<type>(ai): <要約> (#${{ github.event.issue.number || github.event.client_payload.issue_number }})" whose body references
              #${{ github.event.issue.number || github.event.client_payload.issue_number }} and includes testing considerations.
            - If you change files under api/ or scripts/api/, run ./scripts/api/codegen.sh
              and commit the regenerated artifacts (api/dist/, web/static/api/api-types.d.ts).

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: System deps (dav1d for avif-native, #563)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdav1d-dev pkg-config

      - name: cargo build (test fixture binary)
        run: cargo build -p viewer-rs --manifest-path rust/Cargo.toml

      - name: Playwright version
        id: pw
        run: echo "v=$(uv run --with playwright python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers (chromium)
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run bookq test gate (full suite, viewer-rs)
        id: testgate
        run: BROWSER=chromium BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto --reruns 1 --reruns-delay 2

      - name: Swap label to ✅ done
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "✅ done"

      - name: Swap label to ❌ failed + log comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "❌ failed"
          # Classify the failure for triage (#635): oc-fail-classify.sh maps
          # the causal failed step (+ log patterns) to push/env/test/agent/
          # infra/no-output and prints "<class>|<hint>". It always exits 0.
          # This job has no pushpr/preflight steps — only agent/testgate ids.
          line=$(bash .github/scripts/oc-fail-classify.sh "${{ github.run_id }}" "$REPO" "${{ github.job }}" \
            "testgate=${{ steps.testgate.outcome }}" "agent=${{ steps.agent.outcome }}" || true)
          if [ -z "$line" ]; then line="unknown|分類取得失敗"; fi
          fclass="${line%%|*}"
          fhint="${line#*|}"
          if [ "$fhint" = "$line" ]; then fhint=""; fi
          body="🏷️ 失敗分類: ${fclass}"
          if [ -n "$fhint" ]; then body="${body}"$'\n'"${fhint}"; fi
          body="${body}"$'\n'"Actions ログ: ${RUN_URL}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"

  # ------------------------------------------------------------------
  # research — official action path; requires summary comment on the issue
  # AND a report file docs/reports/YYYY-MM-DD-<slug>.md delivered via PR.
  # ------------------------------------------------------------------
  research:
    needs: gate
    if: vars.USE_DIRECT_RUN != 'true' && needs.gate.outputs.allow == 'yes' && needs.gate.outputs.route == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # chromium-only gate (webkit has pre-existing storage-API env failures; Safari parity is Tier2 manual QA)
    # No job-level concurrency: the workflow-level group already serializes per
    # issue, and a job group equal to it deadlocks (job fails with 0 steps).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # OPENCODE_ZEN_API_KEY (static secret) expired — exchange the job's OIDC
      # token for a 1h OpenCode API key instead (client_id is a public cred id).
      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_0ae3b774-477c-413f-9c37-0afec7f727ba \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      # uv must exist BEFORE the agent runs: codegen.sh and the documented
      # pytest command both go through `uv run` (#636).
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run opencode (official action)
        id: agent
        uses: anomalyco/opencode/github@c0ad18b402eb2827fc1ee71c171b1177b3fc02d1
        env:
          OPENCODE_API_KEY: ${{ env.OPENCODE_API_KEY }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          prompt: |
            Research the topic of issue #${{ github.event.issue.number || github.event.client_payload.issue_number }} of this repository.
            BOTH deliverables are REQUIRED:
            1. Post a summary comment on issue #${{ github.event.issue.number || github.event.client_payload.issue_number }}.
            2. Save a detailed report at docs/reports/YYYY-MM-DD-<slug>.md where <slug> follows the
               AGENTS.md rule (lowercase, hyphens, alphanumeric only, <=50 chars) and open a PR
               containing that file with title "<type>(ai): <要約> (#${{ github.event.issue.number || github.event.client_payload.issue_number }})"
               referencing #${{ github.event.issue.number || github.event.client_payload.issue_number }} in the body.

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: System deps (dav1d for avif-native, #563)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdav1d-dev pkg-config

      - name: cargo build (test fixture binary)
        run: cargo build -p viewer-rs --manifest-path rust/Cargo.toml

      - name: Playwright version
        id: pw
        run: echo "v=$(uv run --with playwright python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers (chromium)
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run bookq test gate (full suite, viewer-rs)
        id: testgate
        run: BROWSER=chromium BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto --reruns 1 --reruns-delay 2

      - name: Swap label to ✅ done
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "✅ done"

      - name: Swap label to ❌ failed + log comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "❌ failed"
          # Classify the failure for triage (#635): oc-fail-classify.sh maps
          # the causal failed step (+ log patterns) to push/env/test/agent/
          # infra/no-output and prints "<class>|<hint>". It always exits 0.
          # This job has no pushpr/preflight steps — only agent/testgate ids.
          line=$(bash .github/scripts/oc-fail-classify.sh "${{ github.run_id }}" "$REPO" "${{ github.job }}" \
            "testgate=${{ steps.testgate.outcome }}" "agent=${{ steps.agent.outcome }}" || true)
          if [ -z "$line" ]; then line="unknown|分類取得失敗"; fi
          fclass="${line%%|*}"
          fhint="${line#*|}"
          if [ "$fhint" = "$line" ]; then fhint=""; fi
          body="🏷️ 失敗分類: ${fclass}"
          if [ -n "$fhint" ]; then body="${body}"$'\n'"${fhint}"; fi
          body="${body}"$'\n'"Actions ログ: ${RUN_URL}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"

  # ------------------------------------------------------------------
  # USE_DIRECT_RUN variant — direct `opencode run` CLI jobs replace the
  # official-action jobs when vars.USE_DIRECT_RUN == 'true'.
  # ------------------------------------------------------------------
  implement-direct:
    needs: gate
    if: vars.USE_DIRECT_RUN == 'true' && needs.gate.outputs.allow == 'yes' && needs.gate.outputs.route == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOTE: no job-level permissions override — the top-level set already
    # covers this job. `workflows` is NOT a valid GITHUB_TOKEN scope (it
    # exists only for GitHub Apps), so pushes touching .github/workflows/
    # are rejected server-side regardless; the push step warns about that
    # case explicitly (#635).
    # chromium-only gate (webkit has pre-existing storage-API env failures; Safari parity is Tier2 manual QA)
    # No job-level concurrency: the workflow-level group already serializes per
    # issue, and a job group equal to it deadlocks (job fails with 0 steps).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build prompt.txt (heredoc from env — NO shell expansion)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat > prompt.txt <<'TEMPLATE'
          Implement the GitHub issue below in this repository.
          Follow AGENTS.md strictly: branch ai/<issue番号>-<slug> (slug: lowercase,
          hyphens, alnum only, <=50 chars), small incremental conventional commits,
          PR titled "<type>(ai): <要約> (#N)" referencing the issue, PR body must
          include testing considerations.
          If you change files under api/ or scripts/api/, run ./scripts/api/codegen.sh
          and commit the regenerated artifacts (api/dist/, web/static/api/api-types.d.ts).
          TEMPLATE
          printf '\nIssue number: %s\n\nIssue title:\n%s\n\nIssue body:\n%s\n' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" >> prompt.txt

      - name: Configure git auth (GH_TOKEN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "opencode-bot"
          git config user.email "bot@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Cheap sanity before any step that shells out: branch cleanup uses
      # git/gh, CLI install + sign-in use curl/jq, the agent and delivery
      # step need the rest. Failures here classify as env and cost seconds
      # instead of a full agent run (#635).
      - name: Preflight — toolchain sanity before agent run
        id: preflight
        run: |
          set -uo pipefail
          rc=0
          for cmd in git gh node python3 jq curl; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "::error::preflight: $cmd missing"; rc=1; }
          done
          git ls-remote origin HEAD >/dev/null 2>&1 || { echo "::error::preflight: git ls-remote origin failed (auth/network)"; rc=1; }
          command -v uv >/dev/null 2>&1 || echo "::warning::preflight: uv not on PATH yet (setup-uv runs later in this job)"
          command -v cargo >/dev/null 2>&1 || echo "::warning::preflight: cargo not on PATH (test gate installs its own toolchain)"
          exit $rc

      # Failed attempts leave ai/<N>-* branches on the remote. The agent
      # cannot force-push (opencode.json denies it), so every retry would
      # hit non-fast-forward (#635). Delete residue that no open PR
      # references; open-PR branches are left alone.
      - name: Remove stale ai/<issue>-* branches (non-FF guard)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail
          git fetch origin --prune --quiet
          git ls-remote --heads origin "refs/heads/ai/${ISSUE_NUMBER}-*" |
            while read -r _sha ref; do
              branch="${ref#refs/heads/}"
              # A failed `gh pr list` prints nothing — indistinguishable from
              # "no open PR". Fail-safe: keep the branch rather than risk
              # deleting the head of a live PR.
              prs=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number') || {
                echo "::warning::gh pr list failed for $branch — keeping branch (fail-safe)"
                continue
              }
              if [ -z "$prs" ]; then
                echo "deleting stale branch $branch"
                git push origin --delete "$branch" || echo "::warning::failed to delete $branch"
              else
                echo "keeping $branch (open PR exists)"
              fi
            done

      - name: Install opencode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_0ae3b774-477c-413f-9c37-0afec7f727ba \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      # uv must exist BEFORE the agent runs: codegen.sh and the documented
      # pytest command both go through `uv run` (#636).
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run opencode CLI
        id: agent
        env:
          OPENCODE_API_KEY: ${{ env.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: opencode run --auto -m opencode-go/muse-spark-1.3-contributor "$(cat prompt.txt)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: System deps (dav1d for avif-native, #563)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdav1d-dev pkg-config

      - name: cargo build (test fixture binary)
        run: cargo build -p viewer-rs --manifest-path rust/Cargo.toml

      - name: Playwright version
        id: pw
        run: echo "v=$(uv run --with playwright python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers (chromium)
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run bookq test gate (full suite, viewer-rs)
        id: testgate
        run: BROWSER=chromium BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto --reruns 1 --reruns-delay 2

      - name: Branch, commit, push, open PR
        id: pushpr
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          # The prompt asks the agent to branch and open the PR itself. Reuse its
          # branch instead of cutting a second one under our own slug (its slug
          # rule differs, e.g. "fixsecurity" vs "fix-security"), which produced a
          # duplicate PR of the same commit (#213 / #215).
          cur=$(git rev-parse --abbrev-ref HEAD)
          if [ "$cur" != "HEAD" ] && [ "$cur" != "main" ]; then
            branch="$cur"
          else
            slug=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-50 | sed -E 's/-+$//')
            branch="ai/${ISSUE_NUMBER}-${slug}"
            git checkout -B "$branch"
          fi
          rm -f prompt.txt
          git add -A
          git commit -m "feat(ai): resolve issue #${ISSUE_NUMBER}" || echo "nothing to commit"
          # The agent may have committed + opened the PR from a branch other
          # than the one this step checked out (it can stay on main/HEAD).
          # Count any open PR whose title references the issue as served —
          # otherwise we push an empty branch and `gh pr create` fails with
          # "No commits between main and ..." (#426).
          if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $branch already open (created by the agent)"
            exit 0
          fi
          if [ "$(gh pr list --repo "$REPO" --state open --search "in:title \"#${ISSUE_NUMBER}\"" --json number --jq 'length')" -gt 0 ]; then
            echo "an open PR already references #${ISSUE_NUMBER}"
            exit 0
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            # Nothing pushed and no PR anywhere — the agent produced no
            # output. Fail here instead of leaving a junk empty branch.
            echo "::error::no commits and no PR for #${ISSUE_NUMBER} — agent produced nothing"
            exit 1
          fi
          # Refresh remote-tracking refs, then push. If the remote branch
          # already exists (agent pushed mid-run, collaborator commits added
          # during the test gate, or residue the pre-clean step missed),
          # merge it into HEAD first so those commits are preserved — the
          # push then fast-forwards. No force-push: a lease taken from the
          # just-fetched remote would still overwrite commits local HEAD
          # never contained (#635, review).
          # GITHUB_TOKEN has no `workflows` scope — a diff touching
          # .github/workflows/ is rejected server-side. Warn so the log
          # explains the coming failure instead of looking like a race.
          if git diff --name-only origin/main...HEAD -- .github/workflows/ | grep -q .; then
            echo "::warning::diff includes .github/workflows/ — GITHUB_TOKEN cannot push workflow changes; this push will be rejected"
          fi
          git fetch origin --quiet || true
          if git rev-parse --verify --quiet "refs/remotes/origin/$branch" >/dev/null; then
            if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
              git merge --no-edit "origin/$branch" || {
                echo "::error::cannot merge origin/$branch into $branch — resolve conflicts manually"
                exit 1
              }
            fi
          fi
          git push origin "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "feat(ai): resolve issue #${ISSUE_NUMBER}" \
            --body "Closes #${ISSUE_NUMBER}. Automated via opencode-auto (direct run)."

      - name: Success label transition
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "✅ done"

      - name: Failure label transition + log comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "❌ failed"
          # Classify the failure for triage (#635): oc-fail-classify.sh maps
          # the causal failed step (+ log patterns) to push/env/test/agent/
          # infra/no-output and prints "<class>|<hint>". It always exits 0.
          line=$(bash .github/scripts/oc-fail-classify.sh "${{ github.run_id }}" "$REPO" "${{ github.job }}" \
            "pushpr=${{ steps.pushpr.outcome }}" "testgate=${{ steps.testgate.outcome }}" \
            "preflight=${{ steps.preflight.outcome }}" "agent=${{ steps.agent.outcome }}" || true)
          if [ -z "$line" ]; then line="unknown|分類取得失敗"; fi
          fclass="${line%%|*}"
          fhint="${line#*|}"
          if [ "$fhint" = "$line" ]; then fhint=""; fi
          body="🏷️ 失敗分類: ${fclass}"
          if [ -n "$fhint" ]; then body="${body}"$'\n'"${fhint}"; fi
          body="${body}"$'\n'"Actions ログ: ${RUN_URL}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"

  research-direct:
    needs: gate
    if: vars.USE_DIRECT_RUN == 'true' && needs.gate.outputs.allow == 'yes' && needs.gate.outputs.route == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # chromium-only gate (webkit has pre-existing storage-API env failures; Safari parity is Tier2 manual QA)
    # No job-level concurrency: the workflow-level group already serializes per
    # issue, and a job group equal to it deadlocks (job fails with 0 steps).
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build prompt.txt (heredoc from env — NO shell expansion)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat > prompt.txt <<'TEMPLATE'
          Research the GitHub issue below in this repository.
          BOTH deliverables are REQUIRED:
          1. Post a summary comment on the issue using the gh CLI (GH_TOKEN is configured).
          2. Save a detailed report at docs/reports/YYYY-MM-DD-<slug>.md (<slug>: lowercase,
             hyphens, alnum only, <=50 chars per AGENTS.md) and open a PR containing that file,
             titled "<type>(ai): <要約> (#N)" referencing the issue.
          TEMPLATE
          printf '\nIssue number: %s\n\nIssue title:\n%s\n\nIssue body:\n%s\n' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" >> prompt.txt

      - name: Configure git auth (GH_TOKEN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "opencode-bot"
          git config user.email "bot@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Cheap sanity before any step that shells out: branch cleanup uses
      # git/gh, CLI install + sign-in use curl/jq, the agent and delivery
      # step need the rest. Failures here classify as env and cost seconds
      # instead of a full agent run (#635).
      - name: Preflight — toolchain sanity before agent run
        id: preflight
        run: |
          set -uo pipefail
          rc=0
          for cmd in git gh node python3 jq curl; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "::error::preflight: $cmd missing"; rc=1; }
          done
          git ls-remote origin HEAD >/dev/null 2>&1 || { echo "::error::preflight: git ls-remote origin failed (auth/network)"; rc=1; }
          command -v uv >/dev/null 2>&1 || echo "::warning::preflight: uv not on PATH yet (setup-uv runs later in this job)"
          command -v cargo >/dev/null 2>&1 || echo "::warning::preflight: cargo not on PATH (test gate installs its own toolchain)"
          exit $rc

      # Failed attempts leave ai/<N>-* branches on the remote. The agent
      # cannot force-push (opencode.json denies it), so every retry would
      # hit non-fast-forward (#635). Delete residue that no open PR
      # references; open-PR branches are left alone.
      - name: Remove stale ai/<issue>-* branches (non-FF guard)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail
          git fetch origin --prune --quiet
          git ls-remote --heads origin "refs/heads/ai/${ISSUE_NUMBER}-*" |
            while read -r _sha ref; do
              branch="${ref#refs/heads/}"
              # A failed `gh pr list` prints nothing — indistinguishable from
              # "no open PR". Fail-safe: keep the branch rather than risk
              # deleting the head of a live PR.
              prs=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number') || {
                echo "::warning::gh pr list failed for $branch — keeping branch (fail-safe)"
                continue
              }
              if [ -z "$prs" ]; then
                echo "deleting stale branch $branch"
                git push origin --delete "$branch" || echo "::warning::failed to delete $branch"
              else
                echo "keeping $branch (open PR exists)"
              fi
            done

      - name: Install opencode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_0ae3b774-477c-413f-9c37-0afec7f727ba \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      # uv must exist BEFORE the agent runs: codegen.sh and the documented
      # pytest command both go through `uv run` (#636).
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run opencode CLI
        id: agent
        env:
          OPENCODE_API_KEY: ${{ env.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: opencode run --auto -m opencode-go/muse-spark-1.3-contributor "$(cat prompt.txt)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: System deps (dav1d for avif-native, #563)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdav1d-dev pkg-config

      - name: cargo build (test fixture binary)
        run: cargo build -p viewer-rs --manifest-path rust/Cargo.toml

      - name: Playwright version
        id: pw
        run: echo "v=$(uv run --with playwright python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw.outputs.v }}

      - name: Install Playwright browsers (chromium)
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run bookq test gate (full suite, viewer-rs)
        id: testgate
        run: BROWSER=chromium BOOKQ_TEST_MODE=true uv run --with pytest --with playwright --with-requirements requirements-dev.txt pytest tests/ -q -n auto --reruns 1 --reruns-delay 2

      - name: Branch, commit, push, open PR
        id: pushpr
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          # Reuse the agent's branch/PR — see implement-direct.
          cur=$(git rev-parse --abbrev-ref HEAD)
          if [ "$cur" != "HEAD" ] && [ "$cur" != "main" ]; then
            branch="$cur"
          else
            slug=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-50 | sed -E 's/-+$//')
            branch="ai/${ISSUE_NUMBER}-${slug}"
            git checkout -B "$branch"
          fi
          rm -f prompt.txt
          git add -A
          git commit -m "docs(ai): research report for issue #${ISSUE_NUMBER}" || echo "nothing to commit"
          # Same guard as implement-direct (#426): an open PR whose title
          # references the issue counts as served; never push an empty branch.
          if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $branch already open (created by the agent)"
            exit 0
          fi
          if [ "$(gh pr list --repo "$REPO" --state open --search "in:title \"#${ISSUE_NUMBER}\"" --json number --jq 'length')" -gt 0 ]; then
            echo "an open PR already references #${ISSUE_NUMBER}"
            exit 0
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "::error::no commits and no PR for #${ISSUE_NUMBER} — agent produced nothing"
            exit 1
          fi
          # Same push guard as implement-direct (#635): refresh refs, merge
          # any remote-only commits into HEAD, then a plain fast-forward
          # push — never force-push over commits we don't contain.
          # GITHUB_TOKEN has no `workflows` scope — a diff touching
          # .github/workflows/ is rejected server-side; warn so the log
          # explains the coming failure instead of looking like a race.
          if git diff --name-only origin/main...HEAD -- .github/workflows/ | grep -q .; then
            echo "::warning::diff includes .github/workflows/ — GITHUB_TOKEN cannot push workflow changes; this push will be rejected"
          fi
          git fetch origin --quiet || true
          if git rev-parse --verify --quiet "refs/remotes/origin/$branch" >/dev/null; then
            if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
              git merge --no-edit "origin/$branch" || {
                echo "::error::cannot merge origin/$branch into $branch — resolve conflicts manually"
                exit 1
              }
            fi
          fi
          git push origin "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "docs(ai): research report for issue #${ISSUE_NUMBER}" \
            --body "Closes #${ISSUE_NUMBER}. Automated via opencode-auto (direct run)."

      - name: Success label transition
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "✅ done"

      - name: Failure label transition + log comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "❌ failed"
          # Classify the failure for triage (#635): oc-fail-classify.sh maps
          # the causal failed step (+ log patterns) to push/env/test/agent/
          # infra/no-output and prints "<class>|<hint>". It always exits 0.
          line=$(bash .github/scripts/oc-fail-classify.sh "${{ github.run_id }}" "$REPO" "${{ github.job }}" \
            "pushpr=${{ steps.pushpr.outcome }}" "testgate=${{ steps.testgate.outcome }}" \
            "preflight=${{ steps.preflight.outcome }}" "agent=${{ steps.agent.outcome }}" || true)
          if [ -z "$line" ]; then line="unknown|分類取得失敗"; fi
          fclass="${line%%|*}"
          fhint="${line#*|}"
          if [ "$fhint" = "$line" ]; then fhint=""; fi
          body="🏷️ 失敗分類: ${fclass}"
          if [ -n "$fhint" ]; then body="${body}"$'\n'"${fhint}"; fi
          body="${body}"$'\n'"Actions ログ: ${RUN_URL}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"

  # ------------------------------------------------------------------
  # cleanup — sweep the 🤖 processing sentinel whenever any runner job did
  # not finish cleanly (idempotent with the ❌ failed swap above).
  # Condition shape per dependency job B/C: needs.B.result != 'skipped'
  # / needs.C.result != 'skipped' guards apply to every non-gate job.
  # ------------------------------------------------------------------
  cleanup:
    needs: [implement, research, implement-direct, research-direct]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sweep stale 🤖 processing label
        if: >-
          (needs.implement.result != 'success' && needs.implement.result != 'skipped') ||
          (needs.research.result != 'success' && needs.research.result != 'skipped') ||
          (needs.implement-direct.result != 'success' && needs.implement-direct.result != 'skipped') ||
          (needs.research-direct.result != 'success' && needs.research-direct.result != 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "🤖 processing" || true

      # A job that fails before its first step (e.g. a concurrency deadlock or a
      # workflow error) never reaches its own ❌ failed step. Mark it here unless
      # the job already did. Cancellation is excluded: it means a newer run took over.
      - name: Mark failure the runner job could not report
        if: >-
          needs.implement.result == 'failure' || needs.research.result == 'failure' ||
          needs.implement-direct.result == 'failure' || needs.research-direct.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.client_payload.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join("\n")')
          if printf '%s\n' "$labels" | grep -qxF '❌ failed'; then
            echo "runner job already reported the failure"
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "❌ failed"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "AI 実行ジョブが開始前に失敗しました。Actions ログ: ${RUN_URL}"
