# Rust gate: cargo test over rust/** plus the viewer-rs image build.
# Independent of the uv/FastAPI gates — only fires on Rust-side changes
# (issue #163 parallel-backend track).
name: rust

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter lists the PR's changed files via the API.
  pull-requests: read

jobs:
  # Job-level path gating so every PR reports these check names — see
  # android.yml changes-android for why workflow-level paths: would
  # deadlock required status checks (#382).
  changes-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        # gateway-contract inputs (#199): the OpenAPI spec +
        # expected-statuses overrides drive the suite. api/** also covers
        # api/reader-sync-cases.json — the cargo golden harness input
        # (#210), so a case-file-only edit still triggers this.
        with:
          filters: |
            run:
              - "rust/**"
              - "Dockerfile.viewer-rs"
              - "docker-compose.*-rs.yml"
              - ".github/workflows/rust.yml"
              - "api/**"
              - "schemathesis.toml"

  test:
    needs: changes-rust
    if: github.event_name == 'workflow_dispatch' || needs.changes-rust.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: System deps (zlib for flate2, dav1d for avif-native #563)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev pkg-config libdav1d-dev

      # libpdfium (PDFium engine for the native PDF pipeline, #402) — must
      # track pdfium-render's `pdfium_latest` bindings. Version AND
      # checksum are read from Dockerfile.viewer-rs at run time so the
      # weekly pdfium-update PR never has to touch this workflow file
      # (GITHUB_TOKEN can't push .github/workflows/ changes — #603 review).
      # Without it the render tests degrade to the 501-decline asserts.
      - name: libpdfium for native PDF tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdfium-test/lib
          pdfium_ver=$(grep -oP '^ARG PDFIUM_VERSION=\K[0-9]+' Dockerfile.viewer-rs)
          pdfium_sha=$(grep -oP '^ARG PDFIUM_SHA256_AMD64=\K[0-9a-f]+' Dockerfile.viewer-rs)
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/${pdfium_ver}/pdfium-linux-x64.tgz"
          echo "${pdfium_sha}  /tmp/pdfium.tgz" | sha256sum -c -
          tar xzf /tmp/pdfium.tgz -C /tmp/pdfium-test
          echo "PDFIUM_LIB_PATH=$(find /tmp/pdfium-test/lib -name 'libpdfium*' | head -1)" >> "$GITHUB_ENV"
          ls -la /tmp/pdfium-test/lib/

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo test
        working-directory: rust
        run: cargo test --workspace

  # Builds the viewer-rs image once and runs the gateway contract suite
  # against it — previously image-build and gateway-contract each built
  # the same Dockerfile.viewer-rs on separate runners (~5min of duplicate
  # release+LTO compile per run), so the contract steps live here now and
  # gateway-contract below aggregates the result under its check name.
  image-build:
    needs: changes-rust
    if: github.event_name == 'workflow_dispatch' || needs.changes-rust.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_*_URL to the shell — without
      # them `type=gha` cache-from/to is skipped silently (#380).
      - uses: crazy-max/ghaction-github-runtime@v4

      - uses: astral-sh/setup-uv@v7

      - name: Build synthetic library tree
        run: |
          mkdir -p .ci-dl/Series/vol1 .ci-dl/Manga
          uv run --with pillow python - <<'EOF'
          from PIL import Image
          import io, zipfile
          for i in range(3):
              Image.new("RGB", (80, 120), (i * 60, 0, 0)).save(f".ci-dl/Series/vol1/p{i:02d}.jpg")
          Image.new("RGB", (80, 120), (0, 60, 0)).save(".ci-dl/Series/vol1/cover.png")
          with zipfile.ZipFile(".ci-dl/Manga/pack.zip", "w") as z:
              for i in range(3):
                  b = io.BytesIO()
                  Image.new("RGB", (80, 120), (0, 0, i * 60)).save(b, "JPEG")
                  z.writestr(f"{i+1:02d}.jpg", b.getvalue())
          # 2-page PDF for the native PDF pipeline (#402): PIL embeds one
          # image per page, PDFium renders both.
          pages = [Image.new("RGB", (80, 120), (i * 60, 60, 0)) for i in range(2)]
          pages[0].save(".ci-dl/Series/vol1/doc.pdf", save_all=True, append_images=pages[1:])
          EOF

      # type=gha layer cache: unchanged Cargo.lock/deps rebuild in seconds
      # instead of a full cold cargo build (#380). --load puts the image in
      # the daemon for the `docker run` contract checks below.
      - name: docker build viewer-rs
        run: >-
          docker buildx build --load
          --cache-from type=gha,scope=viewer-rs
          --cache-to type=gha,mode=max,scope=viewer-rs
          -t bookq-ci:viewer-rs
          -f Dockerfile.viewer-rs .

      # Production mode since #409: viewer-rs runs upstream-absent with
      # strict native validation. A silent fallback can no longer hide
      # behind a Python proxy — an unimplemented path answers 501 (#456).
      - name: Start viewer-rs (no upstream, all native, strict)
        run: |
          docker volume create bookq-ci-thumbs
          docker volume create bookq-ci-state
          docker run -d --name viewer-rs -p 127.0.0.1:8080:8080 \
            -e BOOKQ_BIND=0.0.0.0:8080 \
            -e BOOKQ_TEST_MODE=true \
            -e GOOGLE_CLIENT_ID=ci-dummy -e GOOGLE_CLIENT_SECRET=ci-dummy \
            -e BASE_URL=http://127.0.0.1:8080 \
            -e SECRET_KEY=ci-not-a-secret \
            -e LIBRARY_DIR=/app/library -e BOOKQ_STATE_DIR=/var/lib/bookq \
            -e BOOKQ_THUMB_CACHE_DIR=/var/cache/bookq-thumbs \
            -v "$PWD/.ci-dl:/app/library" \
            -v bookq-ci-state:/var/lib/bookq -v bookq-ci-thumbs:/var/cache/bookq-thumbs \
            bookq-ci:viewer-rs
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null \
            || { docker logs viewer-rs || true; echo "viewer-rs never healthy"; exit 1; }
          # Cold index answers 202 + Retry-After; poll until the build lands.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/tree)
            [ "$code" = "200" ] && break || sleep 1
          done
          [ "$code" = "200" ] || { docker logs viewer-rs || true; echo "tree never warmed"; exit 1; }

      # Issue #199 — the same Schemathesis suite api-contract.yml runs against
      # FastAPI, but pointed at the viewer-rs gateway: every v1 operation must
      # satisfy the contract whether it is answered natively or proxied, and the
      # `server` response header discriminates which backend answered
      # (`hypercorn-h11` = proxied to FastAPI, absent = viewer-rs native).
      - name: Schemathesis via gateway
        run: |
          uv run --with "schemathesis>=4.33,<5" schemathesis run api/openapi.v1.yaml \
            --url http://127.0.0.1:8080 \
            --exclude-checks ignored_auth,allow_header_conformance \
            --exclude-deprecated

      # Schemathesis fuzzes POST/DELETE against the rw-mounted library, so
      # it may delete canonical fixtures or leave uploads behind — the
      # 200-check below hits fixture paths and would flake. Empty the
      # mount *contents* only (the dir itself is the bind inode), rebuild,
      # and force an index refresh. The delete runs as root in a throwaway
      # debian container (#573: the distroless runtime has no shell/find, and
      # .bookq-uploads/ session dirs are written by viewer-rs, so the host
      # runner gets EACCES unlinking them).
      - name: Regenerate fuzzed library fixtures
        run: |
          docker run --rm --volumes-from viewer-rs debian:bookworm-slim \
            find /app/library -mindepth 1 -delete
          mkdir -p .ci-dl/Series/vol1 .ci-dl/Manga
          uv run --with pillow python - <<'EOF'
          from PIL import Image
          import io, zipfile
          for i in range(3):
              Image.new("RGB", (80, 120), (i * 60, 0, 0)).save(f".ci-dl/Series/vol1/p{i:02d}.jpg")
          Image.new("RGB", (80, 120), (0, 60, 0)).save(".ci-dl/Series/vol1/cover.png")
          with zipfile.ZipFile(".ci-dl/Manga/pack.zip", "w") as z:
              for i in range(3):
                  b = io.BytesIO()
                  Image.new("RGB", (80, 120), (0, 0, i * 60)).save(b, "JPEG")
                  z.writestr(f"{i+1:02d}.jpg", b.getvalue())
          pages = [Image.new("RGB", (80, 120), (i * 60, 60, 0)) for i in range(2)]
          pages[0].save(".ci-dl/Series/vol1/doc.pdf", save_all=True, append_images=pages[1:])
          EOF
          curl -sf -X POST http://127.0.0.1:8080/api/v1/index/refresh >/dev/null || true
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/tree)
            [ "$code" = "200" ] && break || sleep 1
          done
          [ "$code" = "200" ] || { docker logs viewer-rs || true; echo "tree never re-warmed"; exit 1; }

      # With no upstream there is no proxy to hide behind: a 200 on a v1
      # path is native by construction, and any silent fall-through shows
      # up as a "fallback answered 501" WARN. Request each path twice —
      # the first pass warms the shared thumb/sprite cache, the second
      # exercises the hit path.
      - name: All v1 endpoints answered 200 with zero fallbacks
        run: |
          # Window the fallback check — schemathesis' earlier fuzz may have
          # legitimately produced fallback WARNs on non-contract paths.
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%S)
          uv run python - <<'EOF'
          import urllib.request, urllib.error, sys
          B = "http://127.0.0.1:8080"
          def get(p):
              try:
                  r = urllib.request.urlopen(B + p)
                  return r.status
              except urllib.error.HTTPError as e:
                  return e.code
          V1 = [
              "/api/v1/health", "/api/v1/version",
              "/api/v1/tree", "/api/v1/tree?depth=1",
              "/api/v1/images?folder=Series/vol1",
              "/api/v1/images?folder=Series%2Fvol1%2Fdoc.pdf",
              "/api/v1/search?q=p", "/api/v1/facets",
              "/api/v1/reading-positions", "/api/v1/folder-visibility",
              "/image/Series/vol1/p00.jpg", "/image/Manga/pack.zip/01.jpg",
              "/image/Series/vol1/doc.pdf/p001.png",
              "/view/Series/vol1/p00.jpg",
              "/view/Series/vol1/doc.pdf/p001.png",
              # ?w= fast-tier must stay native too (#440).
              "/view/Series/vol1/p00.jpg?w=400",
              "/thumb/Series/vol1/p00.jpg?w=200",
              "/thumb/Series/vol1/doc.pdf/p001.png?w=200",
              "/api/v1/thumb-sprite?folder=Manga%2Fpack.zip&names=01.jpg,02.jpg",
          ]
          failed = []
          for p in V1:
              for _ in range(2):
                  st = get(p)
              if st != 200:
                  failed.append((p, st))
              print("v1", st, p)
          for p, st in failed:
              print(f"FAIL {p}: status={st}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          EOF
          # Any fallback among the v1 probes is a bug — upstream is absent.
          if docker logs --since "$SINCE" viewer-rs 2>&1 | grep -q "fallback answered 501"; then
            docker logs --since "$SINCE" viewer-rs 2>&1 | grep "fallback answered 501"
            echo "v1 probe(s) fell through to the dead proxy path" >&2
            exit 1
          fi
          # v0 surface correctly refuses with 501 in no-upstream mode (#408).
          uv run python - <<'EOF'
          import urllib.request, urllib.error, sys
          B = "http://127.0.0.1:8080"
          LEGACY = ["/api/folders", "/api/health"]
          failed = []
          for p in LEGACY:
              try:
                  st = urllib.request.urlopen(B + p).status
              except urllib.error.HTTPError as e:
                  st = e.code
              if st != 501:
                  failed.append((p, st))
              print("legacy-501", st, p)
          for p, st in failed:
              print(f"FAIL {p}: status={st} (expected 501)", file=sys.stderr)
          sys.exit(1 if failed else 0)
          EOF

      # PDF byte contract (#402): the native render must be a PNG at
      # pypdfium2's scale-2.0 dimensions, listed as p001.png/p002.png, with
      # a working etag→304 round-trip — all answered natively.
      - name: PDF render contract is native and well-formed
        run: |
          uv run --with pillow python - <<'EOF'
          import json, sys, urllib.request, urllib.error
          B = "http://127.0.0.1:8080"
          def get(p, headers=None):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(B + p, headers=headers or {}))
                  return r.status, r.headers, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read()
          st, h, body = get("/image/Series/vol1/doc.pdf/p001.png")
          assert st == 200, st
          assert h.get_content_type() == "image/png", h.get_content_type()
          assert body[:8] == b"\x89PNG\r\n\x1a\n", body[:8]
          from PIL import Image
          import io as _io
          assert Image.open(_io.BytesIO(body)).size == (160, 240), "scale-2.0 dims"
          st, h, body = get("/api/v1/images?folder=Series%2Fvol1%2Fdoc.pdf")
          assert st == 200, st
          assert json.loads(body)["images"] == ["p001.png", "p002.png"], body[:200]
          st, h, body = get("/image/Series/vol1/doc.pdf/p001.png")
          etag = h.get("ETag")
          st2, _, _ = get("/image/Series/vol1/doc.pdf/p001.png", {"If-None-Match": etag})
          assert st2 == 304, st2
          print("pdf contract ok:", etag)
          EOF

  # Required-check anchor: the gateway contract suite runs inside
  # image-build now (one image build instead of two). This job keeps the
  # `gateway-contract` check name reporting — it fails unless image-build
  # succeeded, so a contract failure still blocks merge via both contexts.
  gateway-contract:
    needs: [changes-rust, image-build]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes-rust.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify image-build + gateway contract
        env:
          RESULT: ${{ needs.image-build.result }}
        run: |
          echo "image-build: $RESULT"
          [ "$RESULT" = "success" ]
