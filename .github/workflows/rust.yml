# Rust gate: cargo test over rust/** plus the viewer-rs image build.
# Independent of the uv/FastAPI gates — only fires on Rust-side changes
# (issue #163 parallel-backend track).
name: rust

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter lists the PR's changed files via the API.
  pull-requests: read

jobs:
  # Job-level path gating so every PR reports these check names — see
  # android.yml changes-android for why workflow-level paths: would
  # deadlock required status checks (#382).
  changes-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        # gateway-contract inputs (#199): the OpenAPI spec +
        # expected-statuses overrides drive the suite, and the job builds
        # the Python Dockerfile. api/** also covers
        # api/reader-sync-cases.json — the cargo golden harness input
        # (#210), so a case-file-only edit still triggers this.
        with:
          filters: |
            run:
              - "rust/**"
              - "Dockerfile.viewer-rs"
              - "docker-compose.*-rs.yml"
              - ".github/workflows/rust.yml"
              - "api/**"
              - "schemathesis.toml"
              - "Dockerfile"

  test:
    needs: changes-rust
    if: github.event_name == 'workflow_dispatch' || needs.changes-rust.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: System deps (zlib for flate2)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo test
        working-directory: rust
        run: cargo test --workspace

  image-build:
    needs: changes-rust
    if: github.event_name == 'workflow_dispatch' || needs.changes-rust.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_*_URL to the shell — without
      # them `type=gha` cache-from/to is skipped silently (#380).
      - uses: crazy-max/ghaction-github-runtime@v4

      # type=gha layer cache: unchanged Cargo.lock/deps rebuild in seconds
      # instead of a full cold cargo build (#380).
      - name: docker build viewer-rs
        run: >-
          docker buildx build
          --cache-from type=gha,scope=viewer-rs
          --cache-to type=gha,mode=max,scope=viewer-rs
          -f Dockerfile.viewer-rs .

  # Issue #199 — the same Schemathesis suite api-contract.yml runs against
  # FastAPI, but pointed at the viewer-rs gateway: every v1 operation must
  # satisfy the contract whether it is answered natively or proxied, and the
  # `server` response header discriminates which backend answered
  # (`hypercorn-h11` = proxied to FastAPI, absent = viewer-rs native).
  gateway-contract:
    needs: changes-rust
    if: github.event_name == 'workflow_dispatch' || needs.changes-rust.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Build synthetic downloads tree
        run: |
          mkdir -p .ci-dl/Series/vol1 .ci-dl/Manga
          uv run --with pillow python - <<'EOF'
          from PIL import Image
          import io, zipfile
          for i in range(3):
              Image.new("RGB", (80, 120), (i * 60, 0, 0)).save(f".ci-dl/Series/vol1/p{i:02d}.jpg")
          Image.new("RGB", (80, 120), (0, 60, 0)).save(".ci-dl/Series/vol1/cover.png")
          with zipfile.ZipFile(".ci-dl/Manga/pack.zip", "w") as z:
              for i in range(3):
                  b = io.BytesIO()
                  Image.new("RGB", (80, 120), (0, 0, i * 60)).save(b, "JPEG")
                  z.writestr(f"{i+1:02d}.jpg", b.getvalue())
          EOF

      - uses: docker/setup-buildx-action@v3

      # Same runtime env exposure as image-build — required for type=gha.
      - uses: crazy-max/ghaction-github-runtime@v4

      # --load puts the images in the daemon for the compose-free `docker run`
      # below; per-image scopes keep the Python and Rust caches independent.
      - name: Build images
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=viewer \
            --cache-to type=gha,mode=max,scope=viewer \
            -t bookq-ci:viewer -f Dockerfile .
          docker buildx build --load \
            --cache-from type=gha,scope=viewer-rs \
            --cache-to type=gha,mode=max,scope=viewer-rs \
            -t bookq-ci:viewer-rs -f Dockerfile.viewer-rs .

      - name: Start viewer + viewer-rs
        run: |
          docker network create bookq-ci
          docker volume create bookq-ci-thumbs
          docker volume create bookq-ci-state
          docker run -d --name viewer --network bookq-ci \
            -e BOOKQ_TEST_MODE=true -e DOWNLOADS_DIR=/app/downloads \
            -e BOOKQ_STATE_DIR=/var/lib/bookq \
            -e BOOKQ_THUMB_CACHE_DIR=/var/cache/bookq-thumbs \
            -e SECRET_KEY=ci-not-a-secret -e ALLOWED_EMAILS=test@example.com \
            -v "$PWD/.ci-dl:/app/downloads:ro" \
            -v bookq-ci-state:/var/lib/bookq -v bookq-ci-thumbs:/var/cache/bookq-thumbs \
            bookq-ci:viewer
          docker run -d --name viewer-rs --network bookq-ci -p 127.0.0.1:8080:8080 \
            -e BOOKQ_UPSTREAM=http://viewer:8080 -e BOOKQ_BIND=0.0.0.0:8080 \
            -e BOOKQ_TEST_MODE=true -e BOOKQ_RS_NATIVE=all \
            -e ALLOWED_EMAILS=test@example.com -e SECRET_KEY=ci-not-a-secret \
            -e DOWNLOADS_DIR=/app/downloads -e BOOKQ_STATE_DIR=/var/lib/bookq \
            -e BOOKQ_THUMB_CACHE_DIR=/var/cache/bookq-thumbs \
            -v "$PWD/.ci-dl:/app/downloads:ro" \
            -v bookq-ci-state:/var/lib/bookq -v bookq-ci-thumbs:/var/cache/bookq-thumbs \
            bookq-ci:viewer-rs
          # /api/folders is v0 → always proxied — a 200 proves the whole
          # chain (viewer-rs up AND upstream reachable).
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/api/folders && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null \
            || { docker logs viewer-rs || true; docker logs viewer || true; echo "gateway never healthy"; exit 1; }
          # Cold index answers 202 + Retry-After; poll until the build lands.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/tree)
            [ "$code" = "200" ] && break || sleep 1
          done
          [ "$code" = "200" ] || { docker logs viewer-rs || true; docker logs viewer || true; echo "tree never warmed"; exit 1; }

      - name: Schemathesis via gateway
        run: |
          uv run --with schemathesis schemathesis run api/openapi.v1.yaml \
            --url http://127.0.0.1:8080 \
            --exclude-checks ignored_auth,allow_header_conformance

      # thumb/sprite entries are rendered by upstream on the first request,
      # so the hit path (what we assert natively serves) only exists after a
      # warming pass — request everything twice and assert on the second.
      - name: Native endpoints are answered by viewer-rs, not proxied
        run: |
          uv run python - <<'EOF'
          import urllib.request, urllib.error, sys
          B = "http://127.0.0.1:8080"
          def get(p):
              try:
                  r = urllib.request.urlopen(B + p)
                  return r.status, r.headers
              except urllib.error.HTTPError as e:
                  return e.code, e.headers
          NATIVE = [
              "/api/v1/health", "/api/v1/version",
              "/api/v1/tree", "/api/v1/tree?depth=1",
              "/api/v1/images?folder=Series/vol1",
              "/api/v1/search?q=p", "/api/v1/facets",
              "/api/v1/reading-positions", "/api/v1/folder-visibility",
              "/image/Series/vol1/p00.jpg", "/image/Manga/pack.zip/01.jpg",
              "/view/Series/vol1/p00.jpg",
              # ?w= fast-tier must stay native too (#440).
              "/view/Series/vol1/p00.jpg?w=400",
              "/thumb/Series/vol1/p00.jpg?w=200",
              "/api/v1/thumb-sprite?folder=Manga%2Fpack.zip&names=01.jpg,02.jpg",
          ]
          # Fall-through controls (v0 surface — never native).
          PROXY = ["/api/folders", "/api/health"]
          failed = []
          for p in NATIVE + PROXY:
              for _ in range(2):  # 1st warms the shared cache; 2nd must be native
                  st, h = get(p)
              srv = h.get("server") or h.get("Server") or ""
              native = "hypercorn" not in srv
              ok = (st == 200) and (native if p in NATIVE else not native)
              if not ok:
                  failed.append((p, st, srv))
              print(("native " if native else "proxied"), st, p)
          for p, st, srv in failed:
              print(f"FAIL {p}: status={st} server={srv!r}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          EOF
