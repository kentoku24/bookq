name: openresearch-bridge
run-name: "oc-bridge #${{ github.event.client_payload.issue_number || inputs.source_issue_number || github.run_id }}"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      source_issue_number:
        description: "Source openresearch issue number to mirror (optional — if empty, scans all target:bookq)"
        required: false
        type: string
  repository_dispatch:
    types: [openresearch-issue]

# Workflow default is read-only; the mirror job escalates only what it needs below.
permissions:
  contents: read

concurrency:
  group: oc-bridge-${{ github.event.client_payload.issue_number || inputs.source_issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mirror openresearch issues with target:bookq
        env:
          GH_TOKEN: ${{ github.token }}
          OPENRESEARCH_READ_TOKEN: ${{ secrets.OPENRESEARCH_READ_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_ISSUE_INPUT: ${{ inputs.source_issue_number }}
          DISPATCH_ISSUE: ${{ github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail

          # Helper: mirror a single openresearch issue number into bookq
          mirror_one() {
            local src_num="$1"
            echo "::group::mirror openresearch#$src_num"

            # Fetch source issue (404/401 -> skip gracefully)
            src_json=$(GH_TOKEN="$OPENRESEARCH_READ_TOKEN" gh api "repos/kentoku24/openresearch/issues/${src_num}" 2>/dev/null || echo "")
            if [ -z "$src_json" ] || [ "$src_json" = "" ]; then
              echo "issue not found — skip (src #$src_num)"
              echo "::endgroup::"
              return 0
            fi
            # Validate it was not a 404 error payload
            if echo "$src_json" | jq -e 'has("message") and (.message | contains("Not Found"))' >/dev/null 2>&1; then
              echo "issue not found — skip (src #$src_num)"
              echo "::endgroup::"
              return 0
            fi

            src_title=$(echo "$src_json" | jq -r '.title // empty')
            src_body=$(echo "$src_json" | jq -r '.body // empty')
            if [ -z "$src_title" ]; then
              echo "empty title — skip (src #$src_num)"
              echo "::endgroup::"
              return 0
            fi

            # Duplicate check: skip if bookq already has an issue with Related reference
            echo "checking duplicate for Related: kentoku24/openresearch#${src_num}"
            existing=$(gh issue list --repo "$REPO" --search "Related: kentoku24/openresearch#${src_num}" --json number --jq 'length' 2>/dev/null || echo "0")
            if [ "$existing" != "0" ] && [ -n "$existing" ]; then
              echo "duplicate found — skip (src #$src_num already mirrored, matches: $existing)"
              echo "::endgroup::"
              return 0
            fi

            # Create mirrored issue in bookq
            echo "creating mirrored issue for openresearch#$src_num"
            body="Related: kentoku24/openresearch#${src_num}

          ${src_body}

          ---
          Mirrored from kentoku24/openresearch#${src_num}"

            # gh issue create prints URL; capture number via --json or parse
            created_url=$(gh issue create --repo "$REPO" --title "$src_title" --label "ai/implement" --body "$body" 2>&1) || {
              echo "gh issue create failed for src #$src_num: $created_url"
              echo "::endgroup::"
              return 0
            }
            echo "created: $created_url"

            # Extract issue number from URL (e.g. https://github.com/owner/repo/issues/123)
            new_num=$(echo "$created_url" | grep -oE '[0-9]+$' | tail -n1 || echo "")
            if [ -z "$new_num" ]; then
              # Fallback: query by Related search to find just-created issue
              new_num=$(gh issue list --repo "$REPO" --search "Related: kentoku24/openresearch#${src_num}" --json number --jq '.[0].number' 2>/dev/null || echo "")
            fi
            if [ -z "$new_num" ] || [ "$new_num" = "null" ]; then
              echo "could not determine new issue number — skip comment/dispatch"
              echo "::endgroup::"
              return 0
            fi
            echo "mirrored as bookq#$new_num"

            # Comment back to source (failure must NOT fail bridge)
            GH_TOKEN="$OPENRESEARCH_READ_TOKEN" gh api "repos/kentoku24/openresearch/issues/${src_num}/comments" -f body="Mirrored to bookq#${new_num}: ${created_url}" 2>/dev/null || echo "warning: failed to comment back to openresearch#${src_num} (non-fatal)"

            # Dispatch to bypass bot gate — trigger opencode implementation directly via repository_dispatch
            # Must NOT fail bridge if dispatch fails
            gh api "repos/${REPO}/dispatches" -f event_type=openresearch-issue -F "client_payload[issue_number]=${new_num}" -F "client_payload[route]=implement" 2>/dev/null || echo "warning: dispatch failed for bookq#${new_num} (non-fatal)"

            echo "::endgroup::"
          }

          # Determine mode: single-issue (workflow_dispatch / repository_dispatch) or scheduled scan
          single_src=""
          if [ -n "${SOURCE_ISSUE_INPUT:-}" ]; then
            single_src="$SOURCE_ISSUE_INPUT"
          elif [ -n "${DISPATCH_ISSUE:-}" ]; then
            single_src="$DISPATCH_ISSUE"
          fi

          if [ -n "$single_src" ]; then
            echo "single-issue mode: source_issue_number=$single_src"
            mirror_one "$single_src"
            exit 0
          fi

          # Scheduled scan: fetch all open issues with label target:bookq (401/404 -> empty)
          echo "scheduled scan: fetching openresearch issues with target:bookq"
          issues_json=$(GH_TOKEN="$OPENRESEARCH_READ_TOKEN" gh api "repos/kentoku24/openresearch/issues?labels=target:bookq&state=open" 2>/dev/null || echo "[]")
          # Ensure valid JSON array; if gh returned empty/error string, treat as empty
          if ! echo "$issues_json" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "fetch returned non-array (likely 401/404) — treating as empty"
            issues_json="[]"
          fi

          count=$(echo "$issues_json" | jq 'length' 2>/dev/null || echo "0")
          echo "found $count issue(s) with target:bookq"
          if [ "$count" = "0" ] || [ -z "$count" ]; then
            echo "nothing to mirror"
            exit 0
          fi

          # Iterate each issue number
          echo "$issues_json" | jq -r '.[].number' | while read -r num; do
            [ -n "$num" ] || continue
            mirror_one "$num"
          done

          echo "bridge complete"
