# Lint the API contract files (single source of truth for server/client).
# Spectral validates OpenAPI + AsyncAPI shape and hygiene rules from
# .spectral.yaml. codegen-drift regenerates derived artifacts via
# scripts/api/codegen.sh and fails the PR when they are stale.
# Runs on any PR touching api/, the generated artifacts, the codegen
# scripts, or this workflow.
name: api-spec-lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter lists the PR's changed files via the API.
  pull-requests: read

jobs:
  # Job-level path gating so every PR reports this check name — see
  # android.yml changes-android for why workflow-level paths: would
  # deadlock required status checks (#382).
  changes-api-spec-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            run:
              - "api/**"
              - ".spectral.yaml"
              - "scripts/api/**"
              - "app/static/api/api-types.d.ts"
              - ".github/workflows/api-spec-lint.yml"

  spectral:
    needs: changes-api-spec-lint
    if: github.event_name == 'workflow_dispatch' || needs.changes-api-spec-lint.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Lint API specs
        run: npx --yes @stoplight/spectral-cli lint --ruleset .spectral.yaml --fail-severity error api/openapi.v1.yaml api/asyncapi.yaml

  # Regenerate every derived artifact (api-types.d.ts + api/dist/*.json)
  # and fail if the working tree differs — editing a spec without
  # re-running codegen.sh breaks the PR.
  codegen-drift:
    needs: changes-api-spec-lint
    if: github.event_name == 'workflow_dispatch' || needs.changes-api-spec-lint.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v7

      - name: Regenerate derived artifacts
        run: ./scripts/api/codegen.sh

      # porcelain catches untracked files too — `git diff --exit-code`
      # alone would miss a new file under api/dist/.
      - name: Fail on drift
        run: |
          drift="$(git status --porcelain -- api/dist app/static/api/api-types.d.ts)"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::derived artifacts are stale — run ./scripts/api/codegen.sh and commit the output"
            exit 1
          fi
