# Contract test: run viewer-rs in test mode and verify it conforms to
# api/openapi.v1.yaml via Schemathesis (property-based testing over the spec).
#
# `ignored_auth` is excluded because BOOKQ_TEST_MODE bypasses auth by design —
# the check would flag every authenticated operation as "accepts invalid
# credentials". Auth enforcement itself is covered by tests/test_bearer_auth.py.
# `allow_header_conformance` is excluded because Starlette's default OPTIONS
# handler only ever reports "Allow: GET" — a framework quirk, not a contract
# decision we control at the route level.
name: api-contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # paths-filter lists the PR's changed files via the API.
  pull-requests: read

jobs:
  # Job-level path gating so every PR reports this check name — see
  # android.yml changes-android for why workflow-level paths: would
  # deadlock required status checks (#382).
  changes-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        # expected-statuses overrides — a toml-only edit must still run
        # the suite, hence schemathesis.toml below.
        with:
          filters: |
            run:
              - "api/**"
              - "app/**"
              - "rust/**"
              - "Dockerfile.viewer-rs"
              - "requirements*.txt"
              - ".github/workflows/api-contract.yml"
              - "schemathesis.toml"

  schemathesis:
    needs: changes-api-contract
    if: github.event_name == 'workflow_dispatch' || needs.changes-api-contract.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: System deps (zlib for flate2)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: astral-sh/setup-uv@v7

      - name: Build synthetic downloads tree
        run: |
          mkdir -p /tmp/dl/Series/vol1 /tmp/bookq-state
          uv run --with pillow python - <<'EOF'
          from PIL import Image
          for i in range(3):
              Image.new("RGB", (80, 120), (i * 60, 0, 0)).save(f"/tmp/dl/Series/vol1/p{i:02d}.jpg")
          EOF

      - name: Build viewer-rs
        working-directory: rust
        run: cargo build -p viewer-rs

      # Same shape as production (#409): upstream-absent, every gate native,
      # strict startup validation — a missing gate exits before serving.
      - name: Start viewer-rs (no upstream, all native, strict)
        run: |
          BOOKQ_TEST_MODE=true BOOKQ_STATE_DIR=/tmp/bookq-state DOWNLOADS_DIR=/tmp/dl \
            BOOKQ_BIND=127.0.0.1:8080 BOOKQ_RS_NATIVE=all BOOKQ_RS_NATIVE_STRICT=1 \
            GOOGLE_CLIENT_ID=ci-dummy GOOGLE_CLIENT_SECRET=ci-dummy \
            BASE_URL=http://127.0.0.1:8080 \
            SECRET_KEY=ci-not-a-secret ALLOWED_EMAILS=test@example.com \
            rust/target/debug/viewer-rs > /tmp/bookq-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/v1/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null \
            || { cat /tmp/bookq-server.log; echo "viewer-rs did not become healthy"; exit 1; }
          # Cold index answers 202 + Retry-After; poll until the build lands.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/tree)
            [ "$code" = "200" ] && break || sleep 1
          done
          [ "$code" = "200" ] || { cat /tmp/bookq-server.log; echo "tree never warmed"; exit 1; }

      # Seed stays random — the fuzz value of this job is that each run
      # explores different inputs (#326). Reproducibility comes from the
      # artifacts instead: the crash cache under .schemathesis/ replays a
      # failing case via `st replay`, the printed `Seed:` enables a full
      # `st run --seed N` rerun, the ndjson report carries every case, and
      # the server log holds the traceback behind any 5xx.
      - name: Schemathesis contract test
        run: |
          uv run --with "schemathesis>=4.33,<5" schemathesis run api/openapi.v1.yaml \
            --url http://127.0.0.1:8080 \
            --exclude-checks ignored_auth,allow_header_conformance \
            --report junit,ndjson --report-dir schemathesis-report

      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          # run_attempt disambiguates job retries — v4 artifact names are
          # immutable within a run.
          name: schemathesis-diagnostics-${{ github.run_attempt }}
          # upload-artifact >=4.4 skips hidden entries by default — the
          # .schemathesis crash cache is the point of this artifact.
          include-hidden-files: true
          path: |
            /tmp/bookq-server.log
            schemathesis-report/
            .schemathesis/
          if-no-files-found: ignore
