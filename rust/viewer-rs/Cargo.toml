[package]
name = "viewer-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust backend for bookq — parallel deployment with proxy fall-through (issue #163)"
license = "Proprietary"

[dependencies]
bookq-core = { path = "../bookq-core" }
crc32fast = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
flate2 = { version = "1", features = ["zlib"] }
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.12"
http-body-util = "0.1"
httpdate = "1"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
# default-features off: default pulls ~40 unused crates (ravif/rav1e AVIF
# encoder, exr, tiff, qoi, moxcms, rayon). Min = locked version, which is
# what we build/test (ImageDecoder::orientation landed in 0.25.5).
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
