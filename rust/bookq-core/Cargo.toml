[package]
name = "bookq-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust port of bookq's CPU-heavy server logic (issue #163)"
license = "Proprietary"

[dependencies]
crc32fast = "1"
# RARLAB unrar (bundled C source) — the same engine rarfile shells out to,
# in-process instead of one 7z subprocess per page (#163).
# Known limit: `Code::from` panics on ERAR_LARGE_DICT (RAR7 dict >4GB);
# spawn_blocking turns that panic into a JoinError → proxy fallback.
unrar = "0.5.8"
# zlib-rs backend: miniz_oxide inflates ~2-3x slower than zlib C; zlib-rs is
# pure Rust, faster than C zlib, and self-contained (no system zlib needed).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# pdfium-render (PDFium engine — same renderer pypdfium2 wraps, #402).
# Default features: pdfium_latest (=8125 bindings) + image_025 + thread_safe
# (mutex-serialized access; render calls ride spawn_blocking like unrar).
# Dynamic linking only: the .so ships in the viewer-rs image
# (Dockerfile.viewer-rs) and PDFIUM_DYNAMIC_LIB_PATH points at it at
# runtime; when no library is present every entry point degrades to the
# lopdf/regex fallback so cargo test stays green without the .so.
pdfium-render = "0.9.5"
# PNG encoder for rendered pages (pure-Rust; unifies with pdfium-render's
# image 0.25 so DynamicImage types match across the two crates).
image = { version = "0.25", default-features = false, features = ["png"] }
lopdf = "0.42"
roxmltree = "0.20"
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
