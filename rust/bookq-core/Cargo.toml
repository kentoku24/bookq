[package]
name = "bookq-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust port of bookq's CPU-heavy server logic (issue #163)"
license = "Proprietary"

[dependencies]
crc32fast = "1"
# RARLAB unrar (bundled C source) — the same engine rarfile shells out to,
# in-process instead of one 7z subprocess per page (#163).
# Known limit: `Code::from` panics on ERAR_LARGE_DICT (RAR7 dict >4GB);
# spawn_blocking turns that panic into a JoinError → proxy fallback.
unrar = "0.5.8"
# zlib-rs backend: miniz_oxide inflates ~2-3x slower than zlib C; zlib-rs is
# pure Rust, faster than C zlib, and self-contained (no system zlib needed).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lopdf = "0.38"
roxmltree = "0.20"
sha2 = "0.10"
toml = "0.8"
