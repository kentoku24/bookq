// Compose stability declarations (M10 audit) — marks :core's immutable
// value carriers stable WITHOUT adding a compose dependency to the pure
// Kotlin module. Only classes whose instances never mutate after
// construction belong here (a lie leaks stale reads past skipping).
//
// Notably EXCLUDED (they mutate internally): ProgressBook, VisibilityState,
// AppGraph/AppModel/ServerScope/controllers (singletons — strong skipping
// already reference-compares them; a fake @Stable would hide real bugs).

