# bookq — 本番。既定の到達経路は tailscale サイドカー経由の HTTPS。
# 独自ドメイン公開時は opt-in の cloudflared (profile `public`) が
# 第 2 の到達経路になる (#349、docs/deployment.md「独自ドメイン公開」)。
#
# 未検証コードの動作確認にこのファイルを使ってはいけない。
# worktree で `docker compose up` を打つと、ホスト名 bookq を要求する
# 2 つ目の tailnet ノードが立ち上がって本番と名前を争う。
# 開発には ./dev.sh（docker-compose.dev.yml）を使う。
services:
  # viewer-rs (#409, #503, #532): 唯一の本番バックエンド — 全 traffic が
  # ここを通る（tailscale serve → viewer-rs）。strangler proxy は #532 で
  # 撤去: 全 route が native 応答し、未知経路は 501・認証不能は 401 を
  # ローカルで返す。Python viewer / py-rollback profile は #503 で削除 —
  # rollback は git history からの再 build (docs/deployment.md 参照)。
  viewer-rs:
    build:
      context: .
      dockerfile: Dockerfile.viewer-rs
    container_name: bookq-prd-viewer-rs
    volumes:
      # read-write: /api/v1/library/* (upload/delete) writes here.
      # DOWNLOADS_HOST_DIR は rename 前の変数名 — 旧 .env が残っていても
      # 解決できるよう nested fallback (新名が優先)。
      - "${LIBRARY_HOST_DIR:-${DOWNLOADS_HOST_DIR:-./library}}:/app/library:rw"
      # folder-visibility SQLite — user-state volume に永続化。
      - user-state:/var/lib/bookq
      # thumb/sprite hit-path cache — 共有しないと native thumb は常に
      # container-local miss で proxy 落ちし、media rollout が空転する
      # (#206 gateway-contract CI と同じ構成)。
      - thumb-cache:/var/cache/bookq-thumbs
    environment:
      # #532: strangler proxy 撤去済み — upstream/gate env は存在しない。
      # 未知経路の着弾は 501 + path WARN、認証不能は 401 で fail-fast する。
      - LIBRARY_DIR=/app/library
      # rollback 互換: prebuilt 旧イメージは DOWNLOADS_DIR を読む —
      # この compose は deploy 対象の新旧どちらにも使われるため、同じ
      # マウントを旧変数名にも指させる (新バイナリは無視する)。
      - DOWNLOADS_DIR=/app/library
      - BOOKQ_STATE_DIR=/var/lib/bookq
      - BOOKQ_THUMB_CACHE_DIR=/var/cache/bookq-thumbs
      # session cookie 検証 + Bearer JWT 検証 + visibility owner HMAC。
      - SECRET_KEY=${SECRET_KEY}
      - BOOKQ_GIT_SHA=${GIT_SHA:-}
      # ADR 0004 member-drive の deployment kill switch。空/未設定は server 既定
      # (enabled)、off/false/0/no で無効。prd-image override は image 差替えだけ
      # なのでここで通常 deploy の env passthrough を用意する。
      - BOOKQ_PAIR_MEMBER_DRIVE=${BOOKQ_PAIR_MEMBER_DRIVE:-}
      # OAuth 一式 (#400): /auth/* + /api/v1/auth/token に必須。未設定の
      # ままでは surface は 501 を返す（起動時 WARN）。
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
    # イメージは distroless (#573): shell も curl/wget も無いので、
    # ヘルスチェックはバイナリ自身の `--healthcheck` が loopback で
    # /api/v1/health を叩く（200 → exit 0）。
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/viewer-rs
        - --healthcheck
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  tailscale:
    build: ./tailscale
    container_name: bookq-prd-tailscaleGateway
    hostname: bookq
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=bookq
      # 既定 → viewer-rs。空文字 = serve を外部管理（entrypoint の escape hatch）。
      - TS_SERVE_TARGET=${TS_SERVE_TARGET-http://viewer-rs:8080}
      # 1 で serve を funnel (public internet 公開) に切替 (#353)。
      # tailnet policy の nodeAttrs `funnel` 許可が前提。未設定 = tailnet 内
      # のみ（従来どおり）。
      - TS_FUNNEL=${TS_FUNNEL:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
    restart: unless-stopped
    depends_on:
      - viewer-rs

  # Cloudflare Tunnel (#349): 独自ドメイン公開用の opt-in ingress。
  # profile `public` でのみ起動 — CLOUDFLARE_TUNNEL_TOKEN が .env にある
  # とき rebuild.sh prd deploy が profile を有効化する。cloudflared が
  # 外向きに Cloudflare edge へ接続を張るだけなので、受信ポート開放も
  # グローバル IP も不要 (CGNAT でも動く)。公開 hostname → service
  # (http://viewer-rs:8080) の対応は Cloudflare ダッシュボード側で管理する。
  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.11.1
    container_name: bookq-prd-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      viewer-rs:
        condition: service_healthy

volumes:
  tailscale-state:
  thumb-cache:
  user-state:
