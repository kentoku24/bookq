# bookq — 本番。既定の到達経路は tailscale サイドカー経由の HTTPS。
# 独自ドメイン公開時は opt-in の cloudflared (profile `public`) が
# 第 2 の到達経路になる (#349、docs/deployment.md「独自ドメイン公開」)。
#
# 未検証コードの動作確認にこのファイルを使ってはいけない。
# worktree で `docker compose up` を打つと、ホスト名 bookq を要求する
# 2 つ目の tailnet ノードが立ち上がって本番と名前を争う。
# 開発には ./dev.sh（docker-compose.dev.yml）を使う。
services:
  # viewer-rs (#409, #503): 唯一の本番バックエンド — 全 traffic がここを通る
  # （tailscale serve → viewer-rs）。upstream は設定しない (#408 の
  # upstream 不在モード): native 化されていない経路は 501、認証不能は
  # 401 をローカルで返す。Python viewer / py-rollback profile は #503 で
  # 削除 — rollback は git history からの再 build (docs/deployment.md 参照)。
  viewer-rs:
    build:
      context: .
      dockerfile: Dockerfile.viewer-rs
    container_name: bookq-prd-viewer-rs
    volumes:
      - "${DOWNLOADS_HOST_DIR:-./downloads}:/app/downloads:ro"
      # folder-visibility SQLite — user-state volume に永続化。
      - user-state:/var/lib/bookq
      # thumb/sprite hit-path cache — 共有しないと native thumb は常に
      # container-local miss で proxy 落ちし、media rollout が空転する
      # (#206 gateway-contract CI と同じ構成)。
      - thumb-cache:/var/cache/bookq-thumbs
    environment:
      # upstream 不在モード (#408): BOOKQ_UPSTREAM を渡さない。fallback
      # 着弾は 501 + path WARN、認証不能は 401 で fail-fast する。
      - DOWNLOADS_DIR=/app/downloads
      - BOOKQ_STATE_DIR=/var/lib/bookq
      - BOOKQ_THUMB_CACHE_DIR=/var/cache/bookq-thumbs
      # 全 native 面を列挙（`all` ではなく列挙 — 将来追加される native
      # route が未検証のまま自動有効化されるのを防ぐ）。`auth` も含む:
      # Python 不在では login/token を proxy する先が存在しないため、
      # cutover と同時に必須になる。OAuth 一式は下で配線済み。
      - BOOKQ_RS_NATIVE=${BOOKQ_RS_NATIVE:-health,version,image,images,tree,search,facets,visibility,positions,thumb,view,thumb-sprite,refresh,reader-sync,shell,static,auth}
      # 全 native + upstream 不在の起動時検証 (#408): 何か gate が抜けて
      # いたら起動を拒否する（501 を出すだけの半壊起動を防ぐ）。
      - BOOKQ_RS_NATIVE_STRICT=${BOOKQ_RS_NATIVE_STRICT:-1}
      # session cookie 検証 + Bearer JWT 検証 + visibility owner HMAC。
      - SECRET_KEY=${SECRET_KEY}
      - BOOKQ_GIT_SHA=${GIT_SHA:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      # `auth` gate (#400): /auth/* + /api/v1/auth/token の native 化に
      # 必要な OAuth 一式。未設定のまま auth を列挙に足しても surface は
      # 丸ごと proxy に留まる（STRICT 時は起動失敗）。
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - BASE_URL=${BASE_URL}
    # イメージは debian-slim + バイナリのみ (curl/wget/python なし) —
    # bash の /dev/tcp で /api/v1/health を叩く。upstream 不在でも health
    # gate は native 応答する（no-upstream でも standalone で healthy）。
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  tailscale:
    build: ./tailscale
    container_name: bookq-prd-tailscaleGateway
    hostname: bookq
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=bookq
      # 既定 → viewer-rs。空文字 = serve を外部管理（entrypoint の escape hatch）。
      - TS_SERVE_TARGET=${TS_SERVE_TARGET-http://viewer-rs:8080}
      # 1 で serve を funnel (public internet 公開) に切替 (#353)。
      # tailnet policy の nodeAttrs `funnel` 許可が前提。未設定 = tailnet 内
      # のみ（従来どおり）。
      - TS_FUNNEL=${TS_FUNNEL:-}
    volumes:
      - tailscale-state:/var/lib/tailscale
    restart: unless-stopped
    depends_on:
      - viewer-rs

  # Cloudflare Tunnel (#349): 独自ドメイン公開用の opt-in ingress。
  # profile `public` でのみ起動 — CLOUDFLARE_TUNNEL_TOKEN が .env にある
  # とき rebuild.sh prd deploy が profile を有効化する。cloudflared が
  # 外向きに Cloudflare edge へ接続を張るだけなので、受信ポート開放も
  # グローバル IP も不要 (CGNAT でも動く)。公開 hostname → service
  # (http://viewer-rs:8080) の対応は Cloudflare ダッシュボード側で管理する。
  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.10.4
    container_name: bookq-prd-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      viewer-rs:
        condition: service_healthy

volumes:
  tailscale-state:
  thumb-cache:
  user-state:
