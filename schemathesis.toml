# Schemathesis contract-test configuration.
# Loaded automatically when `schemathesis run` executes in this directory.

# The far-future `ts` guard on reading-position PUTs rejects schema-valid
# input with 400 — an intentional wrong-clock defense (see the comment in
# app/routes.py: a clamped ts would let a skewed device dominate LWW
# forever). The bound is relative to server time, which the static schema
# cannot express, so the rejection is allowed per-operation here instead.

[[operations]]
include-name = "PUT /api/reading-position"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx",
]

[[operations]]
include-name = "PUT /api/v1/reading-positions"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx",
]

# The v1 `folder` query param carries semantic constraints `type: string`
# can't express (non-empty, ≤2048 chars, no leading "/", no NUL bytes —
# app/routes.py::_validate_folder_param), so schema-valid-but-rejected
# input legitimately 400s.

[[operations]]
include-name = "GET /api/v1/reading-positions"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx",
]

[[operations]]
include-name = "DELETE /api/v1/reading-positions"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx",
]

# /image's `Range` header is declared with the `^bytes=` prefix pattern; the
# full Range grammar (and range validity vs. file size) can't be expressed in
# the schema, so a malformed-but-pattern-matching value legitimately 400s.

[[operations]]
include-name = "GET /image/{path}"
# 416 is reachable on schema-valid input: `bytes=N-` with N ≥ file size
# on a real fixture (path has an example the fuzzer can resolve).
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "416", "429", "5xx",
]
# 501 is a real answer here too (compressed multipart RAR entries,
# PDF pages without libpdfium) — same rationale as thumb/view below.
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "501"]

# Media paths reject shapes the `type: string` schema can't express
# (empty segments, trailing slashes, NUL bytes, unresolvable names).

[[operations]]
include-name = "GET /thumb/{path}"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx",
]

[[operations]]
include-name = "GET /view/{path}"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx",
]

# T03 (spec-first, #519): `visibility` on GET /api/v1/tree is contract-only
# until #522 implements it — the current server ignores the param, so a
# schema-violating value (e.g. `visibility=bogus`) is accepted with 200.
# Allow 2xx here; T05 removes this allowance when the server validates the
# enum (invalid value -> 422 per api/v1-semantics.md section 1).

[[operations]]
include-name = "GET /api/v1/tree"
checks.negative_data_rejection.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "405", "406", "409", "415", "422", "428", "429", "5xx",
]

# thumb-sprite's `folder`/`names` carry semantic constraints the schema can't
# express (folder must exist as dir or archive; names must yield ≥1 non-empty
# entry), so schema-valid-but-unusable input legitimately 400s.

[[operations]]
include-name = "GET /api/thumb-sprite"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx",
]

[[operations]]
include-name = "GET /api/v1/thumb-sprite"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx",
]

# library edit ops: `dir`/`name`/`path` carry semantic constraints the schema
# can't express (dir must exist as a real directory, name must sanitize, path
# must stay inside the library root and outside `.bookq-uploads`), so
# schema-valid-but-rejected input legitimately 4xxs. Uploads are disabled on
# read-only deployments → 503.

[[operations]]
include-name = "POST /api/v1/library/files"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "503", "5xx",
]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

[[operations]]
include-name = "DELETE /api/v1/library/files"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "503", "5xx",
]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

[[operations]]
include-name = "POST /api/v1/library/uploads"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "413", "415", "429", "503", "5xx",
]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

[[operations]]
include-name = "GET /api/v1/library/uploads/{id}"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "429", "503", "5xx",
]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

[[operations]]
include-name = "PUT /api/v1/library/uploads/{id}"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "413", "429", "503", "5xx",
]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

[[operations]]
include-name = "DELETE /api/v1/library/uploads/{id}"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "429", "503", "5xx",
]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

[[operations]]
include-name = "POST /api/v1/library/uploads/{id}/finalize"
checks.positive_data_acceptance.expected-statuses = [
  "2xx", "3xx", "400", "401", "403", "404", "409", "429", "503", "5xx",
]
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]

# `/thumb` and `/view` answer 501 by design when the source can't be decoded
# natively (non-image files, compressed multipart RAR sets, PDF without
# libpdfium — serve.rs "not_implemented"). The status is documented in the
# spec; allow it here since not_a_server_error flags every 5xx.

[[operations]]
include-name = "GET /thumb/{path}"
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "501"]

[[operations]]
include-name = "GET /view/{path}"
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "501"]
