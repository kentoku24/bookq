<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- installable as a standalone Home Screen web app so the runner can drive
     real Safari-vs-PWA surface combinations on the iOS Simulator (#86/S11). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="__FX_MANIFEST_URL__">
<link rel="apple-touch-icon" href="__FX_ICON_URL__">
<title>bookq reader-sync fixture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, sans-serif; background: #111; color: #eee; }
  #fx-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: #1c1c22; }
  #fx-bar button, #fx-bar input { min-height: 44px; min-width: 44px; font-size: 15px;
    border: 1px solid #444; border-radius: 8px; background: #2a2a33; color: #eee; padding: 4px 10px; }
  /* >=16px or iOS Safari auto-zooms on focus, which shifts the viewport and
   * swallows the next calibrated tap's click (sim_pair_via_taps). */
  #fx-code-input { width: 110px; font-size: 16px; }
  #fx-code { font-size: 22px; letter-spacing: 4px; align-self: center; padding: 0 8px; color: #ffd166; }
  #fx-info { display: flex; gap: 12px; padding: 4px 8px; font-size: 12px; color: #9ab; background: #16161c; }
  #fx-marker { flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6);
    min-height: 50vh; position: relative; }
  #fx-wrap { display: flex; flex-direction: column; height: 100%; }
  #fx-status { font-size: 12px; padding: 3px 8px; color: #8f8; background: #101016; }
  #fx-imgbox { position: absolute; top: 6px; left: 6px; display: flex; align-items: center;
    gap: 6px; background: rgba(0,0,0,.55); padding: 4px; border-radius: 6px; }
  #fx-img { width: 56px; height: 56px; object-fit: contain; background: #222; }
  #fx-img-badge { font-size: 10px; color: #ddd; }
</style>
</head>
<body>
<div id="fx-wrap">
  <div id="fx-bar">
    <button id="fx-create" aria-label="fx-create">開始</button>
    <input id="fx-code-input" aria-label="fx-code-input" inputmode="numeric"
           maxlength="6" placeholder="code">
    <button id="fx-join" aria-label="fx-join">参加</button>
    <button id="fx-approve" aria-label="fx-approve">承認</button>
    <button id="fx-prev" aria-label="fx-prev">◀ 前</button>
    <button id="fx-next" aria-label="fx-next">次 ▶</button>
    <button id="fx-swap" aria-label="fx-swap">左右交換</button>
    <button id="fx-dc" aria-label="fx-dc">DC</button>
    <button id="fx-leave" aria-label="fx-leave">解除</button>
    <div id="fx-code">------</div>
  </div>
  <div id="fx-info">
    <span>role=<b id="fx-role">?</b></span>
    <span>side=<b id="fx-side">-</b></span>
    <span>spread=<b id="fx-spread">-</b></span>
    <span>rev=<b id="fx-rev">-</b></span>
    <span>plane=<b id="fx-transport">-</b></span>
    <span>srv=<b id="fx-srv">-</b></span>
  </div>
  <div id="fx-marker" data-page="" data-side="" data-img-state="">
    —
    <div id="fx-imgbox"><img id="fx-img" alt=""><span id="fx-img-badge">-</span></div>
  </div>
  <div id="fx-status">boot</div>
</div>

<script>
/* reader-sync two-client verification FIXTURE (#85/S10 → #86/S11).
 *
 * A runner-controlled client that drives the REAL production client:
 * app/static/viewer/pairTransport.js + pairModel.js + pairClient.js are
 * loaded from the target origin and every pair / move / resume / transport
 * operation goes through the real wire path (CREATE/JOIN/APPROVE/READY/
 * TURN/GOTO/SET_OFFSET/SWAP_SIDES/OPEN_WORK/APPLIED/SET_ACTIVITY/RESUME/
 * LEAVE + SIGNAL/TRANSPORT_STATE). Committed STATE frames are rendered as
 * deterministic color markers derived from the assigned PageRef, and the
 * assigned page image is fetched+decoded through the real /image/ route so
 * "正しい左右画像を表示" is asserted on DOM marker AND pixel AND decode.
 *
 * The transport factory handed to pairClient is fixture-wrapped, which is
 * what gives the runner deterministic fault injection on the real wire
 * path: outbound drop/dup/delay/base-rewrite, inbound drop/corrupt/inject,
 * ICE suppression at the captured RTCPeerConnection, and link close for
 * disconnect/resume. The page stays dumb about orchestration: commands
 * arrive over the long-poll control channel; pairing codes and resume
 * tokens are NEVER reported back to the runner.
 */
'use strict';
var FXC = __FX_CONFIG_JSON__;   // {id, role, wsUrl, ctrlBase, imgBase, mods[], manifestUrl, iconUrl}
(function () {

var TRACE_CAP = 400;
var SEQUENCED = {TURN: 1, GOTO: 1, SET_OFFSET: 1, SWAP_SIDES: 1,
                 OPEN_WORK: 1, READY: 1, APPLIED: 1};
var S = {
  client: null,
  rawT: null,                 // current raw ws transport (disconnect/inject)
  rawGen: 0,
  lastSnap: null,             // last committed STATE applied via applyState
  manifest: null,             // last manifest object handed to applyState
  applyCount: 0,
  applyLog: [],               // {rev, spreadId, t}
  events: [],                 // recent event names from onEvent
  eventLog: [],               // {t, type, data}
  sentTypes: [],              // outbound frame types (ordered, capped)
  seqSent: 0,                 // outbound sequenced op frames
  rejected: [],               // inbound REJECT reasons
  lastError: null,            // sticky: last 'error' event reason — the live
                            // client error clears on the next applied STATE,
                            // which races any runner-side poll
  ackWait: {},                // requestId -> {res,t0}
  faults: {wsDelay: 0, wsDup: false, wsDrop: false, sigDelay: 0,
           suppressIce: false, staleBase: 0, dupNext: false,
           inDropType: null, inDropCount: 0,
           inCorruptType: null, inCorruptCount: 0, inInject: []},
  imgFault: {mode: 'ok', ms: 0},
  imgState: 'none',           // none|blank|loading|ok|error|faulted
  imgRev: null,               // committed revision the latest image
                              // transition belongs to (displayed-event
                              // staleness guard, S12/#87)
  visLog: [],
  evHandlers: {},
  lastTap: null,
  lastGesture: null,
  trace: [],
  latWait: null,
  pcCap: null,
  dcCap: null,
  bootResumeTried: false,
};

function status(msg) { document.getElementById('fx-status').textContent = msg; }
function trace(dir, ch, type, x) {
  S.trace.push({t: Date.now(), dir: dir, ch: ch, type: type, x: x || {}});
  if (S.trace.length > TRACE_CAP) S.trace.shift();
}

/* marker palette — MUST match verify_core.marker_rgb / BLANK_RGB */
function fnv1a(t) {
  var bytes = unescape(encodeURIComponent(t)), h = 0x811C9DC5 >>> 0;
  for (var i = 0; i < bytes.length; i++) {
    /* Math.imul: the naive * overflows float53 before >>>0 and diverges
     * from verify_core.marker_rgb. */
    h = Math.imul(h ^ bytes.charCodeAt(i), 0x01000193) >>> 0;
  }
  return h;
}
function hls2rgb(h, l, s) {                      // colorsys.hls_to_rgb
  if (s === 0) return [l, l, l];
  var m2 = l <= 0.5 ? l * (1 + s) : l + s - l * s;
  var m1 = 2 * l - m2;
  function hue(hh) {
    hh = hh % 1; if (hh < 0) hh += 1;
    if (hh * 6 < 1) return m1 + (m2 - m1) * hh * 6;
    if (hh * 2 < 1) return m2;
    if (hh * 3 < 2) return m1 + (m2 - m1) * (2 / 3 - hh) * 6;
    return m1;
  }
  return [hue(h + 1 / 3), hue(h), hue(h - 1 / 3)];
}
function markerColor(name) {
  var c = hls2rgb((fnv1a(name) % 360) / 360, 0.55, 0.68);
  return [Math.round(c[0] * 255), Math.round(c[1] * 255), Math.round(c[2] * 255)];
}

function encodePath(p) {
  return p.split('/').map(encodeURIComponent).join('/');
}
function imgUrlFor(ref) {
  return FXC.imgBase + '/' + encodePath(ref.folder + '/' + ref.name);
}

/* ── transport wrapper (fault injection on the REAL wire path) ── */
function logSent(f) {
  S.sentTypes.push(f.type);
  if (S.sentTypes.length > 240) S.sentTypes.shift();
  if (SEQUENCED[f.type]) S.seqSent++;
}
function fxSend(t, f) {
  var fl = S.faults;
  logSent(f);
  trace('out', 'ws', f.type, {});
  if (fl.wsDrop && f.type !== 'PING' && f.type !== 'PONG') {
    trace('note', 'ws', 'DROP:' + f.type, {});
    return true;
  }
  if (fl.staleBase && typeof f.baseRevision === 'number') {
    /* baseRevision is TOP-LEVEL on the wire frame — optimistic concurrency
     * lives outside the payload. Rewriting it backwards manufactures a
     * stale_revision reject for exactly one request. */
    f = {v: f.v, type: f.type, requestId: f.requestId,
         sessionId: f.sessionId, workEpoch: f.workEpoch,
         baseRevision: Math.max(0, f.baseRevision - fl.staleBase),
         payload: f.payload};
    fl.staleBase = 0;                 // one-shot
  }
  var delay = fl.wsDelay || (f.type === 'SIGNAL' ? fl.sigDelay : 0);
  var dup = fl.wsDup && f.type !== 'PING' && f.type !== 'PONG';
  var dupNext = fl.dupNext && f.requestId && SEQUENCED[f.type];
  if (dupNext) fl.dupNext = false;
  var doSend = function () {
    try { t.send(f); } catch (e) { return false; }
    if (dup || dupNext) { try { t.send(f); } catch (e) {} }
    return true;
  };
  if (delay) { setTimeout(doSend, delay); return true; }
  return doSend();
}
function inboundApply(f) {
  var fl = S.faults, out = [];
  if (fl.inDropType && f.type === fl.inDropType && fl.inDropCount > 0) {
    fl.inDropCount--;
    trace('note', 'in', 'DROP:' + f.type, {});
  } else {
    if (fl.inCorruptType && f.type === fl.inCorruptType &&
        fl.inCorruptCount > 0) {
      fl.inCorruptCount--;
      f = corruptFrame(f);
      trace('note', 'in', 'CORRUPT:' + f.type, {});
    }
    if (f.type === 'ACK' || f.type === 'REJECT') {
      var w = S.ackWait[f.requestId];
      if (w) {
        delete S.ackWait[f.requestId];
        w.res(f);
      }
      if (f.type === 'REJECT' && f.reason) S.rejected.push(f.reason);
    }
    out.push(f);
  }
  if (fl.inInject && fl.inInject.length) {
    var extra = fl.inInject;
    fl.inInject = [];
    for (var i = 0; i < extra.length; i++) {
      trace('note', 'in', 'INJECT:' + extra[i].type, {});
      out.push(extra[i]);
    }
  }
  return out;
}
function corruptFrame(f) {
  /* Flip bytes inside a MANIFEST chunk's data so the client-side digest
   * verification fails — the pairClient manifest_error path, for real. */
  var c = JSON.parse(JSON.stringify(f));
  if (typeof c.data === 'string' && c.data.length) {
    var ch = c.data.charCodeAt(0);
    c.data = String.fromCharCode(ch === 65 ? 66 : 65) + c.data.slice(1);
  }
  return c;
}
function fxTransportFactory(url) {
  var t = PairTransport.createWebSocketTransport(url);
  var gen = ++S.rawGen;
  var wrapped = {url: url, onopen: null, onclose: null};
  var onframeFn = null;
  Object.defineProperty(wrapped, 'onframe', {
    get: function () { return onframeFn; },
    set: function (f) { onframeFn = f; },
  });
  t.onopen = function () { if (wrapped.onopen) wrapped.onopen(); };
  t.onclose = function () { if (wrapped.onclose) wrapped.onclose(); };
  t.onframe = function (f) {
    if (gen !== S.rawGen) return;
    var frames = inboundApply(f);
    for (var i = 0; i < frames.length; i++) {
      trace('in', 'ws', frames[i].type, {});
      if (onframeFn) onframeFn(frames[i]);
    }
  };
  wrapped.send = function (f) { return fxSend(t, f); };
  wrapped.close = function () { return t.close(); };
  S.rawT = t;
  return wrapped;
}

/* ── captured pc/dc for webrtc-dc control (real RTC, runner-visible) ── */
function fxPcFactory() {
  var pc = new RTCPeerConnection({iceServers: []});
  S.pcCap = pc;
  var origCreate = pc.createDataChannel.bind(pc);
  pc.createDataChannel = function (label, o) {
    var dc = origCreate(label, o);
    S.dcCap = dc;
    return dc;
  };
  /* Intercept event-handler assignment WITHOUT shadowing the WebIDL
   * attribute: an own-property defineProperty replaces the registration
   * path entirely, so a naive wrapper means the browser never fires the
   * event. Route the WRAPPED handler through the prototype's real setter
   * so the browser registers it at the IDL level. */
  var proto = Object.getPrototypeOf(pc);
  function wrapHandler(name, wrap) {
    var desc = null, p = pc;
    while (p && !desc) {
      desc = Object.getOwnPropertyDescriptor(p, name);
      p = Object.getPrototypeOf(p);
    }
    if (!desc || typeof desc.set !== 'function') return false;
    Object.defineProperty(pc, name, {
      configurable: true,
      get: function () { return desc.get.call(pc); },
      set: function (fn) { desc.set.call(pc, wrap(fn)); },
    });
    return true;
  }
  wrapHandler('ondatachannel', function (fn) {
    return function (ev) { S.dcCap = ev.channel; return fn(ev); };
  });
  wrapHandler('onicecandidate', function (fn) {
    return function (ev) {
      if (S.faults.suppressIce && ev.candidate) {
        trace('note', 'dc', 'ICE-SUPPRESSED', {});
        return;
      }
      return fn(ev);
    };
  });
  return pc;
}

/* ── synthetic lifecycle injection (bfcache/lock/background) ──
 * The fixture hands pairClient an events target that forwards REAL window
 * events AND lets the runner inject semantic lifecycle transitions on
 * demand — deterministic 'pagehide'/'pageshow' without browser support. */
var realEv = null;
var fxEvents = {
  addEventListener: function (t, f) {
    S.evHandlers[t] = f;
    if (realEv) realEv.addEventListener(t, f);
  },
  removeEventListener: function (t, f) {
    if (S.evHandlers[t] === f) delete S.evHandlers[t];
    if (realEv) realEv.removeEventListener(t, f);
  },
};
function fireLifecycle(type) {
  S.visLog.push({t: Date.now(), type: type});
  trace('note', 'fx', 'lifecycle:' + type, {});
  var fn = S.evHandlers[type];
  if (fn) fn();
  return {fired: type, had: !!fn};
}

/* ── client lifecycle ── */
function ensureClient() {
  if (S.client) return S.client;
  realEv = PairClient.domEventTarget
    ? PairClient.domEventTarget(window, document) : null;
  S.client = PairClient.createClient({
    url: FXC.wsUrl,
    PairTransport: PairTransport,
    transportFactory: fxTransportFactory,
    applyState: fxApplyState,
    onEvent: fxOnEvent,
    storage: window.sessionStorage,
    events: fxEvents,
  });
  return S.client;
}
/* A scenario ends with the client terminal (ended/error). The next
 * scenario's pair must start from a virgin client + clean counters —
 * faults, manifests, apply logs and wire counters all reset here. */
function _freshSession() {
  var st = clientState();
  var dead = !S.client || st.status === 'ended' || st.status === 'error' ||
             !!st.endReason;
  if (!dead) return;
  if (S.client && S.client.destroy) { try { S.client.destroy(); } catch (e) {} }
  S.client = null;
  S.rawT = null;
  S.lastSnap = null;
  S.manifest = null;
  S.applyCount = 0;
  S.applyLog = [];
  S.events = [];
  S.sentTypes = [];
  S.seqSent = 0;
  S.rejected = [];
  S.lastError = null;
  S.ackWait = {};
  S.lastTap = null;
  S.lastGesture = null;
  S.dcCap = null;
  S.pcCap = null;
  S.imgState = 'none';
  S.imgRev = null;
  S.imgFault = {mode: 'ok', ms: 0};
  S.faults = {wsDelay: 0, wsDup: false, wsDrop: false, sigDelay: 0,
              suppressIce: false, staleBase: 0, dupNext: false,
              inDropType: null, inDropCount: 0,
              inCorruptType: null, inCorruptCount: 0, inInject: []};
  if (S.latWait) { S.latWait = null; clearTimeout(S.latTimer); }
}
function fxOnEvent(e) {
  if (e.type === 'error') S.lastError = e.reason || 'error';
  S.events.push(e.type);
  if (S.events.length > 60) S.events.shift();
  S.eventLog.push({t: Date.now(), type: e.type});
  if (S.eventLog.length > 200) S.eventLog.shift();
  trace('note', 'fx', 'event:' + e.type, {});
}
function clientState() {
  return S.client ? S.client.state
                  : {status: 'disconnected', role: null, sessionId: null};
}

/* committed STATE → this member's assigned PageRef → marker + real image */
function fxApplyState(snap, manifest, opts) {
  if (manifest) S.manifest = manifest;
  S.lastSnap = snap;
  S.applyCount++;
  S.applyLog.push({rev: snap.revision, spreadId: snap.spreadId,
                   t: Date.now()});
  if (S.applyLog.length > 120) S.applyLog.shift();
  render();
  if (S.latWait && snap.revision > S.latWait.rev0) {
    var w = S.latWait; S.latWait = null;
    clearTimeout(S.latTimer);
    w.res(performance.now() - w.t0);
  }
}
function ownProjection() {
  var st = clientState();
  if (!S.manifest || !S.lastSnap || !S.lastSnap.spreadId || !st.role) {
    return null;
  }
  var table = S.manifest.spreadTable || [];
  for (var i = 0; i < table.length; i++) {
    if (table[i].id === S.lastSnap.spreadId) {
      return {index: i, spread: table[i],
              proj: PairModel.projectSpread(
                table[i], st.role, S.lastSnap.leaderSide || 'left')};
    }
  }
  return null;
}
/* terminal display states a peer-side "the new committed spread is on
 * glass" signal may be derived from — 'loading' is transient, 'none' is
 * a non-display. S12 peer_latency keys on this (#87). */
var IMG_TERMINAL = {ok: 1, blank: 1, error: 1, faulted: 1};

function setImg(state, url) {
  /* the committed apply this transition belongs to — captured at EVERY
   * transition start so a superseded apply's late onload/onerror can
   * neither corrupt the current display nor emit a false displayed
   * event (the handler compares against its own load's revision). */
  S.imgRev = S.lastSnap ? S.lastSnap.revision : null;
  var img = document.getElementById('fx-img');
  var badge = document.getElementById('fx-img-badge');
  if (url) {
    if (img.__fxUrl === url) {
      /* identical src — re-assigning src RE-FIRES onload on Chrome
       * (verified), which would loop setImg('ok',url) -> src=url ->
       * onload -> … forever and flood /ctrl/event (the loop existed
       * silently before; the event post makes it fatal). If the image
       * already decoded, the true terminal state is 'ok'. */
      if (img.complete && img.naturalWidth > 0) state = 'ok';
    } else {
      /* staleness guard by URL, not revision: a superseded apply's load
       * may only be applied while its URL is still the element's wanted
       * one — a newer apply re-marking 'loading' for the SAME URL must
       * not veto this load's completion (nothing else would resolve it,
       * and the current apply IS displaying this very image). */
      var loadUrl = url;
      img.onerror = function () {
        if (img.__fxUrl === loadUrl) setImg('error', null);
      };
      img.onload = function () {
        if (img.__fxUrl === loadUrl) setImg('ok', url);
      };
      img.__fxUrl = url;
      img.src = url;
    }
  } else {
    img.__fxUrl = null;
    img.removeAttribute('src');
  }
  S.imgState = state;
  badge.textContent = state;
  document.getElementById('fx-marker')
    .setAttribute('data-img-state', state);
  /* terminal display transition for the CURRENT apply -> runner event.
   * The peer_latency op's single-clock sample ends here: intent-send on
   * the actor -> wire -> this device's apply+decode -> this POST.
   * Fire-and-forget: a dropped event post must not spam pageerror. */
  if (IMG_TERMINAL[state] && S.imgRev !== null) {
    post('/event', {id: FXC.id, type: 'displayed', rev: S.imgRev,
                    imgState: state, at: performance.now()})
      .catch(function () {});
  }
}
function renderMarker() {
  var m = document.getElementById('fx-marker');
  var st = clientState();
  var p = ownProjection();
  if (st.error || st.endReason || st.status === 'error' ||
      st.status === 'ended') {
    m.style.background = 'rgb(70,22,26)';
    m.firstChild.textContent = st.error ? 'ERR' : 'END';
    m.setAttribute('data-page', '');
    m.setAttribute('data-side', '');
    setImg('none', null);
    return;
  }
  if (!p || !p.proj) {
    var loading = (st.phase === 'loading' || st.phase === 'reconnecting' ||
                   st.status === 'connecting' || st.status === 'reconnecting');
    m.style.background = 'rgb(51,51,58)';
    m.firstChild.textContent = loading ? '…' : '—';
    m.setAttribute('data-page', '');
    m.setAttribute('data-side', '');
    if (!loading) setImg('none', null);
    return;
  }
  var ref = p.proj.ref;
  m.setAttribute('data-side', p.proj.side);
  if (ref) {
    var rgb = markerColor(ref.name);
    m.style.background = 'rgb(' + rgb.join(',') + ')';
    m.firstChild.textContent = ref.name;
    m.setAttribute('data-page', ref.name);
    var mode = S.imgFault.mode;
    if (mode === '404') {
      setImg('loading', imgUrlFor({folder: ref.folder,
                                 name: 'fx-missing-page.png'}));
    } else if (mode === 'delay') {
      setImg('loading', null);
      var url = imgUrlFor(ref);
      setTimeout(function () { setImg('loading', url); },
                 S.imgFault.ms || 1500);
    } else if (mode === 'off') {
      setImg('loading', null);
    } else {
      setImg('loading', imgUrlFor(ref));
    }
  } else {
    m.style.background = 'rgb(34,34,44)';
    m.firstChild.textContent = 'BLANK';
    m.setAttribute('data-page', 'BLANK');
    setImg('blank', null);
  }
}
function render() {
  var st = clientState();
  document.getElementById('fx-role').textContent = st.role || FXC.role;
  document.getElementById('fx-side').textContent =
    document.getElementById('fx-marker').getAttribute('data-side') || '-';
  document.getElementById('fx-spread').textContent =
    (S.lastSnap && S.lastSnap.spreadId) || '-';
  document.getElementById('fx-rev').textContent =
    S.lastSnap ? String(S.lastSnap.revision) : '-';
  document.getElementById('fx-transport').textContent = st.transport || '-';
  document.getElementById('fx-srv').textContent =
    st.phase || st.status || '-';
  var code = st.code;
  if (code) document.getElementById('fx-code').textContent = code;
  renderMarker();
}
function marker() {
  var m = document.getElementById('fx-marker');
  return {page: m.getAttribute('data-page'), side: m.getAttribute('data-side'),
          text: m.firstChild ? m.firstChild.textContent : m.textContent,
          bg: m.style.background || '',
          imgState: m.getAttribute('data-img-state') || S.imgState};
}
function manifestSummary() {
  if (!S.manifest) return null;
  /* page names repeat across chapters (manga folder-per-chapter trees),
   * so every entry also carries its pageRefs INDEX — the runner can
   * address a page unambiguously without the folder name ever leaving
   * the client. */
  var refs = S.manifest.pageRefs || [];
  var idxOf = function (ref) {
    if (!ref) return -1;
    for (var i = 0; i < refs.length; i++) {
      if (refs[i].name === ref.name && refs[i].folder === ref.folder) {
        return i;
      }
    }
    return -1;
  };
  var spreads = (S.manifest.spreadTable || []).map(function (s) {
    return {id: s.id, r: s.right ? s.right.name : null,
            l: s.left ? s.left.name : null,
            ri: idxOf(s.right), li: idxOf(s.left)};
  });
  return {folder: 'sha256:redacted', offset: S.manifest.offset,
          version: S.manifest.manifestVersion || null,
          chapters: (S.manifest.chapters || []).length,
          pages: refs.length,
          spreads: spreads};
}
function pageByName(name, chapter) {
  var refs = (S.manifest && S.manifest.pageRefs) || [];
  for (var i = 0; i < refs.length; i++) {
    if (refs[i].name === name &&
        (!chapter || refs[i].folder === chapter)) {
      return {folder: refs[i].folder, name: refs[i].name};
    }
  }
  return null;
}

/* ── wire helpers outside the client (probes + rtt) ── */
function rawSendAndWaitAck(frame, timeoutMs) {
  return new Promise(function (res, rej) {
    S.ackWait[frame.requestId] = {res: res, t0: performance.now()};
    if (!S.rawT) { delete S.ackWait[frame.requestId]; rej(new Error('no-link')); return; }
    try { S.rawT.send(frame); } catch (e) {
      delete S.ackWait[frame.requestId];
      rej(new Error('send-fail:' + e));
      return;
    }
    setTimeout(function () {
      if (S.ackWait[frame.requestId]) {
        delete S.ackWait[frame.requestId];
        rej(new Error('ack-timeout:' + frame.type));
      }
    }, timeoutMs || 9000);
  });
}
function probeWs() {
  return new Promise(function (res, rej) {
    var t = PairTransport.createWebSocketTransport(FXC.wsUrl);
    var to = setTimeout(function () { try { t.close(); } catch (e) {}
                                    rej(new Error('probe-timeout')); }, 8000);
    t.onopen = function () {};
    t.onclose = function () {};
    t.onframe = function (f) {
      if (f.type === 'HELLO') { clearTimeout(to); res(t); }
      if (f.type === 'PING') { try { t.send({v: 1, type: 'PONG', seq: f.seq}); } catch (e) {} }
    };
  });
}

/* ── latency probe: intent send → committed STATE applied ── */
function latencyProbe(p) {
  var n = p.samples || 8, out = [], delta = 1;
  return new Promise(function (res, rej) {
    var step = function () {
      if (out.length >= n) return res({samples: out});
      var st = clientState();
      if (st.phase !== 'reading') return rej(new Error('latency: not reading'));
      var rev0 = st.revision;
      var t0 = performance.now();
      var ok = S.client.sendIntent({type: 'turn', delta: delta,
                                    crossChapter: true, fromChapter: null});
      if (!ok) return rej(new Error('latency: sendIntent refused'));
      delta = -delta;
      S.latWait = {rev0: rev0, t0: t0, res: function (t1) {
        out.push(t1 - t0);
        S.latWait = null;
        setTimeout(step, 40);
      }};
      S.latTimer = setTimeout(function () {
        if (S.latWait) { S.latWait = null; rej(new Error('latency-timeout')); }
      }, 9000);
    };
    step();
  });
}

/* ── commands (runner -> fixture) ── */
var CMD = {
  connect: function () { ensureClient(); return Promise.resolve({open: true}); },
  create: function () {
    _freshSession();
    var c = ensureClient();
    return c.create().then(function () {
      render();
      return {code: c.state.code, role: c.state.role};
    });
  },
  join: function (p) {
    _freshSession();
    var c = ensureClient();
    return c.join(p.code).then(function () {
      render();
      return {role: c.state.role};
    });
  },
  approve: function () {
    return ensureClient().approve().then(function () { return {approved: true}; });
  },
  leave: function () {
    if (!S.client) return Promise.resolve({left: true});
    return S.client.leave().then(function () {
      render();
      return {left: true};
    });
  },
  code: function () { return Promise.resolve({code: clientState().code}); },
  state: function () {
    var st = clientState();
    var pres = {};
    for (var k in (st.presence || {})) {
      pres[k] = {role: st.presence[k].role, status: st.presence[k].status,
                 ready: !!st.presence[k].ready};
    }
    var p = ownProjection();
    return Promise.resolve({
      status: st.status, phase: st.phase,
      sessionId: st.sessionId, role: st.role, memberId: st.memberId,
      side: st.side, transport: st.transport,
      spreadId: st.spreadId, revision: st.revision,
      workEpoch: st.workEpoch, manifestVersion: st.manifestVersion,
      presence: pres, pending: !!st.joinRequest,
      error: st.error || null, endReason: st.endReason || null,
      lastError: S.lastError,
      applied: {index: p ? p.index : -1,
                spreadId: (p && p.spread.id) || null,
                leaderSide: S.lastSnap ? S.lastSnap.leaderSide : null,
                revision: S.lastSnap ? S.lastSnap.revision : 0},
      marker: marker(),
      manifest: manifestSummary(),
      applyCount: S.applyCount,
      applyLog: S.applyLog.slice(-20),
      sentTypes: S.sentTypes.slice(-40),
      seqSent: S.seqSent,
      rejected: S.rejected.slice(-20),
      events: S.events.slice(-20),
      dcOpen: !!(S.dcCap && S.dcCap.readyState === 'open'),
      visLog: S.visLog.slice(-10),
      hasRTC: typeof RTCPeerConnection !== 'undefined',
      standalone: navigator.standalone === true ||
        (window.matchMedia &&
         window.matchMedia('(display-mode: standalone)').matches),
      lastGesture: S.lastGesture,
    });
  },
  open_work: function (p) {
    var c = ensureClient();
    var intent = {type: 'openWork', folder: p.folder};
    if (p.page) intent.page = p.page;
    if (p.offset !== undefined && p.offset !== null) intent.offset = p.offset;
    var ok = c.sendIntent(intent);
    /* a local gate (phase/role/link) is an OBSERVABLE refusal, not a
     * fixture error — the runner asserts on it either way. */
    return Promise.resolve({sent: !!ok});
  },
  turn: function (p) {
    var ok = ensureClient().sendIntent({
      type: 'turn', delta: p.delta,
      crossChapter: p.crossChapter !== false,
      fromChapter: p.fromChapter || null,
    });
    return Promise.resolve({sent: !!ok});
  },
  goto: function (p) {
    var ref = p.page;
    if (typeof p.pageIndex === 'number') {
      /* exact-addressing path: pageRefs index — immune to the
       * duplicate-page-name ambiguity pageByName can't resolve. */
      ref = (S.manifest && S.manifest.pageRefs || [])[p.pageIndex] || null;
      if (ref) ref = {folder: ref.folder, name: ref.name};
    } else if (typeof ref === 'string') {
      ref = pageByName(ref, p.chapter);
    }
    if (!ref) return Promise.reject(new Error('goto: unknown page'));
    var ok = ensureClient().sendIntent({type: 'goto', page: ref});
    return Promise.resolve({sent: !!ok});
  },
  swap: function () {
    var ok = ensureClient().swapSides();
    return Promise.resolve({sent: !!ok});
  },
  set_offset: function (p) {
    var ok = ensureClient().sendIntent({type: 'setOffset', offset: p.offset});
    return Promise.resolve({sent: !!ok});
  },
  /* client→server wire RTT via a raw SET_ACTIVITY on the member link */
  rtt: function (p) {
    var n = p.samples || 5, out = [], i = 0;
    return new Promise(function (res, rej) {
      var step = function () {
        if (i >= n) return res({samples: out});
        i++;
        var st = clientState();
        var frame = {v: 1, type: 'SET_ACTIVITY',
                     requestId: 'fx-rtt-' + FXC.id + '-' + i + '-' + Date.now(),
                     sessionId: st.sessionId,
                     workEpoch: st.workEpoch || 0,
                     baseRevision: st.revision || 0,
                     payload: {state: 'active'}};
        var t0 = performance.now();
        S.ackWait[frame.requestId] = {res: function () {
          out.push(performance.now() - t0);
          setTimeout(step, 30);
        }};
        if (!S.rawT) return rej(new Error('rtt: no-link'));
        try { S.rawT.send(frame); } catch (e) { return rej(new Error('rtt:' + e)); }
        setTimeout(function () {
          if (S.ackWait[frame.requestId]) {
            delete S.ackWait[frame.requestId];
            rej(new Error('rtt-timeout'));
          }
        }, 9000);
      };
      step();
    });
  },
  latency: function (p) { return latencyProbe(p); },
  dc_open: function () {
    var c = ensureClient();
    var ok = c.enableWebRTC({pcFactory: fxPcFactory});
    return Promise.resolve({enabled: ok});
  },
  dc_close: function () {
    if (S.dcCap) { try { S.dcCap.close(); } catch (e) {} }
    return Promise.resolve({closed: true});
  },
  dc_restart: function () {
    var ok = ensureClient().restartDataChannel();
    return Promise.resolve({restarted: ok});
  },
  ctl_plane: function () { return Promise.resolve({plane: 'real'}); },
  disconnect: function () {
    if (S.rawT) { try { S.rawT.close(); } catch (e) {} }
    return Promise.resolve({closed: true});
  },
  resume: function () {
    var c = ensureClient();
    return c.resume().then(function () { return {resumed: true}; });
  },
  /* bad RESUME probed on a SECOND anonymous link — the member's own link
   * and client stay untouched so a real resume can still be asserted. */
  resume_bad: function (p) {
    var st = clientState();
    var mId = p.memberId || st.memberId;
    var sId = p.sessionId || st.sessionId;
    if (!mId || !sId) return Promise.reject(new Error('resume_bad: no member'));
    return probeWs().then(function (t) {
      return new Promise(function (res, rej) {
        var to = setTimeout(function () {
          try { t.close(); } catch (e) {}
          rej(new Error('resume_bad-timeout'));
        }, 8000);
        t.onframe = function (f) {
          if (f.type === 'PING') { try { t.send({v: 1, type: 'PONG', seq: f.seq}); } catch (e) {} }
          if (f.type === 'ACK' || f.type === 'REJECT') {
            clearTimeout(to);
            try { t.close(); } catch (e) {}
            res({type: f.type, reason: f.reason || null});
          }
        };
        t.send({v: 1, type: 'RESUME',
                requestId: 'fx-bad-' + Date.now(),
                sessionId: sId,
                workEpoch: st.workEpoch || 0,
                baseRevision: st.revision || 0,
                payload: {memberId: mId, resumeToken: p.token || 'fx-bad-token'}});
      });
    });
  },
  fault: function (p) {
    var f = S.faults;
    if (p.type === 'ws_delay') f.wsDelay = p.ms || 0;
    else if (p.type === 'ws_dup') f.wsDup = true;
    else if (p.type === 'ws_drop') f.wsDrop = true;
    else if (p.type === 'sig_delay') f.sigDelay = p.ms || 0;
    else if (p.type === 'suppress_ice') f.suppressIce = true;
    else if (p.type === 'stale_base') f.staleBase = p.sub || 1;
    else if (p.type === 'dup_next') f.dupNext = true;
    else if (p.type === 'in_drop') { f.inDropType = p.frame; f.inDropCount = p.count || 1; }
    else if (p.type === 'in_corrupt') { f.inCorruptType = p.frame; f.inCorruptCount = p.count || 1; }
    else if (p.type === 'in_inject') { f.inInject = (p.frames || []).slice(); }
    else if (p.type === 'clear') {
      S.faults = {wsDelay: 0, wsDup: false, wsDrop: false, sigDelay: 0,
                  suppressIce: false, staleBase: 0, dupNext: false,
                  inDropType: null, inDropCount: 0,
                  inCorruptType: null, inCorruptCount: 0, inInject: []};
    }
    return Promise.resolve({faults: true});
  },
  set_activity: function (p) {
    var ok = ensureClient().setActivity(p.state);
    return Promise.resolve({sent: ok});
  },
  lifecycle: function (p) { return Promise.resolve(fireLifecycle(p.type)); },
  reload_page: function () {
    /* result posts first, then a REAL navigation inside the same
     * browsing context (Safari tab or installed web clip) — the runner
     * waits on the post-reload hello (hello_seq+1), not on this return.
     * How the real-device driver reloads without any device automation. */
    setTimeout(function () { window.location.reload(); }, 400);
    return Promise.resolve({reloading: true});
  },
  img_fault: function (p) {
    S.imgFault = {mode: p.mode || 'ok', ms: p.ms || 0};
    render();
    return Promise.resolve({imgFault: S.imgFault.mode});
  },
  last_tap: function () {
    return Promise.resolve({tap: S.lastTap || null,
                            gesture: S.lastGesture,
                            vw: window.innerWidth, vh: window.innerHeight});
  },
  rect: function (p) {
    var el = document.getElementById(p.id);
    if (!el) return Promise.reject(new Error('no element: ' + p.id));
    var r = el.getBoundingClientRect();
    return Promise.resolve({x: r.x, y: r.y, w: r.width, h: r.height});
  },
  value: function (p) {
    /* input-field value probe — the tap-pair flow verifies typed text
     * actually landed before tapping 参加 (a missed focus on iOS types
     * into nothing and the JOIN silently never leaves). */
    var el = document.getElementById(p.id);
    if (!el) return Promise.reject(new Error('no element: ' + p.id));
    return Promise.resolve({v: 'value' in el ? el.value : null,
                            focused: document.activeElement === el});
  },
  pull_trace: function () {
    var t = S.trace; S.trace = [];
    return Promise.resolve({trace: t});
  },
  noop: function () { return Promise.resolve({ok: true}); },
};

/* UI buttons drive the SAME commands the runner issues (tap path). */
document.getElementById('fx-create').addEventListener('click', function () {
  CMD.create().catch(function (e) { status('create:' + e); });
});
document.getElementById('fx-join').addEventListener('click', function () {
  var v = document.getElementById('fx-code-input').value.trim();
  CMD.join({code: v}).catch(function (e) { status('join:' + e); });
});
document.getElementById('fx-approve').addEventListener('click', function () {
  CMD.approve().catch(function (e) { status('approve:' + e); });
});
document.getElementById('fx-prev').addEventListener('click', function () {
  CMD.turn({delta: -1}).catch(function (e) { status('turn:' + e); });
});
document.getElementById('fx-next').addEventListener('click', function () {
  CMD.turn({delta: 1}).catch(function (e) { status('turn:' + e); });
});
document.getElementById('fx-swap').addEventListener('click', function () {
  CMD.swap().catch(function (e) { status('swap:' + e); });
});
document.getElementById('fx-dc').addEventListener('click', function () {
  CMD.dc_open().catch(function (e) { status('dc:' + e); });
});
document.getElementById('fx-leave').addEventListener('click', function () {
  CMD.leave().catch(function (e) { status('leave:' + e); });
});

/* real-device input: still/drift taps, swipes, pinch, edge turns all map
 * to real turn intents — the gesture semantics mirror the app's RTL rules
 * (left third = next, right third = prev, horizontal swipe by direction). */
var G = {pts: {}, pinch: false};
document.addEventListener('pointerdown', function (ev) {
  S.lastTap = {x: ev.clientX, y: ev.clientY, t: Date.now()};
  G.pts[ev.pointerId] = {x0: ev.clientX, y0: ev.clientY};
  if (Object.keys(G.pts).length >= 2) G.pinch = true;
}, true);
document.addEventListener('pointerup', function (ev) {
  var g = G.pts[ev.pointerId];
  delete G.pts[ev.pointerId];
  if (!g) return;
  var dx = ev.clientX - g.x0, dy = ev.clientY - g.y0;
  var adx = Math.abs(dx), ady = Math.abs(dy);
  var w = window.innerWidth;
  var kind, delta = 0;
  if (G.pinch) {
    kind = 'pinch';
    if (Object.keys(G.pts).length === 0) G.pinch = false;
  } else if (adx >= 60 && adx > ady * 1.5) {
    kind = 'swipe'; delta = dx < 0 ? 1 : -1;
  } else {
    kind = adx < 12 && ady < 12 ? 'tap' : 'drift-tap';
    var frac = ev.clientX / w;
    if (frac < 0.30) delta = 1;
    else if (frac > 0.70) delta = -1;
  }
  /* taps that land ON a control must not ALSO fire an edge-turn — the bar
   * wraps on narrow screens so a button can sit inside the edge zone
   * (sim_pair_via_taps double-turn bug). The gesture is still recorded. */
  var onCtl = ev.target && ev.target.closest &&
      !!ev.target.closest('#fx-bar, button, input, select, textarea, a');
  S.lastGesture = {kind: kind, dx: dx, delta: delta, t: Date.now()};
  if (delta !== 0 && !onCtl) {
    CMD.turn({delta: delta}).catch(function (e) { status('g:' + e); });
  }
}, true);
document.addEventListener('pointercancel', function (ev) {
  delete G.pts[ev.pointerId];
  if (Object.keys(G.pts).length === 0) G.pinch = false;
}, true);

/* iOS Safari reports multi-touch pinch through the legacy gesture events,
 * not a second pointer — without these, a real device pinch is invisible
 * to lastGesture (sim_device_inputs). */
document.addEventListener('gesturestart', function (ev) {
  S.lastGesture = {kind: 'pinch', dx: 0, delta: 0, t: Date.now()};
}, true);
document.addEventListener('gestureend', function (ev) {
  S.lastGesture = {kind: 'pinch', dx: 0, delta: 0, t: Date.now()};
}, true);

document.addEventListener('visibilitychange', function () {
  S.visLog.push({t: Date.now(), hidden: document.hidden});
}, true);

/* ── control channel (long-poll) ── */
function post(path, obj) {
  return fetch(FXC.ctrlBase + path, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(obj),
  });
}
function poll() {
  /* the server holds /next up to ~25s; if Safari stalls the fetch anyway
   * (rotation/backgrounding can freeze in-flight requests) the control
   * channel must not die with it — abort and repoll instead. */
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController()
                                                     : null;
  var to = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : null;
  fetch(FXC.ctrlBase + '/next?id=' + encodeURIComponent(FXC.id),
        ctl ? {signal: ctl.signal} : {})
    .then(function (r) { return r.json(); })
    .then(function (cmd) {
      if (cmd && cmd.seq) {
        var fn = CMD[cmd.cmd];
        var run = fn ? fn(cmd.params || {})
                     : Promise.reject(new Error('unknown-cmd:' + cmd.cmd));
        Promise.resolve(run).then(function (data) {
          post('/result', {id: FXC.id, seq: cmd.seq, res: {ok: true, data: data}});
        }).catch(function (e) {
          var err = (e && e.reject) ? 'reject:' + e.reject.reason : String(e);
          post('/result', {id: FXC.id, seq: cmd.seq, res: {ok: false, error: err}});
        });
      }
      setTimeout(poll, 25);
    })
    .catch(function () { setTimeout(poll, 600); })
    .finally(function () { if (to) clearTimeout(to); });
}

function loadScript(url) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = url; s.onload = res;
    s.onerror = function () { rej(new Error('load-fail:' + url)); };
    document.head.appendChild(s);
  });
}

Promise.all(FXC.mods.map(loadScript)).then(function () {
  status('modules loaded');
  return post('/hello', {
    id: FXC.id, role: FXC.role, ua: navigator.userAgent,
    hasRTC: typeof RTCPeerConnection !== 'undefined',
    standalone: navigator.standalone === true ||
      (window.matchMedia &&
       window.matchMedia('(display-mode: standalone)').matches),
    mods: !!(window.PairTransport && window.PairModel && window.PairClient),
  });
}).then(function () {
  status('ready');
  /* Reload-resume: stored member credentials mean this page load is a
   * reload of a paired device — resume the pair exactly like the app's
   * boot path does (PairController._boot). The key is pairClient's own
   * STORAGE_KEY ('bookq.readerSync.v1'). */
  try {
    var raw = window.sessionStorage.getItem('bookq.readerSync.v1');
    if (raw && !S.bootResumeTried) {
      S.bootResumeTried = true;
      ensureClient();
      S.client.resume().catch(function (e) { status('boot-resume:' + e); });
    }
  } catch (e) {}
  poll();
}).catch(function (e) {
  status('boot-fail:' + e);
  post('/hello', {id: FXC.id, role: FXC.role, ua: navigator.userAgent,
                  hasRTC: false, mods: false, error: String(e)})
    .finally(function () { poll(); });
});
})();
</script>
